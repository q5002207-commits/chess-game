<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام أحمد - تسجيل الدخول بجوجل</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: radial-gradient(circle at center, #0a0f1a 0%, #03060b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            background: rgba(10,15,25,0.9);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 50px 40px;
            text-align: center;
            border: 1px solid rgba(218,41,28,0.5);
            width: 100%;
            max-width: 420px;
        }
        h1 {
            background: linear-gradient(135deg, #da291c, #ff8c6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
        }
        .google-btn {
            background: white;
            border: none;
            border-radius: 40px;
            padding: 14px 20px;
            width: 100%;
            font-size: 1.1rem;
            font-weight: bold;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            margin: 25px 0;
            transition: 0.2s;
        }
        .google-btn:hover { transform: scale(0.98); background: #f0f0f0; }
        .google-btn img { width: 22px; }
        .user-bar {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            background: rgba(10,15,25,0.85);
            backdrop-filter: blur(12px);
            border-radius: 80px;
            padding: 10px 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
            z-index: 200;
            border: 1px solid rgba(218,41,28,0.4);
        }
        .user-data { display: flex; align-items: center; gap: 15px; }
        .user-avatar { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #da291c; }
        .logout-btn { background: #da291c; border: none; padding: 8px 24px; border-radius: 40px; color: white; cursor: pointer; }
        #game-frame { display: none; width: 100%; height: 100vh; position: fixed; top: 0; left: 0; z-index: 150; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
        .error-msg { color: #ff8a6b; margin-top: 15px; font-size: 0.8rem; display: none; }
    </style>
</head>
<body>

<div class="login-card" id="loginContainer">
    <h1>🔥 AHMED PRO SYSTEM 🔥</h1>
    <p style="color:#aaa; margin-bottom:15px;">تسجيل الدخول بحساب Google</p>
    <button class="google-btn" id="googleBtn">
        <img src="https://www.google.com/favicon.ico"> تسجيل الدخول
    </button>
    <div id="errorMsg" class="error-msg"></div>
</div>

<div id="userBar" class="user-bar">
    <div class="user-data">
        <img id="userAvatar" class="user-avatar">
        <div>
            <div id="userName" style="color:#0f0; font-weight:bold;"></div>
            <div id="userEmail" style="color:#888; font-size:12px;"></div>
        </div>
    </div>
    <button id="logoutBtn" class="logout-btn">🚪 خروج</button>
</div>

<div id="game-frame">
    <iframe id="gameIframe" src="about:blank"></iframe>
</div>

<script>
    // إعدادات Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyALq7wGqzOU414Q3ZQFmqQVY7UpUHYWjY",
        authDomain: "ahmad-e442a.firebaseapp.com",
        projectId: "ahmad-e442a",
        storageBucket: "ahmad-e442a.firebasestorage.app",
        messagingSenderId: "921619843690",
        appId: "1:921619843690:web:5660308178202b7e81d813"
    };
    
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();
    
    // استخدام redirect بدل pop-up
    auth.useDeviceLanguage();
    
    const loginContainer = document.getElementById('loginContainer');
    const userBar = document.getElementById('userBar');
    const gameFrame = document.getElementById('game-frame');
    const gameIframe = document.getElementById('gameIframe');
    const errorMsg = document.getElementById('errorMsg');
    
    function showError(text) {
        errorMsg.innerText = text;
        errorMsg.style.display = 'block';
        setTimeout(() => errorMsg.style.display = 'none', 4000);
    }
    
    async function signIn() {
        try {
            await auth.signInWithRedirect(provider);
        } catch (err) {
            showError('خطأ: ' + err.message);
        }
    }
    
    async function signOut() {
        await auth.signOut();
        loginContainer.style.display = 'block';
        userBar.style.display = 'none';
        gameFrame.style.display = 'none';
        gameIframe.src = 'about:blank';
    }
    
    function showUser(user) {
        loginContainer.style.display = 'none';
        userBar.style.display = 'flex';
        document.getElementById('userName').innerText = user.displayName || user.email;
        document.getElementById('userEmail').innerText = user.email;
        if (user.photoURL) {
            document.getElementById('userAvatar').src = user.photoURL;
        } else {
            document.getElementById('userAvatar').src = 'https://ui-avatars.com/api/?background=da291c&color=fff&name=' + (user.displayName ? user.displayName.charAt(0) : 'A');
        }
        gameFrame.style.display = 'block';
        gameIframe.src = 'https://q5002207-commits.github.io/chess-game/';
    }
    
    // معالج redirect
    auth.getRedirectResult().then((result) => {
        if (result.user) {
            showUser(result.user);
        }
    }).catch((error) => {
        console.error(error);
        if (error.code !== 'auth/unauthorized-domain') {
            showError('خطأ: ' + error.message);
        }
    });
    
    auth.onAuthStateChanged((user) => {
        if (user) {
            showUser(user);
        } else {
            if (window.location.pathname !== '/chess-game/') {
                loginContainer.style.display = 'block';
                userBar.style.display = 'none';
                gameFrame.style.display = 'none';
            }
        }
    });
    
    document.getElementById('googleBtn').onclick = signIn;
    document.getElementById('logoutBtn').onclick = signOut;
</script>
</body>
</html>
