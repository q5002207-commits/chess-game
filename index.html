<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مذكرتي الإسلامية</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f3f4f6;min-height:100vh}
#root{direction:rtl;font-family:'Segoe UI',Tahoma,sans-serif;background:#f3f4f6;min-height:100vh}
.nav{display:flex;background:white;border-bottom:1px solid #e5e7eb;padding:0 8px;position:sticky;top:0;z-index:100}
.nav-btn{flex:1;padding:12px 4px;border:none;background:none;cursor:pointer;font-size:12px;color:#6b7280;display:flex;flex-direction:column;align-items:center;gap:4px;border-bottom:2px solid transparent;transition:color .2s}
.nav-btn i{font-size:20px}
.nav-btn.active{color:#1a6b3c;border-bottom-color:#1a6b3c;font-weight:500}
.page{display:none;padding:16px;animation:fadein .2s}
.page.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.hero{background:#1a6b3c;border-radius:16px;padding:20px;margin-bottom:14px;color:white;text-align:center}
.hero-time{font-size:44px;font-weight:300;letter-spacing:3px;font-variant-numeric:tabular-nums;line-height:1}
.hero-date{font-size:13px;opacity:.75;margin-top:6px}
.hero-divider{height:1px;background:rgba(255,255,255,.2);margin:14px 0}
.hero-next-label{font-size:12px;opacity:.7;margin-bottom:4px}
.hero-next-prayer{font-size:16px;font-weight:500}
.hero-countdown{font-size:28px;font-weight:300;letter-spacing:2px;font-variant-numeric:tabular-nums;margin-top:2px}

.prayer-row{background:white;border-radius:14px;border:1px solid #e5e7eb;padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:12px;transition:border-color .3s}
.prayer-row.is-current{border:2px solid #1a6b3c}
.prayer-row.is-next{border:2px solid #d97706}
.p-dot{width:10px;height:10px;border-radius:50%;background:#d1d5db;flex-shrink:0}
.p-dot.current{background:#1a6b3c}
.p-dot.next{background:#d97706}
.p-name{font-size:15px;font-weight:500;color:#111827;flex:1}
.p-time-val{font-size:15px;font-variant-numeric:tabular-nums;color:#111827}
.p-badge{font-size:11px;padding:2px 8px;border-radius:20px;margin-right:8px;font-weight:500}
.p-badge.current{background:#dcfce7;color:#166534}
.p-badge.next{background:#fef3c7;color:#92400e}

.quran-header{display:flex;gap:8px;margin-bottom:14px}
.quran-header select{flex:1;padding:10px;border-radius:10px;border:1px solid #d1d5db;background:white;color:#111827;font-size:14px;direction:rtl}
.surah-card{background:white;border-radius:16px;border:1px solid #e5e7eb;overflow:hidden}
.surah-title-row{background:#1a6b3c;color:white;padding:16px;text-align:center}
.surah-title-row h2{font-size:20px;font-weight:500}
.surah-title-row p{font-size:12px;opacity:.8;margin-top:4px}
.bismillah-row{text-align:center;padding:16px 20px 8px;font-size:19px;color:#1a6b3c;font-weight:500;border-bottom:1px solid #f3f4f6}
.ayah-row{padding:12px 20px;border-bottom:1px solid #f3f4f6;display:flex;gap:12px;align-items:baseline}
.ayah-row:last-child{border-bottom:none}
.ayah-num{width:26px;height:26px;border-radius:50%;background:#dcfce7;color:#166534;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ayah-text{font-size:19px;line-height:2;color:#111827;text-align:right;flex:1}

.settings-section{margin-bottom:14px}
.settings-label{font-size:12px;font-weight:500;color:#6b7280;margin-bottom:8px;padding:0 2px}
.settings-card{background:white;border-radius:14px;border:1px solid #e5e7eb;overflow:hidden}
.settings-row{padding:12px 16px;border-bottom:1px solid #f3f4f6;display:flex;align-items:center;gap:12px}
.settings-row:last-child{border-bottom:none}
.settings-row-label{font-size:14px;color:#111827;flex:1}
.settings-row-label small{display:block;font-size:12px;color:#6b7280;margin-top:1px}
.t-input{padding:7px 10px;border-radius:8px;border:1px solid #d1d5db;background:#f9fafb;color:#111827;font-size:14px;direction:ltr;width:100px;text-align:center}
.n-input{padding:7px 10px;border-radius:8px;border:1px solid #d1d5db;background:#f9fafb;color:#111827;font-size:14px;width:70px;text-align:center}
.txt-input{padding:7px 10px;border-radius:8px;border:1px solid #d1d5db;background:#f9fafb;color:#111827;font-size:13px;direction:rtl;flex:1}
.toggle{width:46px;height:26px;background:#d1d5db;border-radius:13px;cursor:pointer;position:relative;transition:background .2s;flex-shrink:0;border:none}
.toggle.on{background:#1a6b3c}
.toggle::after{content:'';position:absolute;width:20px;height:20px;background:white;border-radius:50%;top:3px;left:3px;transition:left .2s}
.toggle.on::after{left:23px}
.save-btn{width:100%;padding:13px;background:#1a6b3c;color:white;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;margin-top:6px}
.save-btn:hover{background:#145230}
.test-btn{width:100%;padding:11px;background:#f9fafb;color:#111827;border:1px solid #e5e7eb;border-radius:10px;font-size:14px;cursor:pointer;margin-top:6px}
.test-btn:hover{background:#f3f4f6}

/* البلوك */
.block-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#0f3d22;z-index:9999;align-items:center;justify-content:center}
.block-modal.show{display:flex}
.block-inner{background:#144d2b;border-radius:20px;padding:32px 28px;text-align:center;width:90%;max-width:360px;border:1px solid rgba(255,255,255,.12)}
.block-icon{font-size:52px;margin-bottom:10px}
.block-prayer-lbl{font-size:13px;color:rgba(255,255,255,.65);margin-bottom:4px}
.block-prayer-name{font-size:22px;font-weight:500;color:white;margin-bottom:20px}
.block-countdown-lbl{font-size:12px;color:rgba(255,255,255,.55);margin-bottom:4px}
.block-countdown{font-size:52px;font-weight:300;color:#86efac;letter-spacing:2px;font-variant-numeric:tabular-nums;line-height:1;margin-bottom:24px}
.block-desc{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:16px}
.block-input-fld{width:100%;padding:12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:white;font-size:15px;text-align:center;direction:rtl;margin-bottom:10px}
.block-input-fld::placeholder{color:rgba(255,255,255,.35)}
.block-err{font-size:12px;color:#fca5a5;min-height:18px;margin-bottom:10px}
.block-confirm-btn{width:100%;padding:13px;background:#16a34a;color:white;border:none;border-radius:10px;font-size:15px;font-weight:500;cursor:pointer}
.block-confirm-btn:hover{background:#15803d}
.block-hint{font-size:11px;color:rgba(255,255,255,.3);margin-top:14px}
</style>
</head>
<body>

<div id="root">

  <!-- شاشة البلوك -->
  <div class="block-modal" id="blockModal">
    <div class="block-inner">
      <div class="block-icon">🕌</div>
      <div class="block-prayer-lbl">حان وقت صلاة</div>
      <div class="block-prayer-name" id="bPrayerName">الفجر</div>
      <div class="block-countdown-lbl">الوقت المتبقي</div>
      <div class="block-countdown" id="bCountdown">15:00</div>
      <div class="block-desc">لفك البلوك، اكتب العبارة بالضبط:</div>
      <input class="block-input-fld" type="text" id="bInput" placeholder="اكتب عبارة الحلف هنا...">
      <div class="block-err" id="bErr"></div>
      <button class="block-confirm-btn" onclick="tryUnblock()">تأكيد وفك البلوك</button>
      <div class="block-hint">سينتهي البلوك تلقائياً بعد انتهاء العداد</div>
    </div>
  </div>

  <!-- التطبيق الرئيسي -->
  <div id="mainApp">
    <div class="nav">
      <button class="nav-btn active" onclick="goPage('home',this)">
        <i class="ti ti-calendar"></i>الصلوات
      </button>
      <button class="nav-btn" onclick="goPage('quran',this)">
        <i class="ti ti-book"></i>القرآن
      </button>
      <button class="nav-btn" onclick="goPage('settings',this)">
        <i class="ti ti-adjustments-alt"></i>الإعدادات
      </button>
    </div>

    <!-- صفحة الصلوات -->
    <div id="pg-home" class="page active">
      <div class="hero">
        <div class="hero-time" id="hTime">00:00:00</div>
        <div class="hero-date" id="hDate"></div>
        <div class="hero-divider"></div>
        <div class="hero-next-label">الصلاة القادمة</div>
        <div class="hero-next-prayer" id="hNextName">—</div>
        <div class="hero-countdown" id="hCountdown">--:--</div>
      </div>
      <div id="prayerList"></div>
    </div>

    <!-- صفحة القرآن -->
    <div id="pg-quran" class="page">
      <div class="quran-header">
        <select id="surahSel" onchange="loadSurah()">
          <option value="">اختر سورة...</option>
        </select>
      </div>
      <div id="surahDisplay" class="surah-card" style="display:none"></div>
    </div>

    <!-- صفحة الإعدادات -->
    <div id="pg-settings" class="page">
      <div class="settings-section">
        <div class="settings-label">أوقات الصلوات</div>
        <div class="settings-card" id="timeInputs"></div>
        <button class="save-btn" onclick="saveTimes()">حفظ الأوقات</button>
      </div>
      <div class="settings-section">
        <div class="settings-label">إعدادات البلوك</div>
        <div class="settings-card">
          <div class="settings-row">
            <div class="settings-row-label">تفعيل البلوك<small>يمنع الاستخدام عند وقت الصلاة</small></div>
            <button class="toggle on" id="blockToggle" onclick="this.classList.toggle('on');blockEnabled=this.classList.contains('on')"></button>
          </div>
          <div class="settings-row">
            <div class="settings-row-label">مدة البلوك<small>بالدقائق</small></div>
            <input class="n-input" type="number" id="durInput" value="15" min="5" max="60" step="5">
          </div>
          <div class="settings-row">
            <div class="settings-row-label">عبارة فك البلوك<small>اكتبها بالضبط لفك البلوك</small></div>
            <input class="txt-input" type="text" id="oathInput" value="والله صليت">
          </div>
        </div>
        <button class="save-btn" onclick="saveBlockConf()">حفظ الإعدادات</button>
        <button class="test-btn" onclick="triggerBlock('الفجر')">تجربة شاشة البلوك</button>
      </div>
    </div>
  </div>
</div>

<script>
const PRAYERS = [
  { name: 'الفجر',   icon: 'ti-moon',       def: '04:30' },
  { name: 'الظهر',   icon: 'ti-sun',        def: '12:00' },
  { name: 'العصر',   icon: 'ti-cloud-sun',  def: '15:30' },
  { name: 'المغرب',  icon: 'ti-sunset',     def: '18:20' },
  { name: 'العشاء',  icon: 'ti-moon-stars', def: '20:00' }
];

const QURAN = {
  'الفاتحة': { ayahs: 7, type: 'مكية', data: [
    'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ',
    'الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ',
    'الرَّحْمَٰنِ الرَّحِيمِ',
    'مَالِكِ يَوْمِ الدِّينِ',
    'إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ',
    'اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ',
    'صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ'
  ]},
  'الإخلاص': { ayahs: 4, type: 'مكية', data: [
    'قُلْ هُوَ اللَّهُ أَحَدٌ',
    'اللَّهُ الصَّمَدُ',
    'لَمْ يَلِدْ وَلَمْ يُولَدْ',
    'وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ'
  ]},
  'الفلق': { ayahs: 5, type: 'مكية', data: [
    'قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ',
    'مِن شَرِّ مَا خَلَقَ',
    'وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ',
    'وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ',
    'وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ'
  ]},
  'الناس': { ayahs: 6, type: 'مكية', data: [
    'قُلْ أَعُوذُ بِرَبِّ النَّاسِ',
    'مَلِكِ النَّاسِ',
    'إِلَٰهِ النَّاسِ',
    'مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ',
    'الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ',
    'مِنَ الْجِنَّةِ وَالنَّاسِ'
  ]},
  'الملك': { ayahs: 30, type: 'مكية', data: [
    'تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ',
    'الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا وَهُوَ الْعَزِيزُ الْغَفُورُ',
    'الَّذِي خَلَقَ سَبْعَ سَمَاوَاتٍ طِبَاقًا مَّا تَرَىٰ فِي خَلْقِ الرَّحْمَٰنِ مِن تَفَاوُتٍ فَارْجِعِ الْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍ',
    'ثُمَّ ارْجِعِ الْبَصَرَ كَرَّتَيْنِ يَنقَلِبْ إِلَيْكَ الْبَصَرُ خَاسِئًا وَهُوَ حَسِيرٌ',
    'وَلَقَدْ زَيَّنَّا السَّمَاءَ الدُّنْيَا بِمَصَابِيحَ وَجَعَلْنَاهَا رُجُومًا لِّلشَّيَاطِينِ وَأَعْتَدْنَا لَهُمْ عَذَابَ السَّعِيرِ'
  ]},
  'الرحمن': { ayahs: 78, type: 'مدنية', data: [
    'الرَّحْمَٰنُ', 'عَلَّمَ الْقُرْآنَ', 'خَلَقَ الْإِنسَانَ', 'عَلَّمَهُ الْبَيَانَ',
    'الشَّمْسُ وَالْقَمَرُ بِحُسْبَانٍ', 'وَالنَّجْمُ وَالشَّجَرُ يَسْجُدَانِ',
    'وَالسَّمَاءَ رَفَعَهَا وَوَضَعَ الْمِيزَانَ', 'أَلَّا تَطْغَوْا فِي الْمِيزَانِ',
    'وَأَقِيمُوا الْوَزْنَ بِالْقِسْطِ وَلَا تُخْسِرُوا الْمِيزَانَ',
    'وَالْأَرْضَ وَضَعَهَا لِلْأَنَامِ', 'فِيهَا فَاكِهَةٌ وَالنَّخْلُ ذَاتُ الْأَكْمَامِ',
    'وَالْحَبُّ ذُو الْعَصْفِ وَالرَّيْحَانُ', 'فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ'
  ]},
  'يس': { ayahs: 83, type: 'مكية', data: [
    'يس', 'وَالْقُرْآنِ الْحَكِيمِ', 'إِنَّكَ لَمِنَ الْمُرْسَلِينَ',
    'عَلَىٰ صِرَاطٍ مُّسْتَقِيمٍ', 'تَنزِيلَ الْعَزِيزِ الرَّحِيمِ'
  ]}
};

const SURAH_LIST = [
  'الفاتحة','البقرة','آل عمران','النساء','المائدة','الأنعام',
  'الإخلاص','الفلق','الناس','الملك','الرحمن','يس'
];

let pTimes = {}, blockEnabled = true, blockDur = 15, oathPhrase = 'والله صليت';
let bInterval = null, bSecs = 0, activeBlockPrayer = '';
let firedToday = {};

function load() {
  PRAYERS.forEach(p => { pTimes[p.name] = localStorage.getItem('pt_' + p.name) || p.def; });
  blockEnabled = localStorage.getItem('bEnabled') !== 'false';
  blockDur = parseInt(localStorage.getItem('bDur') || '15');
  oathPhrase = localStorage.getItem('bOath') || 'والله صليت';
  const dk = new Date().toDateString();
  try { firedToday = JSON.parse(localStorage.getItem('fired_' + dk) || '{}'); } catch(e) { firedToday = {}; }
}

function goPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('pg-' + id).classList.add('active');
  btn.classList.add('active');
  if (id === 'settings') renderSettingsInputs();
}

function tm2m(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }
function getNowMinutes() { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); }

function getStatus() {
  const nowM = getNowMinutes();
  let cur = null, nxt = null, diff = 0;
  for (let i = 0; i < PRAYERS.length; i++) {
    const pt = tm2m(pTimes[PRAYERS[i].name]);
    const nextPt = i < PRAYERS.length - 1 ? tm2m(pTimes[PRAYERS[i + 1].name]) : 24 * 60;
    if (nowM >= pt && nowM < nextPt) { cur = PRAYERS[i]; nxt = PRAYERS[i + 1] || PRAYERS[0]; break; }
  }
  if (!cur) nxt = PRAYERS[0];
  if (nxt) { let nd = tm2m(pTimes[nxt.name]) - nowM; if (nd < 0) nd += 24 * 60; diff = nd; }
  return { cur, nxt, diff };
}

function fmtMins(m) { return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); }

function renderPrayers() {
  const { cur, nxt } = getStatus();
  document.getElementById('prayerList').innerHTML = PRAYERS.map(p => {
    const isCur = cur && cur.name === p.name;
    const isNxt = nxt && nxt.name === p.name && !isCur;
    return `<div class="prayer-row${isCur ? ' is-current' : isNxt ? ' is-next' : ''}">
      <div class="p-dot${isCur ? ' current' : isNxt ? ' next' : ''}"></div>
      <div class="p-name">
        <i class="ti ${p.icon}" style="font-size:16px;margin-left:6px;color:${isCur ? '#1a6b3c' : isNxt ? '#d97706' : '#9ca3af'}"></i>${p.name}
      </div>
      ${isCur ? '<span class="p-badge current">الآن</span>' : isNxt ? '<span class="p-badge next">التالية</span>' : ''}
      <div class="p-time-val">${pTimes[p.name]}</div>
    </div>`;
  }).join('');
}

function updateClock() {
  const n = new Date();
  const t = n.toLocaleTimeString('ar', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const d = n.toLocaleDateString('ar', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
  document.getElementById('hTime').textContent = t;
  document.getElementById('hDate').textContent = d;
  const { nxt, diff } = getStatus();
  document.getElementById('hNextName').textContent = nxt ? nxt.name : '—';
  document.getElementById('hCountdown').textContent = nxt ? fmtMins(diff) : '--:--';
  renderPrayers();
  checkPrayerFire(n);
}

function checkPrayerFire(n) {
  if (!blockEnabled) return;
  const h = n.getHours(), m = n.getMinutes(), s = n.getSeconds();
  if (s > 5) return;
  const dk = n.toDateString();
  PRAYERS.forEach(p => {
    const [ph, pm] = pTimes[p.name].split(':').map(Number);
    if (h === ph && m === pm && !firedToday[p.name]) {
      firedToday[p.name] = true;
      localStorage.setItem('fired_' + dk, JSON.stringify(firedToday));
      triggerBlock(p.name);
    }
  });
}

function triggerBlock(pName) {
  activeBlockPrayer = pName;
  bSecs = blockDur * 60;
  document.getElementById('bPrayerName').textContent = pName;
  document.getElementById('bInput').value = '';
  document.getElementById('bErr').textContent = '';
  document.getElementById('blockModal').classList.add('show');
  updateBCountdown();
  if (bInterval) clearInterval(bInterval);
  bInterval = setInterval(() => {
    bSecs--;
    updateBCountdown();
    if (bSecs <= 0) { clearInterval(bInterval); closeBlock(); }
  }, 1000);
}

function updateBCountdown() {
  const m = Math.floor(bSecs / 60), s = bSecs % 60;
  document.getElementById('bCountdown').textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function closeBlock() {
  document.getElementById('blockModal').classList.remove('show');
}

function tryUnblock() {
  const val = document.getElementById('bInput').value.trim();
  if (val === oathPhrase) {
    clearInterval(bInterval);
    closeBlock();
  } else {
    document.getElementById('bErr').textContent = 'العبارة غير صحيحة، حاول مجدداً';
    document.getElementById('bInput').value = '';
    document.getElementById('bInput').style.borderColor = '#f87171';
    setTimeout(() => { document.getElementById('bInput').style.borderColor = ''; }, 1500);
  }
}

function fillSurahSel() {
  const sel = document.getElementById('surahSel');
  SURAH_LIST.forEach((s, i) => {
    const o = document.createElement('option');
    o.value = s; o.textContent = (i + 1) + '. سورة ' + s;
    sel.appendChild(o);
  });
}

function loadSurah() {
  const name = document.getElementById('surahSel').value;
  const disp = document.getElementById('surahDisplay');
  if (!name) { disp.style.display = 'none'; return; }
  const s = QURAN[name];
  disp.style.display = 'block';
  if (!s) {
    disp.innerHTML = `<div class="surah-title-row"><h2>سورة ${name}</h2><p>غير متوفرة في هذه النسخة</p></div>
    <div style="padding:24px;text-align:center;color:#6b7280;font-size:14px">الفاتحة، الإخلاص، الفلق، الناس، الملك، الرحمن، يس — متوفرة كاملة</div>`;
    return;
  }
  const showB = name !== 'الفاتحة' && name !== 'التوبة';
  disp.innerHTML = `<div class="surah-title-row"><h2>سورة ${name}</h2><p>${s.ayahs} آية &mdash; ${s.type}</p></div>
  ${showB ? '<div class="bismillah-row">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>' : ''}
  ${s.data.map((a, i) => `<div class="ayah-row"><div class="ayah-num">${i + 1}</div><div class="ayah-text">${a}</div></div>`).join('')}`;
}

function renderSettingsInputs() {
  document.getElementById('timeInputs').innerHTML = PRAYERS.map(p => `
    <div class="settings-row">
      <div class="settings-row-label">
        <i class="ti ${p.icon}" style="font-size:16px;margin-left:6px;color:#1a6b3c"></i>${p.name}
      </div>
      <input class="t-input" type="time" id="pi_${p.name}" value="${pTimes[p.name]}">
    </div>`).join('');
  document.getElementById('durInput').value = blockDur;
  document.getElementById('oathInput').value = oathPhrase;
  const tog = document.getElementById('blockToggle');
  if (blockEnabled) tog.classList.add('on'); else tog.classList.remove('on');
}

function saveTimes() {
  PRAYERS.forEach(p => {
    const el = document.getElementById('pi_' + p.name);
    if (el) { pTimes[p.name] = el.value; localStorage.setItem('pt_' + p.name, el.value); }
  });
  renderPrayers();
  alert('تم حفظ أوقات الصلوات ✓');
}

function saveBlockConf() {
  blockDur = parseInt(document.getElementById('durInput').value) || 15;
  oathPhrase = document.getElementById('oathInput').value.trim() || 'والله صليت';
  blockEnabled = document.getElementById('blockToggle').classList.contains('on');
  localStorage.setItem('bDur', blockDur);
  localStorage.setItem('bOath', oathPhrase);
  localStorage.setItem('bEnabled', blockEnabled);
  alert('تم حفظ الإعدادات ✓');
}

load();
fillSurahSel();
updateClock();
setInterval(updateClock, 1000);
</script>
</body>
</html>
