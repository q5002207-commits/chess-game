<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🙏 حامي الصلاة - تذكير + حظر + قرآن</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #fff;
            min-height: 100vh;
        }
        
        /* شاشة تسجيل الدخول */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.96);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.5s ease;
        }
        .login-card {
            background: linear-gradient(145deg, #111, #1a1a1a);
            border-radius: 40px;
            padding: 40px 30px;
            text-align: center;
            border: 2px solid #da291c;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 25px 50px rgba(218,41,28,0.2);
        }
        .login-card h1 {
            background: linear-gradient(135deg, #da291c, #ff6b4a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 15px;
            font-size: 1.8rem;
        }
        .google-btn {
            background: white;
            border: none;
            border-radius: 50px;
            padding: 14px;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            margin: 20px 0;
            transition: transform 0.1s;
        }
        .google-btn:active { transform: scale(0.97); }
        .google-btn img { width: 22px; }
        
        /* شريط المستخدم */
        .user-bar {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border-radius: 60px;
            padding: 8px 16px;
            display: none;
            align-items: center;
            justify-content: space-between;
            z-index: 10001;
            border: 1px solid #da291c;
            flex-wrap: wrap;
            gap: 8px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid #da291c;
            object-fit: cover;
        }
        .user-name {
            color: #da291c;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .logout-btn {
            background: #da291c;
            border: none;
            padding: 6px 16px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        
        /* القائمة الرئيسية */
        .main-container {
            display: none;
            padding: 80px 16px 30px 16px;
            max-width: 500px;
            margin: 0 auto;
        }
        .main-title {
            text-align: center;
            color: #da291c;
            font-size: 1.8rem;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(218,41,28,0.3);
        }
        .menu-btn {
            display: block;
            width: 100%;
            padding: 22px;
            margin: 12px 0;
            background: linear-gradient(135deg, #111, #1a1a1a);
            border: 2px solid #da291c;
            color: white;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .menu-btn:active {
            transform: scale(0.97);
            background: #da291c;
        }
        
        /* أقسام الصلاة */
        .section {
            display: none;
            padding: 80px 16px 30px 16px;
            max-width: 600px;
            margin: 0 auto;
        }
        .back-home {
            position: fixed;
            top: 70px;
            right: 16px;
            background: #333;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            z-index: 100;
            font-weight: bold;
        }
        .prayer-times {
            background: #111;
            border-radius: 30px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #da291c;
        }
        .prayer-item {
            display: flex;
            justify-content: space-between;
            padding: 14px;
            border-bottom: 1px solid #2a2a2a;
            font-size: 1.1rem;
        }
        .prayer-name { font-weight: bold; color: #da291c; }
        .prayer-time { font-family: monospace; font-size: 1.2rem; color: #0f0; }
        .next-prayer {
            background: #da291c;
            padding: 15px;
            border-radius: 60px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }
        
        /* حاجب الصلاة */
        .prayer-blocker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.98);
            z-index: 20000;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 30px;
            backdrop-filter: blur(15px);
        }
        .blocker-card {
            background: #111;
            border: 3px solid #da291c;
            border-radius: 60px;
            padding: 40px 25px;
            text-align: center;
            width: 90%;
            max-width: 350px;
        }
        .blocker-card h2 { color: #da291c; margin-bottom: 15px; }
        .blocker-card p { margin: 15px 0; line-height: 1.6; }
        .swear-btn {
            background: #2ecc71;
            border: none;
            padding: 15px 30px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 20px;
        }
        
        /* قسم القرآن */
        .quran-sura-list {
            background: #111;
            border-radius: 30px;
            padding: 15px;
            max-height: 500px;
            overflow-y: auto;
        }
        .sura-item {
            padding: 14px;
            border-bottom: 1px solid #2a2a2a;
            cursor: pointer;
            transition: background 0.1s;
        }
        .sura-item:active { background: #da291c20; }
        .sura-name { font-weight: bold; color: #da291c; }
        .sura-verses { font-size: 0.8rem; color: #aaa; }
        .quran-viewer {
            background: #0a0a0a;
            border-radius: 20px;
            padding: 20px;
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #da291c;
            font-size: 1.3rem;
            line-height: 2;
            text-align: center;
        }
        .quran-ayah {
            margin: 15px 0;
            padding: 10px;
            border-bottom: 1px solid #333;
        }
        
        /* مؤقت العد التنازلي */
        .countdown {
            background: #000;
            padding: 10px;
            border-radius: 40px;
            text-align: center;
            margin-top: 10px;
            font-size: 1.2rem;
            color: #ff0;
        }
        
        .hidden { display: none; }
        button { cursor: pointer; }
    </style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <h1>🕌 حامي الصلاة 🕌</h1>
        <p style="color:#aaa; margin-bottom:10px;">تذكير + حظر تطبيقات + قرآن</p>
        <button class="google-btn" id="googleLoginBtn">
            <img src="https://www.google.com/favicon.ico"> سجل دخول بجوجل
        </button>
        <div id="loginError" style="color:#e74c3c; font-size:0.8rem; margin-top:10px;"></div>
    </div>
</div>

<!-- شريط المستخدم -->
<div id="userBar" class="user-bar">
    <div class="user-info">
        <img id="userAvatar" class="user-avatar">
        <span id="userName" class="user-name"></span>
    </div>
    <button id="logoutBtn" class="logout-btn">🚪 خروج</button>
</div>

<!-- القائمة الرئيسية -->
<div id="mainContainer" class="main-container">
    <div class="main-title">🙏 حامي الصلاة</div>
    <button class="menu-btn" onclick="showSection('prayer')">🕌 أوقات الصلاة و الحاجب</button>
    <button class="menu-btn" onclick="showSection('quran')">📖 المصحف الشريف</button>
</div>

<!-- قسم الصلاة -->
<div id="prayerSection" class="section">
    <button class="back-home" onclick="showSection('main')">🏠 الرئيسية</button>
    <div id="prayerContent">
        <div class="next-prayer" id="nextPrayerDisplay">⏳ جاري تحميل أوقات الصلاة...</div>
        <div class="prayer-times" id="prayerTimesList"></div>
    </div>
</div>

<!-- قسم القرآن -->
<div id="quranSection" class="section">
    <button class="back-home" onclick="showSection('main')">🏠 الرئيسية</button>
    <div class="quran-sura-list" id="suraList"></div>
    <div id="quranViewer" class="quran-viewer hidden"></div>
</div>

<script>
    // ===================== Firebase Config =====================
    const firebaseConfig = {
        apiKey: "AIzaSyAlq7wGqzoU414Q3ZQFmqQvyY7UpUHYWjY",
        authDomain: "ahmad-e442a.firebaseapp.com",
        projectId: "ahmad-e442a",
        storageBucket: "ahmad-e442a.firebasestorage.app",
        messagingSenderId: "921619843690",
        appId: "1:921619843690:web:5660308178202b7e81d813"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    // ===================== عناصر DOM =====================
    const loginOverlay = document.getElementById('loginOverlay');
    const userBar = document.getElementById('userBar');
    const mainContainer = document.getElementById('mainContainer');
    const prayerSection = document.getElementById('prayerSection');
    const quranSection = document.getElementById('quranSection');
    
    // ===================== نظام حظر الصلاة =====================
    let prayerTimes = {};
    let nextPrayerName = "";
    let nextPrayerTime = null;
    let blockerActive = false;
    let blockerInterval = null;
    
    // أسماء الصلوات
    const prayerNames = {
        Fajr: "الفجر",
        Sunrise: "الشروق",
        Dhuhr: "الظهر",
        Asr: "العصر",
        Maghrib: "المغرب",
        Isha: "العشاء"
    };
    
    // الحصول على أوقات الصلاة حسب الموقع
    async function fetchPrayerTimes() {
        try {
            // الحصول على موقع المستخدم
            const position = await new Promise((resolve, reject) => {
                navigator.geolocation.getCurrentPosition(resolve, reject);
            });
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            
            // استخدام API مجاني
            const response = await fetch(`https://api.aladhan.com/v1/timings/${Math.floor(Date.now()/1000)}?latitude=${lat}&longitude=${lon}&method=2`);
            const data = await response.json();
            
            if(data.code === 200) {
                const timings = data.data.timings;
                prayerTimes = {
                    Fajr: timings.Fajr,
                    Sunrise: timings.Sunrise,
                    Dhuhr: timings.Dhuhr,
                    Asr: timings.Asr,
                    Maghrib: timings.Maghrib,
                    Isha: timings.Isha
                };
                updatePrayerDisplay();
                startBlockerChecker();
                return true;
            }
        } catch(e) {
            console.log("خطأ في تحديد الموقع أو API");
        }
        
        // بيانات افتراضية في حال فشل التحميل
        prayerTimes = {
            Fajr: "05:30",
            Sunrise: "06:45",
            Dhuhr: "12:30",
            Asr: "16:00",
            Maghrib: "18:30",
            Isha: "20:00"
        };
        updatePrayerDisplay();
        startBlockerChecker();
        return false;
    }
    
    function timeToMinutes(timeStr) {
        let [hours, minutes] = timeStr.split(':');
        return parseInt(hours) * 60 + parseInt(minutes);
    }
    
    function getCurrentMinutes() {
        const now = new Date();
        return now.getHours() * 60 + now.getMinutes();
    }
    
    function getNextPrayer() {
        const nowMin = getCurrentMinutes();
        let next = null;
        let nextName = null;
        
        const order = ["Fajr", "Dhuhr", "Asr", "Maghrib", "Isha"];
        
        for(let prayer of order) {
            if(prayerTimes[prayer]) {
                const prayerMin = timeToMinutes(prayerTimes[prayer]);
                if(prayerMin > nowMin) {
                    next = prayerMin;
                    nextName = prayer;
                    break;
                }
            }
        }
        
        if(!nextName && prayerTimes.Fajr) {
            next = timeToMinutes(prayerTimes.Fajr) + 1440;
            nextName = "Fajr";
        }
        
        return { name: nextName, minutes: next };
    }
    
    function updatePrayerDisplay() {
        const container = document.getElementById('prayerTimesList');
        if(!container) return;
        
        let html = '';
        for(let [key, time] of Object.entries(prayerTimes)) {
            html += `
                <div class="prayer-item">
                    <span class="prayer-name">${prayerNames[key] || key}</span>
                    <span class="prayer-time">${time}</span>
                </div>
            `;
        }
        container.innerHTML = html;
        
        const next = getNextPrayer();
        if(next.name) {
            nextPrayerName = next.name;
            const now = new Date();
            const targetDate = new Date();
            targetDate.setHours(0, next.minutes % 1440, 0, 0);
            if(next.minutes >= 1440) targetDate.setDate(targetDate.getDate() + 1);
            
            const diffSec = Math.floor((targetDate - now) / 1000);
            if(diffSec > 0) {
                const hours = Math.floor(diffSec / 3600);
                const mins = Math.floor((diffSec % 3600) / 60);
                const secs = diffSec % 60;
                document.getElementById('nextPrayerDisplay').innerHTML = `🕌 الصلاة القادمة: ${prayerNames[next.name]}<br>⏰ ${hours} ساعة ${mins} دقيقة ${secs} ثانية`;
            } else {
                document.getElementById('nextPrayerDisplay').innerHTML = `🕌 الصلاة القادمة: ${prayerNames[next.name]}<br>⏰ الآن!`;
            }
        }
    }
    
    // حاجب الشاشة (يمنع الوصول للتطبيقات)
    function showPrayerBlocker() {
        if(blockerActive) return;
        blockerActive = true;
        
        // إزالة أي حاجب قديم
        const oldBlocker = document.getElementById('prayerBlocker');
        if(oldBlocker) oldBlocker.remove();
        
        const blockerDiv = document.createElement('div');
        blockerDiv.id = 'prayerBlocker';
        blockerDiv.className = 'prayer-blocker';
        blockerDiv.innerHTML = `
            <div class="blocker-card">
                <h2>🔔 حان وقت ${prayerNames[nextPrayerName] || 'الصلاة'} 🔔</h2>
                <p>📖 {ربِّ اجعلني مقيم الصلاة}</p>
                <p>⚠️ التطبيقات مغلقة حتى تصلي ⚠️</p>
                <p style="color:#ff0;">✋ أحلف بالله العظيم أني أديت صلاة ${prayerNames[nextPrayerName] || 'الصلاة'} كاملة ✋</p>
                <button class="swear-btn" id="swearPrayerBtn">✅ حلفت وصليت → فتح التطبيقات</button>
            </div>
        `;
        document.body.appendChild(blockerDiv);
        
        document.getElementById('swearPrayerBtn').onclick = () => {
            blockerDiv.remove();
            blockerActive = false;
            // تحديث المؤقت بعد فك الحظر
            updatePrayerDisplay();
        };
        
        // منع الضغط على أي شيء خارج الحاجب
        blockerDiv.onclick = (e) => { if(e.target === blockerDiv) return; };
    }
    
    function startBlockerChecker() {
        if(blockerInterval) clearInterval(blockerInterval);
        
        blockerInterval = setInterval(() => {
            if(blockerActive) return;
            
            const nowMin = getCurrentMinutes();
            const next = getNextPrayer();
            
            if(next.name) {
                const prayerMin = timeToMinutes(prayerTimes[next.name]);
                let diff = prayerMin - nowMin;
                if(diff < 0) diff += 1440;
                
                // إذا كان وقت الصلاة الحالي (في خلال 10 دقائق من وقتها) ولم يبق إلا 0-1 دقيقة
                if(diff <= 1 && diff >= -5) {
                    nextPrayerName = next.name;
                    showPrayerBlocker();
                }
            }
            
            updatePrayerDisplay();
        }, 1000);
    }
    
    // ===================== القرآن الكريم =====================
    const surahs = [
        { id: 1, name: "الفاتحة", verses: 7 },
        { id: 112, name: "الإخلاص", verses: 4 },
        { id: 113, name: "الفلق", verses: 5 },
        { id: 114, name: "الناس", verses: 6 },
        { id: 109, name: "الكافرون", verses: 6 },
        { id: 110, name: "النصر", verses: 3 },
        { id: 111, name: "المسد", verses: 5 },
        { id: 97, name: "القدر", verses: 5 },
        { id: 99, name: "الزلزلة", verses: 8 },
        { id: 102, name: "التكاثر", verses: 8 },
        { id: 103, name: "العصر", verses: 3 },
        { id: 104, name: "الهمزة", verses: 9 },
        { id: 105, name: "الفيل", verses: 5 },
        { id: 106, name: "قريش", verses: 4 },
        { id: 107, name: "الماعون", verses: 7 },
        { id: 108, name: "الكوثر", verses: 3 }
    ];
    
    async function loadSurah(surahId) {
        const viewer = document.getElementById('quranViewer');
        viewer.classList.remove('hidden');
        viewer.innerHTML = '<div style="text-align:center;">⏳ جاري تحميل السورة...</div>';
        
        try {
            const response = await fetch(`https://api.alquran.cloud/v1/surah/${surahId}/ar`);
            const data = await response.json();
            
            if(data.data && data.data.ayahs) {
                let html = `<h3 style="color:#da291c; text-align:center;">سورة ${data.data.name}</h3>`;
                data.data.ayahs.forEach(ayah => {
                    html += `<div class="quran-ayah">${ayah.text}</div>`;
                });
                viewer.innerHTML = html;
            } else {
                viewer.innerHTML = '<p style="color:red;">خطأ في تحميل السورة</p>';
            }
        } catch(e) {
            viewer.innerHTML = '<p style="color:red;">فشل التحميل، تأكد من اتصال الإنترنت</p>';
        }
    }
    
    function buildSuraList() {
        const container = document.getElementById('suraList');
        if(!container) return;
        
        let html = '';
        surahs.forEach(sura => {
            html += `
                <div class="sura-item" onclick="loadSurah(${sura.id})">
                    <div class="sura-name">📖 ${sura.name}</div>
                    <div class="sura-verses">${sura.verses} آيات</div>
                </div>
            `;
        });
        container.innerHTML = html;
    }
    
    // ===================== إظهار الأقسام =====================
    window.showSection = function(section) {
        mainContainer.style.display = 'none';
        prayerSection.style.display = 'none';
        quranSection.style.display = 'none';
        
        if(section === 'main') {
            mainContainer.style.display = 'block';
        } else if(section === 'prayer') {
            prayerSection.style.display = 'block';
            fetchPrayerTimes();
        } else if(section === 'quran') {
            quranSection.style.display = 'block';
            buildSuraList();
        }
    };
    
    // ===================== تسجيل الدخول =====================
    async function signIn() {
        try {
            const result = await auth.signInWithPopup(provider);
            const user = result.user;
            loginOverlay.style.display = 'none';
            userBar.style.display = 'flex';
            mainContainer.style.display = 'block';
            document.getElementById('userName').innerText = user.displayName || user.email;
            document.getElementById('userAvatar').src = user.photoURL || 'https://ui-avatars.com/api/?background=da291c&color=fff&name=' + (user.displayName ? user.displayName.charAt(0) : 'A');
            
            // بدء نظام الصلاة تلقائياً
            fetchPrayerTimes();
        } catch(err) {
            document.getElementById('loginError').innerText = 'خطأ: ' + err.message;
        }
    }
    
    async function signOut() {
        await auth.signOut();
        loginOverlay.style.display = 'flex';
        userBar.style.display = 'none';
        mainContainer.style.display = 'none';
        prayerSection.style.display = 'none';
        quranSection.style.display = 'none';
        if(blockerInterval) clearInterval(blockerInterval);
    }
    
    auth.onAuthStateChanged((user) => {
        if(user) {
            loginOverlay.style.display = 'none';
            userBar.style.display = 'flex';
            mainContainer.style.display = 'block';
            document.getElementById('userName').innerText = user.displayName || user.email;
            document.getElementById('userAvatar').src = user.photoURL || 'https://ui-avatars.com/api/?background=da291c&color=fff&name=' + (user.displayName ? user.displayName.charAt(0) : 'A');
            fetchPrayerTimes();
        } else {
            loginOverlay.style.display = 'flex';
            userBar.style.display = 'none';
            mainContainer.style.display = 'none';
        }
    });
    
    document.getElementById('googleLoginBtn').onclick = signIn;
    document.getElementById('logoutBtn').onclick = signOut;
    
    // تحديث المؤقت كل ثانية
    setInterval(() => {
        if(prayerTimes && Object.keys(prayerTimes).length > 0) {
            updatePrayerDisplay();
        }
    }, 1000);
</script>
</body>
</html>
