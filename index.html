<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>AHMED PRO SYSTEM - النظام الكامل</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">

<style>
*{
    touch-action:manipulation;
    user-select:none;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:'Segoe UI',Tahoma,sans-serif;
    background:#000;
    color:#0f0;
    margin:0;
    padding:10px;
    overflow-x:hidden;
}

/* ================= القائمة ================= */

#main-menu{
    text-align:center;
    margin-top:40px;
    width:100%;
    max-width:500px;
    margin-inline:auto;
}

.menu-btn{
    display:block;
    width:100%;
    padding:25px;
    margin:15px 0;
    background:#111;
    border:2px solid #da291c;
    color:white;
    border-radius:15px;
    font-size:1.2em;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

.menu-btn:hover{
    background:#da291c;
    box-shadow:0 0 20px #da291c;
}

.hidden{
    display:none;
}

.back-home{
    background:#333;
    color:#fff;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;
    margin-bottom:10px;
    border:none;
    font-size:.8em;
}

.header{
    width:100%;
    max-width:500px;
    background:#da291c;
    padding:12px;
    border-radius:12px;
    text-align:center;
    color:white;
    margin:0 auto 10px auto;
}

/* ================= لعبة القفز ================= */

#jump-section{
    width:100%;
}

.game-container{
    background:#2c4a2e;
    border-radius:40px;
    padding:15px;
    box-shadow:0 20px 35px rgba(0,0,0,.5);
    border:2px solid #d4af37;
    text-align:center;
    max-width:1000px;
    width:100%;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    justify-content:center;
    margin:auto;
}

.game-main{
    flex:2;
    min-width:280px;
}

.shop-sidebar{
    background:#1f2a1bdd;
    backdrop-filter:blur(10px);
    border-radius:30px;
    padding:15px;
    width:220px;
    border:1px solid gold;
    align-self:start;
}

canvas{
    display:block;
    margin:0 auto;
    border-radius:20px;
    background:#2c3e50;
    width:100%;
    height:auto;
}

.score-board{
    display:flex;
    justify-content:space-between;
    margin-bottom:15px;
    gap:10px;
    flex-wrap:wrap;
}

.score-card{
    background:#000000aa;
    padding:5px 12px;
    border-radius:40px;
    font-weight:bold;
    color:#ffd966;
    font-size:1rem;
}

.controls{
    margin-top:15px;
    display:flex;
    gap:15px;
    justify-content:center;
    flex-wrap:wrap;
}

button{
    background:#dba53f;
    border:none;
    font-weight:bold;
    padding:12px 25px;
    border-radius:50px;
    cursor:pointer;
    font-size:1.1rem;
}

.reset-btn{
    background:#e74c3c;
    color:white;
}

.jump-btn{
    background:#2ecc71;
    color:white;
}

.info{
    margin-top:15px;
    padding:8px;
    border-radius:30px;
    background:#000000aa;
    color:#ffd966;
    font-weight:bold;
    font-size:.8rem;
}

.shop-title{
    text-align:center;
    color:#ffd966;
    font-size:1.3rem;
    margin-bottom:15px;
}

.shop-items{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.shop-item{
    background:#2c3e2f;
    border-radius:30px;
    padding:8px;
    text-align:center;
    border:1px solid #f1c40f;
}

.shop-item h4{
    margin:0;
    color:#f9e79f;
}

.shop-item p{
    margin:4px 0;
    font-size:.7rem;
    color:#ccc;
}

/* ================= المافيا والجاسوس ================= */

.mafia-card,
.spy-card{
    background:#1a1a1a;
    padding:20px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #444;
    transition:.5s;
    cursor:pointer;
    text-align:center;
}

.role-display{
    display:none;
    color:#ff0000;
    font-size:1.2em;
    font-weight:bold;
    margin-top:10px;
}

.fade-out{
    opacity:0;
    transform:scale(.9);
    pointer-events:none;
}

.locked{
    pointer-events:none;
    opacity:.4;
}

input{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #0f0;
    background:#000;
    color:#0f0;
    margin-bottom:8px;
    text-align:center;
}            function updateShopUI() {
                document.getElementById('starPoints').innerText = starPoints;
                const container = document.getElementById('shopContainer');
                container.innerHTML = `
                    <div class="shop-item ${starPoints>=150 && !hasShield ? '' : 'disabled'}" onclick="window.buyItem('shield')">
                        <h4>🛡️ درع واقي</h4>
                        <p>يمتص ضربة واحدة</p>
                        <p>⭐ 150 نقطة</p>
                    </div>
                    <div class="shop-item ${starPoints>=250 && !doublePoints ? '' : 'disabled'}" onclick="window.buyItem('doublePoints')">
                        <h4>⭐ مضاعف نقاط</h4>
                        <p>كل نجمة تعطي ضعف</p>
                        <p>⭐ 250 نقطة</p>
                    </div>
                    <div class="shop-item ${starPoints>=180 && !slowMotion ? '' : 'disabled'}" onclick="window.buyItem('slowTime')">
                        <h4>🐢 تباطؤ الوقت</h4>
                        <p>عقبات أبطأ 10 ثواني</p>
                        <p>⭐ 180 نقطة</p>
                    </div>
                    <div class="shop-item ${starPoints>=100 && health < (START_HEALTH+2) ? '' : 'disabled'}" onclick="window.buyItem('extraHeart')">
                        <h4>💚 قلب إضافي</h4>
                        <p>يزيد الصحة 1 قلب</p>
                        <p>⭐ 100 نقطة</p>
                    </div>
                `;
            }
            
            window.buyItem = (item) => {
                if (!gameRunning) {
                    document.getElementById('info').innerHTML = '⚠️ اللعبة منتهية، اضغط إعادة';
                    return;
                }

                if (item === 'shield' && starPoints >= 150 && !hasShield) {
                    starPoints -= 150;
                    hasShield = true;
                    document.getElementById('info').innerHTML = '🛡️ تم شراء الدرع الواقي!';
                } 
                else if (item === 'doublePoints' && starPoints >= 250 && !doublePoints) {
                    starPoints -= 250;
                    doublePoints = true;
                    document.getElementById('info').innerHTML = '⭐ مضاعف النقاط مفعل للأبد!';
                } 
                else if (item === 'slowTime' && starPoints >= 180 && !slowMotion) {
                    starPoints -= 180;
                    slowMotion = true;

                    if (slowTimer) clearTimeout(slowTimer);

                    slowTimer = setTimeout(() => {
                        slowMotion = false;
                        document.getElementById('info').innerHTML = '⚡ انتهى تأثير التباطؤ';
                    }, 10000);

                    document.getElementById('info').innerHTML = '🐢 تباطؤ العقبات لمدة 10 ثواني!';
                } 
                else if (item === 'extraHeart' && starPoints >= 100 && health < (START_HEALTH+2)) {
                    starPoints -= 100;
                    health = Math.min(START_HEALTH+2, health+1);

                    document.getElementById('health').innerHTML = health;
                    document.getElementById('info').innerHTML = '💚 تم إضافة قلب إضافي!';
                } 
                else {
                    document.getElementById('info').innerHTML = '⚠️ نقاط غير كافية أو تم شراؤه مسبقاً';
                    return;
                }

                updateShopUI();
            };
            
            function performJump() {
                if (!gameRunning || player.isJumping) return false;

                player.velocityY = JUMP_POWER;
                player.isJumping = true;

                for(let i = 0; i < 8; i++) {
                    particles.push({
                        x: player.x + 22,
                        y: player.y + 45,
                        vx: (Math.random() - 0.5) * 4,
                        vy: Math.random() * 4,
                        life: 15
                    });
                }

                return true;
            }
            
            function addObstacle() {
                if (gameRunning) {
                    obstacles.push({
                        x: canvas.width,
                        y: GROUND_Y - 40,
                        width: 45,
                        height: 45
                    });
                }
            }

            function addStar() {
                if (gameRunning) {
                    stars.push({
                        x: canvas.width,
                        y: GROUND_Y - 60 - Math.random() * 40,
                        width: 28,
                        height: 28,
                        collected: false
                    });
                }
            }
            
            function updatePlayer() {
                if (!gameRunning) return;

                player.velocityY += GRAVITY;
                player.y += player.velocityY;

                if (player.y >= player.originalY) {
                    player.y = player.originalY;
                    player.isJumping = false;
                    player.velocityY = 0;
                }

                if (player.y > canvas.height) {
                    takeDamage();
                }

                if (player.y < 0) {
                    player.y = 0;
                    player.velocityY = 0;
                }
            }
            
            function takeDamage() {
                if (!gameRunning) return;

                if (hasShield) {
                    hasShield = false;

                    document.getElementById('info').innerHTML =
                        '🛡️ الدرع امتص الضربة!';

                    updateShopUI();
                    return;
                }

                health--;

                document.getElementById('health').innerHTML = health;

                hitSound.currentTime = 0;
                hitSound.play().catch(e => console.log);

                canvas.style.transform = 'translateX(5px)';

                setTimeout(() => {
                    canvas.style.transform = '';
                }, 100);

                if (health <= 0) {
                    gameRunning = false;

                    document.getElementById('info').innerHTML =
                        '💀 انتهت اللعبة! اضغط إعادة 💀';
                }
            }            function addPoints(points) {
                if (!gameRunning) return;

                let finalPoints = doublePoints ? points * 2 : points;

                score += finalPoints;
                starPoints += finalPoints;

                document.getElementById('score').innerHTML = score;

                updateShopUI();

                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('jumpHighScore567', highScore);
                    document.getElementById('highScore').innerHTML = highScore;
                }
            }
            
            function updateObjects() {
                if (!gameRunning) return;

                let speed = slowMotion ? 3 : OBSTACLE_SPEED;

                for (let i = 0; i < obstacles.length; i++) {
                    obstacles[i].x -= speed;

                    if (
                        obstacles[i].x < player.x + 45 &&
                        obstacles[i].x + 45 > player.x &&
                        obstacles[i].y < player.y + 45 &&
                        obstacles[i].y + 45 > player.y
                    ) {
                        takeDamage();
                        obstacles.splice(i, 1);
                        i--;
                    }
                }

                obstacles = obstacles.filter(obs => obs.x + 45 > 0);

                for (let i = 0; i < stars.length; i++) {
                    stars[i].x -= speed;

                    if (
                        !stars[i].collected &&
                        stars[i].x < player.x + 45 &&
                        stars[i].x + 28 > player.x &&
                        stars[i].y < player.y + 45 &&
                        stars[i].y + 28 > player.y
                    ) {
                        stars[i].collected = true;

                        let starValue = isEasyMode ? 20 : 10;
                        addPoints(starValue);

                        for (let j = 0; j < 8; j++) {
                            particles.push({
                                x: stars[i].x + 14,
                                y: stars[i].y + 14,
                                vx: (Math.random() - 0.5) * 4,
                                vy: (Math.random() - 0.5) * 4,
                                life: 15
                            });
                        }
                    }
                }

                stars = stars.filter(star => !star.collected && star.x + 28 > 0);
            }
            
            function updateParticles() {
                for (let i = 0; i < particles.length; i++) {
                    particles[i].x += particles[i].vx;
                    particles[i].y += particles[i].vy;
                    particles[i].life--;
                }

                particles = particles.filter(p => p.life > 0);
            }
            
            function generateObjects() {
                if (!gameRunning) return;

                let obsRate = isEasyMode ? 70 : 60;
                let starRate = isEasyMode ? 50 : 40;

                obstacleTimer++;
                if (obstacleTimer > obsRate) {
                    obstacleTimer = 0;
                    if (Math.random() < 0.6) addObstacle();
                }

                starTimer++;
                if (starTimer > starRate) {
                    starTimer = 0;
                    if (Math.random() < 0.5) addStar();
                }
            }
            
            function draw() {
                const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
                grad.addColorStop(0, '#1a252f');
                grad.addColorStop(1, '#2c3e50');

                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, GROUND_Y);

                ctx.fillStyle = '#5d4e30';
                ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);

                ctx.fillStyle = '#4caf50';

                for (let i = 0; i < canvas.width; i += 20) {
                    ctx.fillRect(i, GROUND_Y - 5, 10, 8);
                }

                for (let o of obstacles) {
                    if (obstacleImg.complete && obstacleImg.naturalWidth > 0 && !obstacleImgFailed) {
                        ctx.drawImage(obstacleImg, o.x, o.y, 45, 45);
                    } else {
                        ctx.fillStyle = '#e74c3c';
                        ctx.fillRect(o.x, o.y, 45, 45);
                        ctx.fillStyle = 'white';
                        ctx.fillText('👾', o.x + 10, o.y + 30);
                    }
                }

                for (let s of stars) {
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath();

                    let cx = s.x + 14;
                    let cy = s.y + 14;

                    for (let i = 0; i < 5; i++) {
                        let ang = (i * 72 - 90) * Math.PI / 180;
                        let x1 = cx + Math.cos(ang) * 12;
                        let y1 = cy + Math.sin(ang) * 12;

                        let ang2 = (i * 72 + 36 - 90) * Math.PI / 180;
                        let x2 = cx + Math.cos(ang2) * 5;
                        let y2 = cy + Math.sin(ang2) * 5;

                        if (i === 0) ctx.moveTo(x1, y1);
                        ctx.lineTo(x2, y2);
                        ctx.lineTo(x1, y1);
                    }

                    ctx.fill();
                }

                if (selectedPlayerImg.complete) {
                    ctx.drawImage(selectedPlayerImg, player.x, player.y, 45, 45);
                } else {
                    ctx.fillStyle = '#3498db';
                    ctx.fillRect(player.x, player.y, 45, 45);
                    ctx.fillStyle = 'white';
                    ctx.fillText('🦘', player.x + 8, player.y + 35);
                }

                for (let p of particles) {
                    ctx.fillStyle = `rgba(255,215,0,${p.life / 15})`;
                    ctx.fillRect(p.x, p.y, 4, 4);
                }

                if (doublePoints && gameRunning) {
                    ctx.fillStyle = 'gold';
                    ctx.font = 'bold 12px Arial';
                    ctx.fillText('⭐ مضاعف نقاط مفعل', 10, 30);
                }

                if (hasShield && gameRunning) {
                    ctx.fillStyle = '#8e44ad';
                    ctx.font = 'bold 12px Arial';
                    ctx.fillText('🛡️ درع واقي', 10, 50);
                }

                if (!gameRunning) {
                    ctx.fillStyle = '#000000aa';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    ctx.fillStyle = '#f1c40f';
                    ctx.font = 'bold 30px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);

                    ctx.textAlign = 'left';
                }
            }            function gameLoop() {
                if (gameRunning) {
                    updatePlayer();
                    updateObjects();
                    updateParticles();
                    generateObjects();
                }

                draw();
                requestAnimationFrame(gameLoop);
            }
            
            function resetGame() {
                gameRunning = true;
                score = 0;
                health = START_HEALTH;

                obstacles = [];
                stars = [];
                particles = [];

                obstacleTimer = 0;
                starTimer = 0;

                player.y = player.originalY;
                player.velocityY = 0;
                player.isJumping = false;

                document.getElementById('score').innerHTML = '0';
                document.getElementById('health').innerHTML = START_HEALTH;

                document.getElementById('info').innerHTML =
                    '🖱️ اضغط زر القفز أو المس الشاشة (أو Space) لتقفز! تجنب العوائق 👾';
            }
            
            document.getElementById('jumpButtonMobile').addEventListener('click', (e) => {
                e.preventDefault();
                performJump();
            });

            document.getElementById('jumpButtonMobile').addEventListener('touchstart', (e) => {
                e.preventDefault();
                performJump();
            });

            canvas.addEventListener('click', (e) => {
                e.preventDefault();
                performJump();
            });

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                performJump();
            });

            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'ArrowUp') {
                    e.preventDefault();
                    performJump();
                }
            });

            document.getElementById('resetBtn').addEventListener('click', resetGame);

            resetGame();
            updateShopUI();
            gameLoop();
        });
    }
</script>
</body>
</html>
