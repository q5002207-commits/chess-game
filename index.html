<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🏁 سباق السيارات - رهانات أونلاين 🏎️</title>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; touch-action: manipulation; }
        body {
            font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
            background: linear-gradient(145deg, #0a2f1f, #051a0e);
            margin: 0;
            padding: 20px;
            color: #ffd966;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .race-container {
            max-width: 800px;
            width: 100%;
            background: #1e2a1a;
            border-radius: 60px;
            padding: 20px;
            border: 3px solid #f1c40f;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
        }
        h1 { text-align: center; color: #f1c40f; margin: 0 0 10px 0; }
        .balance-card {
            background: #0f1f0f;
            border-radius: 40px;
            padding: 12px 20px;
            text-align: center;
            margin-bottom: 20px;
            border: 1px solid #f1c40f;
        }
        .balance-amount { font-size: 2.2rem; font-weight: bold; color: #f39c12; }
        .race-track { background: #2c3e2f; border-radius: 30px; padding: 20px; margin: 20px 0; }
        .car-lane {
            background: #1a2a1a;
            margin-bottom: 12px;
            border-radius: 30px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #5d6e3a;
        }
        .car-icon { font-size: 2rem; width: 60px; text-align: center; }
        .car-name { width: 70px; font-weight: bold; font-size: 0.9rem; }
        .track-bar { flex: 1; background: #3a4a2a; border-radius: 20px; height: 45px; position: relative; overflow: hidden; }
        .car-progress {
            width: 0%;
            height: 100%;
            border-radius: 20px;
            transition: width 0.03s linear;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .car-red .car-progress { background: radial-gradient(circle at left, #e74c3c, #c0392b); }
        .car-blue .car-progress { background: radial-gradient(circle at left, #3498db, #2980b9); }
        .car-green .car-progress { background: radial-gradient(circle at left, #2ecc71, #27ae60); }
        .car-yellow .car-progress { background: radial-gradient(circle at left, #f1c40f, #f39c12); }
        .odds-info { font-size: 0.7rem; color: #ffd966; background: #000000aa; padding: 2px 8px; border-radius: 20px; }
        .cars-selector { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .car-bet-card {
            background: #1e2a1a;
            border: 2px solid #f1c40f;
            border-radius: 30px;
            padding: 12px 15px;
            text-align: center;
            cursor: pointer;
            min-width: 100px;
        }
        .car-bet-card.selected { background: #f39c12; color: #1e2a1a; border-color: white; }
        .car-bet-card .car-emoji { font-size: 2rem; }
        .car-bet-card .multiplier { font-size: 0.8rem; color: #aaa; }
        .selected .multiplier { color: #1e2a1a; }
        .bet-control { display: flex; gap: 15px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 20px 0; }
        .bet-control input { width: 150px; padding: 10px; border-radius: 30px; border: 2px solid #f1c40f; background: #0a1a0a; color: #f39c12; text-align: center; font-size: 1.1rem; }
        .race-btn { background: #27ae60; color: white; font-size: 1.3rem; padding: 15px 30px; border: none; border-radius: 50px; cursor: pointer; }
        .race-btn:disabled { background: #555; cursor: not-allowed; }
        .result-message { background: #000000aa; border-radius: 30px; padding: 12px; margin-top: 15px; font-weight: bold; text-align: center; }
        .history { background: #0f1f0f; border-radius: 20px; padding: 10px; margin-top: 20px; max-height: 150px; overflow-y: auto; font-size: 0.75rem; }
        .online-status { background: #2c3e50; padding: 8px; border-radius: 20px; margin-bottom: 10px; font-size: 0.8rem; text-align: center; }
        .enemy-info { background: #1a1a1a; padding: 8px; border-radius: 15px; margin: 10px 0; text-align: center; }
        button { width: 100%; padding: 12px; background: #da291c; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .back-home { background: #333; width: auto; margin-bottom: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="race-container">
    <button class="back-home" onclick="location.reload()">🏠 القائمة الرئيسية</button>
    <h1>🏁 سباق السيارات أونلاين 🏎️</h1>
    
    <div id="raceSetup">
        <input type="text" id="racePlayerName" placeholder="اسمك...">
        <button onclick="raceHostGame()">👑 إنشاء غرفة</button>
        <p style="margin:10px 0; color:#888;">أو</p>
        <input type="text" id="raceRoomCode" placeholder="كود الغرفة">
        <button onclick="raceJoinGame()">🚪 دخول الغرفة</button>
    </div>
    
    <div id="raceLobby" class="hidden">
        <div class="online-status" id="raceRoomDisplay"></div>
        <div class="enemy-info" id="raceEnemyInfo">⏳ انتظار اتصال الخصم...</div>
        <div id="raceGameArea" style="display:none;">
            <div class="balance-card"><div class="balance-amount" id="raceBalance">1000</div><div>💰 رصيدك</div></div>
            <div class="balance-card"><div class="balance-amount" id="raceEnemyBalance">1000</div><div>💰 رصيد الخصم</div></div>
            
            <div class="race-track">
                <div class="car-lane car-red"><div class="car-icon">🏎️</div><div class="car-name">🔴 الأحمر</div><div class="track-bar"><div class="car-progress" id="raceProgress0" style="width:0%">0%</div></div><div class="odds-info">×2.5</div></div>
                <div class="car-lane car-blue"><div class="car-icon">🏎️</div><div class="car-name">🔵 الأزرق</div><div class="track-bar"><div class="car-progress" id="raceProgress1" style="width:0%">0%</div></div><div class="odds-info">×3.0</div></div>
                <div class="car-lane car-green"><div class="car-icon">🏎️</div><div class="car-name">🟢 الأخضر</div><div class="track-bar"><div class="car-progress" id="raceProgress2" style="width:0%">0%</div></div><div class="odds-info">×4.0</div></div>
                <div class="car-lane car-yellow"><div class="car-icon">🏎️</div><div class="car-name">🟡 الأصفر</div><div class="track-bar"><div class="car-progress" id="raceProgress3" style="width:0%">0%</div></div><div class="odds-info">×5.0</div></div>
            </div>
            
            <div class="cars-selector">
                <div class="car-bet-card" data-car="0"><div class="car-emoji">🏎️</div><div>🔴 الأحمر</div><div class="multiplier">×2.5</div></div>
                <div class="car-bet-card" data-car="1"><div class="car-emoji">🏎️</div><div>🔵 الأزرق</div><div class="multiplier">×3.0</div></div>
                <div class="car-bet-card" data-car="2"><div class="car-emoji">🏎️</div><div>🟢 الأخضر</div><div class="multiplier">×4.0</div></div>
                <div class="car-bet-card" data-car="3"><div class="car-emoji">🏎️</div><div>🟡 الأصفر</div><div class="multiplier">×5.0</div></div>
            </div>
            
            <div class="bet-control">
                <input type="number" id="raceBetAmount" value="50" min="10" max="10000" step="10">
                <button id="racePlaceBetBtn" style="background:#e67e22; width:auto; padding:10px 20px;">💰 ضع الرهان</button>
            </div>
            <button id="raceStartBtn" class="race-btn" disabled>🏁 ابدأ السباق 🏁</button>
            <div id="raceResultMessage" class="result-message"></div>
            <div class="history" id="raceHistoryList"><div>✨ راهن على سيارة وابدأ السباق ✨</div></div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script>
// ===================== سباق السيارات أونلاين =====================
let racePeer = null, raceConn = null, raceMyName = "", raceMyBalance = 1000, raceEnemyBalance = 1000, raceSelectedCar = null, raceCurrentBet = 0, raceInProgress = false, raceInterval = null, raceRoomHost = false;
const raceCars = [
    { name: "الأحمر", multiplier: 2.5, position: 0, speed: 0 },
    { name: "الأزرق", multiplier: 3.0, position: 0, speed: 0 },
    { name: "الأخضر", multiplier: 4.0, position: 0, speed: 0 },
    { name: "الأصفر", multiplier: 5.0, position: 0, speed: 0 }
];

function raceUpdateUI() { $('#raceBalance').text(raceMyBalance); $('#raceEnemyBalance').text(raceEnemyBalance); }
function raceAddToHistory(msg, isWin) { const historyDiv = $('#raceHistoryList'); const item = $('<div style="border-bottom:1px solid #333; padding:5px;"></div>'); item.html(msg); if(isWin === true) item.css('color', '#2ecc71'); else if(isWin === false) item.css('color', '#e74c3c'); historyDiv.prepend(item); while(historyDiv.children().length > 15) historyDiv.children().last().remove(); }
function raceResetPositions() { for(let i=0; i<raceCars.length; i++) { raceCars[i].position = 0; $(`#raceProgress${i}`).css('width', '0%').text('0%'); } }

function raceStartRace() {
    if(raceInProgress) return;
    if(raceSelectedCar === null) { $('#raceResultMessage').html('⚠️ اختر سيارة أولاً!'); setTimeout(() => $('#raceResultMessage').html(''), 1500); return; }
    if(raceCurrentBet <= 0) { $('#raceResultMessage').html('⚠️ ضع رهاناً أولاً!'); return; }
    if(raceCurrentBet > raceMyBalance) { $('#raceResultMessage').html('❌ رصيدك غير كافي!'); return; }
    
    raceInProgress = true;
    $('#raceStartBtn').prop('disabled', true);
    $('#racePlaceBetBtn').prop('disabled', true);
    $('.car-bet-card').css('pointer-events', 'none');
    raceMyBalance -= raceCurrentBet;
    raceUpdateUI();
    raceAddToHistory(`💰 راهنت بـ ${raceCurrentBet} على ${raceCars[raceSelectedCar].name} (×${raceCars[raceSelectedCar].multiplier})`, null);
    if(raceConn) raceConn.send({ type: 'bet_placed', bet: raceCurrentBet, car: raceSelectedCar, balance: raceMyBalance });
    raceResetPositions();
    for(let i=0; i<raceCars.length; i++) { raceCars[i].speed = Math.random() * 2.5 + 1.2; }
    if(raceInterval) clearInterval(raceInterval);
    let raceFinished = false, winner = null;
    
    raceInterval = setInterval(() => {
        if(raceFinished) return;
        for(let i=0; i<raceCars.length; i++) {
            if(raceCars[i].position < 100) {
                let increment = raceCars[i].speed + (Math.random() * 1.5);
                raceCars[i].position = Math.min(100, raceCars[i].position + increment);
                let percent = Math.floor(raceCars[i].position);
                $(`#raceProgress${i}`).css('width', `${percent}%`).text(`${percent}%`);
            }
        }
        if(!raceFinished) {
            for(let i=0; i<raceCars.length; i++) {
                if(raceCars[i].position >= 100 && !raceFinished) { raceFinished = true; winner = i; break; }
            }
        }
        if(raceFinished) {
            clearInterval(raceInterval);
            raceInProgress = false;
            let winAmount = 0;
            if(winner === raceSelectedCar) {
                winAmount = raceCurrentBet * raceCars[winner].multiplier;
                raceMyBalance += winAmount;
                raceUpdateUI();
                raceAddToHistory(`🏆 فزت! ${raceCars[winner].name} فاز! ربحت ${Math.floor(winAmount)}!`, true);
                $('#raceResultMessage').html(`🏆 فزت! ربحت ${Math.floor(winAmount)}!`).css('color', '#2ecc71');
                if(raceConn) raceConn.send({ type: 'race_result', winner: winner, winAmount: winAmount, myBalance: raceMyBalance });
            } else {
                raceAddToHistory(`❌ خسرت! ${raceCars[winner].name} فاز. خسرت ${raceCurrentBet}.`, false);
                $('#raceResultMessage').html(`💔 خسرت! ${raceCars[winner].name} فاز`).css('color', '#e74c3c');
                if(raceConn) raceConn.send({ type: 'race_result', winner: winner, winAmount: 0, myBalance: raceMyBalance });
            }
            $('#raceStartBtn').prop('disabled', false);
            $('#racePlaceBetBtn').prop('disabled', false);
            $('.car-bet-card').css('pointer-events', 'auto');
            raceCurrentBet = 0; raceSelectedCar = null;
            $('.car-bet-card').removeClass('selected');
            setTimeout(() => $('#raceResultMessage').html(''), 3000);
            if(raceMyBalance <= 0) { $('#raceResultMessage').html('💀 أفلست!'); $('#raceStartBtn').prop('disabled', true); }
        }
    }, 50);
}

function racePlaceBet() {
    if(raceInProgress) { $('#raceResultMessage').html('⏳ السباق جاري...'); return; }
    if(raceSelectedCar === null) { $('#raceResultMessage').html('⚠️ اختر سيارة أولاً!'); return; }
    let betVal = parseInt($('#raceBetAmount').val());
    if(isNaN(betVal)) betVal = 50;
    if(betVal < 10) betVal = 10;
    if(betVal > 10000) betVal = 10000;
    if(betVal > raceMyBalance) { $('#raceResultMessage').html(`❌ رصيدك ${raceMyBalance} فقط!`); return; }
    raceCurrentBet = betVal;
    $('#raceBetAmount').val(betVal);
    $('#raceStartBtn').prop('disabled', false);
    $('#raceResultMessage').html(`✅ تم وضع الرهان ${raceCurrentBet} على ${raceCars[raceSelectedCar].name}`);
    setTimeout(() => $('#raceResultMessage').html(''), 1500);
}

function raceSelectCar(carIndex) {
    if(raceInProgress) { $('#raceResultMessage').html('⏳ السباق جاري...'); return; }
    raceSelectedCar = carIndex;
    $('.car-bet-card').removeClass('selected');
    $(`.car-bet-card[data-car='${carIndex}']`).addClass('selected');
    if(raceCurrentBet > 0 && raceCurrentBet <= raceMyBalance) $('#raceStartBtn').prop('disabled', false);
    else $('#raceStartBtn').prop('disabled', true);
}

function raceHostGame() {
    raceMyName = $('#racePlayerName').val().trim();
    if(!raceMyName) { alert("اكتب اسمك"); return; }
    raceRoomHost = true;
    let roomId = "RACE_" + Math.floor(1000 + Math.random() * 9000);
    racePeer = new Peer(roomId);
    racePeer.on('open', () => {
        $('#raceSetup').hide();
        $('#raceLobby').removeClass('hidden');
        $('#raceRoomDisplay').html(`🔑 كود غرفتك: <strong>${roomId}</strong><br>انتظر الخصم...`);
        $('#raceEnemyInfo').html('⏳ جاري انتظار الخصم...');
        $('#raceGameArea').hide();
    });
    racePeer.on('connection', conn => {
        raceConn = conn;
        $('#raceEnemyInfo').html('✅ تم اتصال الخصم!');
        $('#raceGameArea').fadeIn();
        raceSetupReceiver();
        raceConn.send({ type: 'init', myName: raceMyName, myBalance: raceMyBalance });
        raceUpdateUI();
    });
}

function raceJoinGame() {
    raceMyName = $('#racePlayerName').val().trim();
    let roomCode = $('#raceRoomCode').val().trim();
    if(!raceMyName) { alert("اكتب اسمك"); return; }
    if(!roomCode) { alert("اكتب كود الغرفة"); return; }
    raceRoomHost = false;
    racePeer = new Peer();
    racePeer.on('open', () => {
        raceConn = racePeer.connect(roomCode);
        raceConn.on('open', () => {
            $('#raceSetup').hide();
            $('#raceLobby').removeClass('hidden');
            $('#raceRoomDisplay').html(`🎲 تم الاتصال بالغرفة: ${roomCode}`);
            $('#raceEnemyInfo').html('✅ تم الاتصال!');
            $('#raceGameArea').fadeIn();
            raceConn.send({ type: 'join', myName: raceMyName, myBalance: raceMyBalance });
            raceSetupReceiver();
            raceUpdateUI();
        });
    });
}

function raceSetupReceiver() {
    raceConn.on('data', data => {
        if(data.type === 'init') { raceEnemyBalance = data.myBalance; raceUpdateUI(); raceAddToHistory(`🎮 ${data.myName} دخل اللعبة`, null); $('#raceEnemyInfo').html(`👤 الخصم: ${data.myName}`); }
        if(data.type === 'join') { raceEnemyBalance = data.myBalance; raceUpdateUI(); raceAddToHistory(`🎮 ${data.myName} دخل اللعبة`, null); $('#raceEnemyInfo').html(`👤 الخصم: ${data.myName}`); }
        if(data.type === 'bet_placed') { raceEnemyBalance = data.balance; raceUpdateUI(); raceAddToHistory(`👤 الخصم راهن بـ ${data.bet} على ${raceCars[data.car].name}`, null); }
        if(data.type === 'race_result') { if(data.winAmount > 0) { raceEnemyBalance -= data.winAmount; raceAddToHistory(`👤 الخصم ربح ${data.winAmount}!`, true); } else { raceEnemyBalance -= raceCurrentBet; raceAddToHistory(`👤 الخصم خسر`, false); } raceUpdateUI(); }
    });
}

$(document).on('click', '.car-bet-card', function() { const carIdx = parseInt($(this).attr('data-car')); raceSelectCar(carIdx); });
$(document).on('click', '#racePlaceBetBtn', racePlaceBet);
$(document).on('click', '#raceStartBtn', raceStartRace);
$('#raceBetAmount').on('change', function() { let val = parseInt($(this).val()); if(isNaN(val)) $(this).val(50); if(val < 10) $(this).val(10); if(val > 10000) $(this).val(10000); if(val > raceMyBalance && raceMyBalance > 0) $(this).val(raceMyBalance); });
</script>
</body>
</html>
