<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>أحمد الإمبراطور </title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1a1a24;--border:#2a2a3a;--gold:#d4af37;--gold2:#f0d060;--text:#e8e8f0;--text2:#9090a8;--user-bubble:#1e1e4a;--ai-bubble:#13131a;--accent:#7c3aed}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#d4af37);display:flex;align-items:center;justify-content:center;font-size:22px}
.header-info{flex:1}
.header-name{font-size:16px;font-weight:600;color:var(--gold)}
.header-status{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:5px;margin-top:2px}
.status-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.header-menu{background:none;border:none;color:var(--text2);cursor:pointer;padding:6px;border-radius:8px;font-size:20px}
.chat-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.chat-area::-webkit-scrollbar{width:4px}
.welcome{text-align:center;padding:30px 20px;margin:auto;max-width:380px}
.welcome-crown{font-size:56px;margin-bottom:12px;display:block}
.welcome-title{font-size:22px;font-weight:700;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
.welcome-sub{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:24px}
.suggestions{display:flex;flex-direction:column;gap:8px}
.sug-btn{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:10px 14px;color:var(--text);font-size:13px;cursor:pointer;text-align:right}
.sug-btn:hover{border-color:var(--gold);color:var(--gold)}
.msg{display:flex;gap:10px;max-width:85%;animation:msgIn .2s ease}
@keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-start;flex-direction:row-reverse}
.msg.ai{align-self:flex-end}
.msg-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;align-self:flex-end}
.msg.ai .msg-avatar{background:linear-gradient(135deg,#7c3aed,#d4af37)}
.msg.user .msg-avatar{background:#1e1e4a;border:1px solid var(--border)}
.msg-bubble{padding:11px 14px;border-radius:18px;font-size:14px;line-height:1.7;max-width:100%}
.msg.ai .msg-bubble{background:var(--ai-bubble);border:1px solid var(--border);border-bottom-right-radius:4px}
.msg.user .msg-bubble{background:var(--user-bubble);border:1px solid #2a2a5a;border-bottom-left-radius:4px;color:#c8c8ff}
.msg-time{font-size:10px;color:var(--text2);margin-top:4px}
.typing-bubble{background:var(--ai-bubble);border:1px solid var(--border);border-radius:18px;border-bottom-right-radius:4px;padding:12px 16px;display:flex;gap:5px;width:fit-content}
.typing-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);opacity:.4;animation:tdot 1.2s infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,100%{opacity:.4}50%{opacity:1;transform:scale(1.3)}}
.input-area{background:var(--surface);border-top:1px solid var(--border);padding:12px 14px}
.input-row{display:flex;gap:8px;align-items:flex-end;background:var(--surface2);border:1px solid var(--border);border-radius:16px;padding:8px 8px 8px 12px}
.input-row:focus-within{border-color:var(--gold)}
#msgInput{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px;resize:none;max-height:120px;min-height:24px;direction:rtl;font-family:inherit}
#msgInput::placeholder{color:var(--text2)}
.send-btn{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#d4af37);border:none;cursor:pointer;font-size:18px}
.send-btn:disabled{opacity:.4}
.input-hint{font-size:11px;color:var(--text2);text-align:center;margin-top:7px}
</style>
</head>
<body>
<div class="header">
  <div class="avatar">👑</div>
  <div class="header-info">
    <div class="header-name">أحمد الإمبراطور</div>
    <div class="header-status"><span class="status-dot"></span>متصل الآن</div>
  </div>
</div>
<div class="chat-area" id="chatArea">
  <div class="welcome">
    <span class="welcome-crown">👑</span>
    <div class="welcome-title">أحمد الإمبراطور</div>
    <div class="welcome-sub">ذكاء اصطناعي خاص — اسألني عن أي شيء</div>
    <div class="suggestions">
      <button class="sug-btn" onclick="sendSuggestion(this)">🌙 ما هي فضائل قيام الليل؟</button>
      <button class="sug-btn" onclick="sendSuggestion(this)">💡 ساعدني في كتابة خطة دراسية</button>
      <button class="sug-btn" onclick="sendSuggestion(this)">🤔 ما الفرق بين الذكاء والحكمة؟</button>
      <button class="sug-btn" onclick="sendSuggestion(this)">😄 احكِ لي نكتة أردنية</button>
    </div>
  </div>
</div>
<div class="input-area">
  <div class="input-row">
    <textarea id="msgInput" placeholder="اكتب رسالتك..." rows="1"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
  <div class="input-hint">أحمد الإمبراطور 👑 — مدعوم بـ DeepSeek</div>
</div>

<script>
// 🔑 مفتاح OpenRouter API
const OPENROUTER_API_KEY = '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';

const SYSTEM_PROMPT = `انت احمد الامبراطور، ذكاء اصطناعي شخصي وخاص. تتحدث العربية او اللهجة الاردنية، شخصيتك دافئة وذكية.`;

let messages = [];
let isLoading = false;

function getTime(){return new Date().toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'})}

function escHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function appendMsg(role,text){
  const welcome=document.querySelector('.welcome');
  if(welcome && (role==='user' || role==='ai'))welcome.remove();
  const area=document.getElementById('chatArea');
  const div=document.createElement('div');
  div.className='msg '+role;
  const avatarIcon=role==='ai'?'👑':'👤';
  div.innerHTML=`<div class="msg-avatar">${avatarIcon}</div><div><div class="msg-bubble"><p>${escHtml(text)}</p></div><div class="msg-time">${getTime()}</div></div>`;
  area.appendChild(div);
  area.scrollTop=area.scrollHeight;
}

function showTyping(){
  const welcome=document.querySelector('.welcome');
  if(welcome)welcome.remove();
  const area=document.getElementById('chatArea');
  const div=document.createElement('div');
  div.className='msg ai';div.id='typingIndicator';
  div.innerHTML='<div class="msg-avatar">👑</div><div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';
  area.appendChild(div);area.scrollTop=area.scrollHeight;
}
function removeTyping(){const t=document.getElementById('typingIndicator');if(t)t.remove()}

// ✅ الحل الأساسي - أضفنا HTTP-Referer و X-Title
async function callAPI(userMsg){
  try {
    const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
        'HTTP-Referer': 'https://ahmed-ai.com',      // 👈 عنوان موقعك
        'X-Title': 'Ahmed AI'                        // 👈 اسم تطبيقك
      },
      body: JSON.stringify({
        model: 'deepseek/deepseek-chat',
        messages: [
          {role: 'system', content: SYSTEM_PROMPT},
          {role: 'user', content: userMsg}
        ]
      })
    });

    if (!response.ok) {
      const errorData = await response.json();
      throw new Error(errorData.error?.message || 'خطأ في الاتصال');
    }

    const data = await response.json();
    return data.choices[0].message.content;
    
  } catch(error) {
    console.error('خطأ:', error);
    return `عذراً، حدث خطأ: ${error.message}`;
  }
}

async function sendMessage(){
  const inp=document.getElementById('msgInput');
  const text=inp.value.trim();
  if(!text||isLoading)return;
  inp.value='';
  isLoading=true;document.getElementById('sendBtn').disabled=true;
  appendMsg('user',text);
  messages.push({role:'user',content:text});
  showTyping();
  try{
    const reply=await callAPI(text);
    removeTyping();
    appendMsg('ai',reply);
    messages.push({role:'assistant',content:reply});
  }catch(e){
    removeTyping();
    appendMsg('ai','عذراً، حدث خطأ.');
  }
  isLoading=false;document.getElementById('sendBtn').disabled=false;inp.focus();
}

function sendSuggestion(btn){
  let txt = btn.textContent;
  txt = txt.replace(/^[🌙💡🤔😄] /, '');
  document.getElementById('msgInput').value = txt;
  sendMessage();
}

document.getElementById('msgInput').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}
});
</script>
</body>
</html>
