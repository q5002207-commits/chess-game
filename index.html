<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>بوابة أحمد - النظام الكامل</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">

<style>

*{
touch-action:manipulation;
user-select:none;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',Tahoma,sans-serif;
background:#000;
color:#0f0;
margin:0;
padding:10px;
display:flex;
flex-direction:column;
align-items:center;
overflow-x:hidden;
}

/* ================= القائمة ================= */

#main-menu{
text-align:center;
margin-top:40px;
width:100%;
max-width:400px;
}

.menu-btn{
display:block;
width:100%;
padding:25px;
margin:15px 0;
background:#111;
border:2px solid #da291c;
color:white;
border-radius:15px;
font-size:1.4em;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

.menu-btn:hover{
background:#da291c;
box-shadow:0 0 20px #da291c;
}

.hidden{
display:none;
}

.back-home{
background:#333;
color:#fff;
padding:8px 15px;
border-radius:5px;
cursor:pointer;
margin-bottom:10px;
border:none;
font-size:.8em;
}

.header{
width:100%;
max-width:400px;
background:#da291c;
padding:12px;
border-radius:12px;
text-align:center;
color:white;
margin-bottom:10px;
}

/* ================= لعبة القفز ================= */

.game-container{
background:#2c4a2e;
border-radius:40px;
padding:15px;
box-shadow:0 20px 35px rgba(0,0,0,.5);
border:2px solid #d4af37;
text-align:center;
max-width:1000px;
width:100%;
display:flex;
gap:15px;
flex-wrap:wrap;
justify-content:center;
}

.game-main{
flex:2;
min-width:280px;
}

.shop-sidebar{
background:#1f2a1bdd;
border-radius:30px;
padding:15px;
width:220px;
border:1px solid gold;
}

canvas{
display:block;
margin:0 auto;
border-radius:20px;
background:#2c3e50;
width:100%;
max-width:800px;
}

.score-board{
display:flex;
justify-content:space-between;
margin-bottom:15px;
gap:10px;
flex-wrap:wrap;
}

.score-card{
background:#000000aa;
padding:5px 12px;
border-radius:40px;
font-weight:bold;
color:#ffd966;
}

.controls{
margin-top:15px;
display:flex;
gap:15px;
justify-content:center;
}

button{
padding:12px;
background:#da291c;
color:white;
border:none;
border-radius:8px;
font-weight:bold;
cursor:pointer;
}

.jump-btn{
background:#2ecc71;
}

.reset-btn{
background:#e74c3c;
}

.info{
margin-top:15px;
padding:8px;
border-radius:30px;
background:#000000aa;
color:#ffd966;
font-weight:bold;
}

.shop-title{
text-align:center;
color:#ffd966;
font-size:1.3rem;
margin-bottom:15px;
}

.shop-item{
background:#2c3e2f;
border-radius:30px;
padding:8px;
text-align:center;
cursor:pointer;
border:1px solid #f1c40f;
margin-bottom:10px;
}

.shop-item.disabled{
opacity:.5;
pointer-events:none;
}

.stars-badge{
background:#000000aa;
padding:5px;
border-radius:30px;
text-align:center;
margin-bottom:15px;
font-weight:bold;
color:gold;
}

.lock-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
z-index:2000;
display:flex;
justify-content:center;
align-items:center;
}

.lock-box{
background:#2c4a2e;
padding:30px;
border-radius:60px;
border:2px solid gold;
text-align:center;
width:280px;
}

.lock-box input{
width:100%;
padding:15px;
font-size:1.5rem;
text-align:center;
border-radius:50px;
border:none;
margin:20px 0;
background:#f5e6c4;
}

/* ================= المافيا والجاسوس ================= */

.mafia-card,
.spy-card{
background:#1a1a1a;
padding:20px;
margin:10px 0;
border-radius:10px;
border:1px solid #444;
transition:.5s;
cursor:pointer;
text-align:center;
}

.role-display{
display:none;
color:#ff0000;
font-size:1.2em;
font-weight:bold;
margin-top:10px;
}

.fade-out{
opacity:0;
transform:scale(.9);
pointer-events:none;
}

.locked{
pointer-events:none;
opacity:.4;
}

input{
width:100%;
padding:12px;
border-radius:8px;
border:1px solid #0f0;
background:#000;
color:#0f0;
margin-bottom:8px;
text-align:center;
}

/* ================= الشطرنج ================= */

.chess-container{
display:flex;
flex-direction:row;
justify-content:center;
align-items:flex-start;
gap:10px;
flex-wrap:wrap;
}

.move-history{
background:#111;
border:1px solid #da291c;
border-radius:8px;
padding:10px;
width:180px;
max-height:400px;
overflow-y:auto;
font-size:.8em;
}

.fake-chat{
background:#0a0a0a;
border:2px solid #0f0;
border-radius:8px;
width:200px;
max-height:400px;
display:flex;
flex-direction:column;
padding:8px;
}

#board{
width:380px !important;
max-width:95vw !important;
border:4px solid #333;
border-radius:8px;
}

.turn-box{
margin-top:15px;
font-size:1.2em;
font-weight:bold;
color:#fff;
}

.timer-box{
font-size:1.5em;
font-weight:bold;
background:#000;
padding:5px 15px;
border-radius:20px;
margin-bottom:10px;
color:#ff0;
}

</style>
</head>

<body>

<!-- ================= القائمة ================= -->

<div id="main-menu">

<h1 style="color:#da291c;">🔥 AHMED PRO SYSTEM 🔥</h1>

<button class="menu-btn" onclick="showGame('mafia')">
🕵️ المافيا
</button>

<button class="menu-btn" onclick="showGame('chess')">
♟️ الشطرنج
</button>

<button class="menu-btn" onclick="showGame('spy')">
🕵️ الجاسوس
</button>

<button class="menu-btn" onclick="showGame('spyOnline')">
🌐 الجاسوس أونلاين
</button>

<button class="menu-btn" style="border-color:#2ecc71;" onclick="showGame('jumpGame')">
🦘 لعبة القفز
</button>

</div>

<!-- ================= لعبة القفز ================= -->

<div id="jumpGame-section" class="hidden">

<button class="back-home" onclick="location.reload()">
🏠 القائمة الرئيسية
</button>

<div id="lockScreen" class="lock-screen">

<div class="lock-box">

<div style="font-size:3rem;">🔐</div>

<h2 style="color:#ffd966;">أدخل كلمة السر</h2>

<input type="password" id="passwordInput" placeholder="***">

<button id="unlockBtn">
فتح البوابة
</button>

</div>
</div>

<div id="gameApp" style="display:none;">

<div class="game-container">

<div class="game-main">

<div class="score-board">

<div class="score-card">
⭐ النقاط:
<span id="score">0</span>
</div>

<div class="score-card">
🏆 أعلى نتيجة:
<span id="highScore">0</span>
</div>

<div class="score-card">
❤️ الصحة:
<span id="health">3</span>
</div>

</div>

<canvas id="gameCanvas" width="800" height="400"></canvas>

<div class="controls">

<button class="jump-btn" id="jumpButtonMobile">
🦘 قفز
</button>

<button class="reset-btn" id="resetBtn">
🔄 إعادة
</button>

</div>

<div class="info" id="info">
اضغط للقفز وتجنب الوحوش 👾
</div>

</div>

<div class="shop-sidebar">

<div class="shop-title">
🛒 المتجر
</div>

<div class="stars-badge">
⭐ نقاط الشراء:
<span id="starPoints">0</span>
</div>

<div class="shop-items" id="shopContainer"></div>

</div>

</div>
</div>
</div><!-- ================= المافيا ================= -->

<div id="mafia-section" class="hidden">
<button class="back-home" onclick="location.reload()">🏠 القائمة الرئيسية</button>

<div class="header">
<h3>🕵️‍♂️ المافيا</h3>
</div>

<input type="text" id="mafiaPlayerName" placeholder="اسم اللاعب">

<button onclick="addMafiaPlayer()">
إضافة لاعب
</button>

<div id="mafia-preview"></div>

<button onclick="startMafiaDist()" style="background:green;">
بدء اللعبة
</button>

<div id="mafia-board" class="hidden">
<div id="mafia-cards-container"></div>
</div>

</div>

<!-- ================= الجاسوس ================= -->

<div id="spy-section" class="hidden">

<button class="back-home" onclick="location.reload()">
🏠 القائمة الرئيسية
</button>

<div class="header">
<h3>🕵️ الجاسوس</h3>
</div>

<input type="text" id="spyPlayerName" placeholder="اسم اللاعب">

<button onclick="addSpyPlayer()">
إضافة لاعب
</button>

<div id="spy-preview"></div>

<button onclick="startSpyDist()" style="background:green;">
بدء اللعبة
</button>

<div id="spy-board" class="hidden">
<div id="spy-cards-container"></div>
</div>

</div>

<!-- ================= الشطرنج ================= -->

<div id="chess-section" class="hidden">

<button class="back-home" onclick="location.reload()">
🏠 القائمة الرئيسية
</button>

<div class="header">
<h3>♟️ الشطرنج</h3>
</div>

<div class="chess-container">

<div class="move-history">
<div id="history-list"></div>
</div>

<div>

<div class="timer-box" id="timer-display">
⏱️ 25
</div>

<div id="board"></div>

<div class="turn-box" id="turn-display">
انتظار...
</div>

</div>

<div class="fake-chat">

<div id="chat-messages"></div>

<input type="text" id="chat-input" placeholder="اكتب رسالة">

<button id="send-chat-btn">
إرسال
</button>

</div>

</div>

</div>

<!-- ================= الجاسوس أونلاين ================= -->

<div id="spy-online-section" class="hidden">

<button class="back-home" onclick="location.reload()">
🏠 القائمة الرئيسية
</button>

<div class="header">
<h3>🌐 الجاسوس أونلاين</h3>
</div>

<input type="text" id="spyNick" placeholder="اسمك">

<button onclick="hostRoom()">
إنشاء غرفة
</button>

<input type="text" id="roomCode" placeholder="كود الغرفة">

<button onclick="joinRoom()">
دخول
</button>

<div id="lobby" class="hidden">

<div id="display-room-id"></div>

<div id="online-players-list"></div>

<button onclick="startOnlineGame()">
ابدأ
</button>

</div>

</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>

<script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>

<script>

/* ================= التنقل ================= */

function showGame(t){

$('#main-menu').hide();

if(t==='mafia'){
$('#mafia-section').removeClass('hidden');
}

else if(t==='spy'){
$('#spy-section').removeClass('hidden');
}

else if(t==='spyOnline'){
$('#spy-online-section').removeClass('hidden');
}

else if(t==='chess'){
$('#chess-section').removeClass('hidden');
initChess();
}

else if(t==='jumpGame'){
$('#jumpGame-section').removeClass('hidden');
initJumpGame();
}

}

/* ================= لعبة القفز ================= */

function initJumpGame(){

const SECRET_CODE_NORMAL = "567";
const SECRET_CODE_EASY = "345";

document.getElementById("unlockBtn").onclick = function(){

const val = document.getElementById("passwordInput").value;

if(val===SECRET_CODE_NORMAL || val===SECRET_CODE_EASY){

document.getElementById("lockScreen").style.display="none";

document.getElementById("gameApp").style.display="block";

startGameLogic(val===SECRET_CODE_EASY);

}

};

}

function startGameLogic(isEasyMode){

const canvas = document.getElementById('gameCanvas');

const ctx = canvas.getContext('2d');

const player = {
x:100,
y:300,
w:40,
h:40,
vy:0,
jump:false
};

let obstacles = [];

let score = 0;

let gameRunning = true;

function jump(){

if(player.jump) return;

player.vy = -14;

player.jump = true;

}

function spawnObstacle(){

obstacles.push({
x:800,
y:310,
w:40,
h:40
});

}

function update(){

player.vy += .7;

player.y += player.vy;

if(player.y >= 300){

player.y = 300;

player.jump = false;

}

obstacles.forEach(o => {
o.x -= isEasyMode ? 4 : 7;

if(
player.x < o.x + o.w &&
player.x + player.w > o.x &&
player.y < o.y + o.h &&
player.y + player.h > o.y
){
gameRunning = false;
}
});

obstacles = obstacles.filter(o => o.x > -50);

score++;

document.getElementById('score').innerText = score;

}

function draw(){

ctx.clearRect(0,0,800,400);

ctx.fillStyle = '#654321';
ctx.fillRect(0,350,800,50);

ctx.fillStyle = '#3498db';
ctx.fillRect(player.x,player.y,player.w,player.h);

ctx.fillStyle = '#e74c3c';

obstacles.forEach(o=>{
ctx.fillRect(o.x,o.y,o.w,o.h);
});

if(!gameRunning){

ctx.fillStyle='white';
ctx.font='40px Arial';
ctx.fillText('GAME OVER',250,200);

}

}

function loop(){

if(gameRunning){

update();

if(Math.random()<0.02){
spawnObstacle();
}

}

draw();

requestAnimationFrame(loop);

}

document.getElementById('jumpButtonMobile').onclick = jump;

document.addEventListener('keydown', e=>{
if(e.code==='Space'){
jump();
}
});

document.getElementById('resetBtn').onclick = ()=>{
location.reload();
};

loop();

}

/* ================= المافيا ================= */

let mPlayers=[];

function addMafiaPlayer(){

let n=$('#mafiaPlayerName').val().trim();

if(!n) return;

mPlayers.push(n);

$('#mafia-preview').text(mPlayers.join(' - '));

$('#mafiaPlayerName').val('');

}

function startMafiaDist(){

$('#mafia-board').removeClass('hidden');

let c=$('#mafia-cards-container');

c.empty();

mPlayers.forEach(p=>{

let role=Math.random()<0.3?'🔪 مافيا':'👨 مواطن';

c.append(`
<div class="mafia-card">
<strong>${p}</strong>
<div class="role-display">${role}</div>
</div>
`);

});

$('.mafia-card').click(function(){

$(this).find('.role-display').toggle();

});

}

/* ================= الجاسوس ================= */

let sPlayers=[];

const spyPlaces=['مطار','مدرسة','مستشفى','مطعم','فندق'];

function addSpyPlayer(){

let n=$('#spyPlayerName').val().trim();

if(!n) return;

sPlayers.push(n);

$('#spy-preview').text(sPlayers.join(' - '));

$('#spyPlayerName').val('');

}

function startSpyDist(){

$('#spy-board').removeClass('hidden');

let place=spyPlaces[Math.floor(Math.random()*spyPlaces.length)];

let spy=Math.floor(Math.random()*sPlayers.length);

let c=$('#spy-cards-container');

c.empty();

sPlayers.forEach((p,i)=>{

let role=i===spy?'🕵️ جاسوس':`📍 ${place}`;

c.append(`
<div class="spy-card">
<strong>${p}</strong>
<div class="role-display">${role}</div>
</div>
`);

});

$('.spy-card').click(function(){

$(this).find('.role-display').toggle();

});

}

/* ================= الشطرنج ================= */

let chessGame;
let chessBoard;

function initChess(){

chessGame = new Chess();

chessBoard = Chessboard('board',{
position:'start'
});

}

/* ================= أونلاين ================= */

function hostRoom(){

alert('تم إنشاء الغرفة');

}

function joinRoom(){

alert('تم الدخول');

}

function startOnlineGame(){

alert('بدأت اللعبة');

}

</script>

</body>
</html>
