<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🏁 سباق السيارات - سباق واحد للجميع 🏎️</title>
    <script src="https://unpkg.com/peerjs@1.3.1/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; touch-action: manipulation; }
        body {
            font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
            background: linear-gradient(145deg, #0a2f1f, #051a0e);
            margin: 0;
            padding: 20px;
            color: #ffd966;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .race-container {
            max-width: 800px;
            width: 100%;
            background: #1e2a1a;
            border-radius: 60px;
            padding: 20px;
            border: 3px solid #f1c40f;
            box-shadow: 0 20px 35px rgba(0,0,0,0.5);
        }
        h1 { text-align: center; color: #f1c40f; margin: 0 0 10px 0; }
        .players-area {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .player-card {
            background: #0f1f0f;
            border-radius: 30px;
            padding: 10px 20px;
            text-align: center;
            border: 1px solid #f1c40f;
            min-width: 150px;
        }
        .player-name { font-weight: bold; font-size: 1.1rem; }
        .player-bet { font-size: 0.8rem; color: #f39c12; }
        .player-balance { font-size: 1.2rem; color: #f1c40f; }
        .race-track { background: #2c3e2f; border-radius: 30px; padding: 20px; margin: 20px 0; }
        .car-lane {
            background: #1a2a1a;
            margin-bottom: 12px;
            border-radius: 30px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 1px solid #5d6e3a;
        }
        .car-icon { font-size: 2rem; width: 60px; text-align: center; }
        .car-name { width: 70px; font-weight: bold; font-size: 0.9rem; }
        .track-bar { flex: 1; background: #3a4a2a; border-radius: 20px; height: 45px; position: relative; overflow: hidden; }
        .car-progress {
            width: 0%;
            height: 100%;
            border-radius: 20px;
            transition: width 0.03s linear;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .car-red .car-progress { background: radial-gradient(circle at left, #e74c3c, #c0392b); }
        .car-blue .car-progress { background: radial-gradient(circle at left, #3498db, #2980b9); }
        .car-green .car-progress { background: radial-gradient(circle at left, #2ecc71, #27ae60); }
        .car-yellow .car-progress { background: radial-gradient(circle at left, #f1c40f, #f39c12); }
        .odds-info { font-size: 0.7rem; color: #ffd966; background: #000000aa; padding: 2px 8px; border-radius: 20px; }
        .cars-selector { display: flex; gap: 12px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
        .car-bet-card {
            background: #1e2a1a;
            border: 2px solid #f1c40f;
            border-radius: 30px;
            padding: 12px 15px;
            text-align: center;
            cursor: pointer;
            min-width: 100px;
        }
        .car-bet-card.selected { background: #f39c12; color: #1e2a1a; border-color: white; }
        .car-bet-card .car-emoji { font-size: 2rem; }
        .car-bet-card .multiplier { font-size: 0.8rem; color: #aaa; }
        .selected .multiplier { color: #1e2a1a; }
        .bet-control { display: flex; gap: 15px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 20px 0; }
        .bet-control input { width: 150px; padding: 10px; border-radius: 30px; border: 2px solid #f1c40f; background: #0a1a0a; color: #f39c12; text-align: center; font-size: 1.1rem; }
        .race-btn { background: #27ae60; color: white; font-size: 1.3rem; padding: 15px 30px; border: none; border-radius: 50px; cursor: pointer; width: 100%; margin-top: 10px; }
        .race-btn:disabled { background: #555; cursor: not-allowed; }
        .reset-btn { background: #e67e22; margin-top: 10px; }
        .result-message { background: #000000aa; border-radius: 30px; padding: 12px; margin-top: 15px; font-weight: bold; text-align: center; }
        .history { background: #0f1f0f; border-radius: 20px; padding: 10px; margin-top: 20px; max-height: 150px; overflow-y: auto; font-size: 0.75rem; }
        .online-status { background: #2c3e50; padding: 8px; border-radius: 20px; margin-bottom: 10px; font-size: 0.8rem; text-align: center; }
        .enemy-info { background: #1a1a1a; padding: 8px; border-radius: 15px; margin: 10px 0; text-align: center; }
        button { padding: 12px; background: #da291c; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .back-home { background: #333; margin-bottom: 10px; }
        .hidden { display: none; }
        .race-in-progress { pointer-events: none; opacity: 0.6; }
        .winner-gold { color: gold; text-shadow: 0 0 5px orange; }
    </style>
</head>
<body>
<div class="race-container">
    <button class="back-home" onclick="location.reload()">🏠 القائمة الرئيسية</button>
    <h1>🏁 سباق السيارات - سباق واحد للجميع 🏎️</h1>
    
    <div id="raceSetup">
        <input type="text" id="racePlayerName" placeholder="اسمك...">
        <button onclick="raceHostGame()">👑 إنشاء غرفة</button>
        <p style="margin:10px 0; color:#888;">أو</p>
        <input type="text" id="raceRoomCode" placeholder="كود الغرفة">
        <button onclick="raceJoinGame()">🚪 دخول الغرفة</button>
    </div>
    
    <div id="raceLobby" class="hidden">
        <div class="online-status" id="raceRoomDisplay"></div>
        <div class="enemy-info" id="raceEnemyInfo">⏳ انتظار اتصال الخصم...</div>
        
        <div class="players-area" id="playersArea"></div>
        
        <div id="raceGameArea" style="display:none;">
            <div class="race-track">
                <div class="car-lane car-red" id="car0"><div class="car-icon">🏎️</div><div class="car-name">🔴 الأحمر ×2.5</div><div class="track-bar"><div class="car-progress" id="progress0" style="width:0%">0%</div></div></div>
                <div class="car-lane car-blue" id="car1"><div class="car-icon">🏎️</div><div class="car-name">🔵 الأزرق ×3.0</div><div class="track-bar"><div class="car-progress" id="progress1" style="width:0%">0%</div></div></div>
                <div class="car-lane car-green" id="car2"><div class="car-icon">🏎️</div><div class="car-name">🟢 الأخضر ×4.0</div><div class="track-bar"><div class="car-progress" id="progress2" style="width:0%">0%</div></div></div>
                <div class="car-lane car-yellow" id="car3"><div class="car-icon">🏎️</div><div class="car-name">🟡 الأصفر ×5.0</div><div class="track-bar"><div class="car-progress" id="progress3" style="width:0%">0%</div></div></div>
            </div>
            
            <div class="cars-selector">
                <div class="car-bet-card" data-car="0"><div class="car-emoji">🏎️</div><div>🔴 الأحمر</div><div class="multiplier">×2.5</div></div>
                <div class="car-bet-card" data-car="1"><div class="car-emoji">🏎️</div><div>🔵 الأزرق</div><div class="multiplier">×3.0</div></div>
                <div class="car-bet-card" data-car="2"><div class="car-emoji">🏎️</div><div>🟢 الأخضر</div><div class="multiplier">×4.0</div></div>
                <div class="car-bet-card" data-car="3"><div class="car-emoji">🏎️</div><div>🟡 الأصفر</div><div class="multiplier">×5.0</div></div>
            </div>
            
            <div class="bet-control">
                <input type="number" id="raceBetAmount" value="50" min="10" max="10000" step="10">
                <button id="racePlaceBetBtn" style="background:#e67e22; width:auto; padding:10px 20px;">💰 ضع الرهان</button>
            </div>
            <button id="raceStartBtn" class="race-btn" disabled>🏁 المضيف يبدأ السباق 🏁</button>
            <div id="raceResultMessage" class="result-message"></div>
            <div class="history" id="raceHistoryList"><div>✨ اختر سيارة وضع رهانك، ثم المضيف يبدأ السباق ✨</div></div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script>
// ===================== سباق السيارات - سباق واحد للجميع =====================
let racePeer = null, raceConn = null;
let raceMyName = "", raceMyBalance = 1000, raceEnemyBalance = 1000;
let raceSelectedCar = null, raceCurrentBet = 0;
let raceInProgress = false, raceInterval = null, raceRoomHost = false;
let playersList = []; // { name, isHost, balance, bet, selectedCar }
let raceWinner = null;
let raceFinished = false;

const raceCars = [
    { name: "الأحمر", multiplier: 2.5, position: 0, speed: 0 },
    { name: "الأزرق", multiplier: 3.0, position: 0, speed: 0 },
    { name: "الأخضر", multiplier: 4.0, position: 0, speed: 0 },
    { name: "الأصفر", multiplier: 5.0, position: 0, speed: 0 }
];

function updatePlayersUI() {
    const area = $('#playersArea');
    area.empty();
    for(let p of playersList) {
        const betText = p.bet ? `رهان: ${p.bet} على ${raceCars[p.selectedCar]?.name || '?'}` : 'لم يراهن بعد';
        const card = $(`
            <div class="player-card">
                <div class="player-name">${p.name} ${p.isHost ? '👑' : ''}</div>
                <div class="player-balance">💰 ${p.balance}</div>
                <div class="player-bet">${betText}</div>
            </div>
        `);
        area.append(card);
    }
}

function updateUI() {
    $('#raceBalance').text(raceMyBalance);
    $('#raceEnemyBalance').text(raceEnemyBalance);
    updatePlayersUI();
}

function addToHistory(msg, isWin) {
    const historyDiv = $('#raceHistoryList');
    const item = $('<div style="border-bottom:1px solid #333; padding:5px;"></div>');
    item.html(msg);
    if(isWin === true) item.css('color', '#2ecc71');
    else if(isWin === false) item.css('color', '#e74c3c');
    historyDiv.prepend(item);
    while(historyDiv.children().length > 20) historyDiv.children().last().remove();
}

function resetPositions() {
    for(let i=0; i<raceCars.length; i++) {
        raceCars[i].position = 0;
        $(`#progress${i}`).css('width', '0%').text('0%');
    }
}

function startRace() {
    if(raceInProgress) return;
    if(!raceRoomHost) {
        addToHistory("⚠️ فقط المضيف يمكنه بدء السباق!", false);
        return;
    }
    
    // التحقق من أن جميع اللاعبين راهنوا
    let allBet = true;
    for(let p of playersList) {
        if(!p.bet || p.bet <= 0) allBet = false;
    }
    if(!allBet) {
        addToHistory("⚠️ انتظر حتى يراهن جميع اللاعبين!", false);
        return;
    }
    
    raceInProgress = true;
    raceFinished = false;
    $('#raceStartBtn').prop('disabled', true);
    $('.car-bet-card').css('pointer-events', 'none');
    $('#racePlaceBetBtn').prop('disabled', true);
    $('.race-container').addClass('race-in-progress');
    
    resetPositions();
    for(let i=0; i<raceCars.length; i++) {
        raceCars[i].speed = Math.random() * 2.5 + 1.2;
    }
    
    addToHistory("🏁 انطلق السباق! 🏁", null);
    if(raceConn) raceConn.send({ type: 'race_started' });
    
    if(raceInterval) clearInterval(raceInterval);
    raceInterval = setInterval(() => {
        if(raceFinished) return;
        
        for(let i=0; i<raceCars.length; i++) {
            if(raceCars[i].position < 100) {
                let increment = raceCars[i].speed + (Math.random() * 1.5);
                raceCars[i].position = Math.min(100, raceCars[i].position + increment);
                let percent = Math.floor(raceCars[i].position);
                $(`#progress${i}`).css('width', `${percent}%`).text(`${percent}%`);
            }
        }
        
        if(!raceFinished) {
            for(let i=0; i<raceCars.length; i++) {
                if(raceCars[i].position >= 100 && !raceFinished) {
                    raceFinished = true;
                    raceWinner = i;
                    break;
                }
            }
        }
        
        if(raceFinished) {
            clearInterval(raceInterval);
            raceInProgress = false;
            $('.race-container').removeClass('race-in-progress');
            
            const winnerCar = raceCars[raceWinner];
            addToHistory(`🏆 الفائز: ${winnerCar.name} 🏆`, true);
            $('#raceResultMessage').html(`🏆 الفائز: ${winnerCar.name} 🏆`).css('color', 'gold');
            
            // حساب النتائج لكل لاعب
            for(let p of playersList) {
                if(p.selectedCar === raceWinner) {
                    let winAmount = p.bet * winnerCar.multiplier;
                    p.balance += winAmount;
                    addToHistory(`🎉 ${p.name} ربح ${Math.floor(winAmount)}! (رهان ${p.bet} × ${winnerCar.multiplier})`, true);
                    if(p.name === raceMyName) {
                        raceMyBalance = p.balance;
                        $('#raceResultMessage').append(`<br>🎉 ربحت ${Math.floor(winAmount)}!`);
                    }
                } else if(p.bet > 0) {
                    addToHistory(`💔 ${p.name} خسر ${p.bet}`, false);
                    if(p.name === raceMyName) {
                        raceMyBalance = p.balance;
                    }
                }
                // إعادة تعيين رهان اللاعب
                p.bet = 0;
                p.selectedCar = null;
            }
            
            // تحديث رصيد الخصم
            for(let p of playersList) {
                if(p.name !== raceMyName) raceEnemyBalance = p.balance;
            }
            
            updateUI();
            raceCurrentBet = 0;
            raceSelectedCar = null;
            $('.car-bet-card').removeClass('selected');
            $('.car-bet-card').css('pointer-events', 'auto');
            $('#racePlaceBetBtn').prop('disabled', false);
            $('#raceStartBtn').prop('disabled', true);
            
            if(raceConn) raceConn.send({ type: 'race_finished', winner: raceWinner, players: playersList });
            
            setTimeout(() => $('#raceResultMessage').html(''), 5000);
            if(raceMyBalance <= 0) {
                $('#raceResultMessage').html('💀 أفلست! أعد تحميل الصفحة للعب مرة أخرى 💀');
                $('#racePlaceBetBtn').prop('disabled', true);
            }
        }
    }, 40);
}

function placeBet() {
    if(raceInProgress) {
        addToHistory("⏳ السباق جاري، لا يمكن الرهان الآن", false);
        return;
    }
    if(raceSelectedCar === null) {
        addToHistory("⚠️ اختر سيارة أولاً!", false);
        return;
    }
    let betVal = parseInt($('#raceBetAmount').val());
    if(isNaN(betVal)) betVal = 50;
    if(betVal < 10) betVal = 10;
    if(betVal > 10000) betVal = 10000;
    if(betVal > raceMyBalance) {
        addToHistory(`❌ رصيدك ${raceMyBalance} فقط!`, false);
        return;
    }
    
    raceCurrentBet = betVal;
    raceMyBalance -= betVal;
    $('#raceBetAmount').val(betVal);
    
    // تحديث اللاعب في القائمة
    for(let p of playersList) {
        if(p.name === raceMyName) {
            p.balance = raceMyBalance;
            p.bet = betVal;
            p.selectedCar = raceSelectedCar;
        }
    }
    
    updateUI();
    addToHistory(`💰 راهنت بـ ${betVal} على ${raceCars[raceSelectedCar].name} (×${raceCars[raceSelectedCar].multiplier})`, null);
    
    if(raceConn) raceConn.send({ type: 'player_bet', name: raceMyName, bet: betVal, car: raceSelectedCar, balance: raceMyBalance });
    
    // التحقق إذا كان المضيف وكل اللاعبين راهنوا
    if(raceRoomHost) {
        let allBet = true;
        for(let p of playersList) {
            if(!p.bet || p.bet <= 0) allBet = false;
        }
        if(allBet && playersList.length >= 2) {
            $('#raceStartBtn').prop('disabled', false);
            addToHistory("✅ جميع اللاعبين راهنوا! يمكنك بدء السباق", true);
        }
    }
}

function selectCar(carIndex) {
    if(raceInProgress) {
        addToHistory("⏳ السباق جاري، لا يمكن تغيير الرهان", false);
        return;
    }
    raceSelectedCar = carIndex;
    $('.car-bet-card').removeClass('selected');
    $(`.car-bet-card[data-car='${carIndex}']`).addClass('selected');
    addToHistory(`🚗 اخترت ${raceCars[carIndex].name}`, null);
}

function hostGame() {
    raceMyName = $('#racePlayerName').val().trim();
    if(!raceMyName) { alert("اكتب اسمك"); return; }
    raceRoomHost = true;
    playersList = [{ name: raceMyName, isHost: true, balance: 1000, bet: 0, selectedCar: null }];
    raceMyBalance = 1000;
    
    let roomId = "RACE2_" + Math.floor(1000 + Math.random() * 9000);
    racePeer = new Peer(roomId);
    racePeer.on('open', () => {
        $('#raceSetup').hide();
        $('#raceLobby').removeClass('hidden');
        $('#raceRoomDisplay').html(`🔑 كود غرفتك: <strong>${roomId}</strong><br>شارك الكود مع صديقك`);
        $('#raceEnemyInfo').html('⏳ انتظار اتصال الخصم...');
        $('#raceGameArea').hide();
        updatePlayersUI();
    });
    racePeer.on('connection', conn => {
        raceConn = conn;
        $('#raceEnemyInfo').html('✅ تم اتصال الخصم!');
        $('#raceGameArea').fadeIn();
        setupReceiver();
        raceConn.send({ type: 'init', players: playersList });
        updateUI();
    });
}

function joinGame() {
    raceMyName = $('#racePlayerName').val().trim();
    let roomCode = $('#raceRoomCode').val().trim();
    if(!raceMyName) { alert("اكتب اسمك"); return; }
    if(!roomCode) { alert("اكتب كود الغرفة"); return; }
    raceRoomHost = false;
    raceMyBalance = 1000;
    
    racePeer = new Peer();
    racePeer.on('open', () => {
        raceConn = racePeer.connect(roomCode);
        raceConn.on('open', () => {
            $('#raceSetup').hide();
            $('#raceLobby').removeClass('hidden');
            $('#raceRoomDisplay').html(`🎲 تم الاتصال بالغرفة: ${roomCode}`);
            $('#raceEnemyInfo').html('✅ تم الاتصال! جاري بدء اللعبة...');
            $('#raceGameArea').fadeIn();
            raceConn.send({ type: 'join', name: raceMyName, balance: raceMyBalance });
            setupReceiver();
            updateUI();
        });
    });
}

function setupReceiver() {
    raceConn.on('data', data => {
        if(data.type === 'init') {
            playersList = data.players;
            for(let p of playersList) {
                if(p.name === raceMyName) raceMyBalance = p.balance;
                else raceEnemyBalance = p.balance;
            }
            updateUI();
            addToHistory(`🎮 انضممت إلى اللعبة`, null);
        }
        if(data.type === 'join') {
            playersList.push({ name: data.name, isHost: false, balance: data.balance, bet: 0, selectedCar: null });
            updateUI();
            addToHistory(`🎮 ${data.name} انضم إلى اللعبة`, null);
            if(raceRoomHost) {
                raceConn.send({ type: 'update_players', players: playersList });
            }
        }
        if(data.type === 'update_players') {
            playersList = data.players;
            for(let p of playersList) {
                if(p.name === raceMyName) raceMyBalance = p.balance;
                else raceEnemyBalance = p.balance;
            }
            updateUI();
        }
        if(data.type === 'player_bet') {
            for(let p of playersList) {
                if(p.name === data.name) {
                    p.bet = data.bet;
                    p.selectedCar = data.car;
                    p.balance = data.balance;
                    if(data.name === raceMyName) raceMyBalance = data.balance;
                    else raceEnemyBalance = data.balance;
                }
            }
            updateUI();
            addToHistory(`💰 ${data.name} راهن بـ ${data.bet} على ${raceCars[data.car].name}`, null);
            if(raceRoomHost) {
                let allBet = true;
                for(let p of playersList) {
                    if(!p.bet || p.bet <= 0) allBet = false;
                }
                if(allBet && playersList.length >= 2) {
                    $('#raceStartBtn').prop('disabled', false);
                    addToHistory("✅ جميع اللاعبين راهنوا! اضغط ابدأ السباق", true);
                }
            }
        }
        if(data.type === 'race_started') {
            addToHistory("🏁 المضيف بدأ السباق! 🏁", null);
        }
        if(data.type === 'race_finished') {
            raceWinner = data.winner;
            playersList = data.players;
            for(let p of playersList) {
                if(p.name === raceMyName) raceMyBalance = p.balance;
                else raceEnemyBalance = p.balance;
            }
            updateUI();
            addToHistory(`🏆 الفائز: ${raceCars[raceWinner].name} 🏆`, true);
            $('#raceResultMessage').html(`🏆 الفائز: ${raceCars[raceWinner].name} 🏆`).css('color', 'gold');
            setTimeout(() => $('#raceResultMessage').html(''), 5000);
            raceCurrentBet = 0;
            raceSelectedCar = null;
            $('.car-bet-card').removeClass('selected');
            $('#racePlaceBetBtn').prop('disabled', false);
        }
    });
}

$(document).on('click', '.car-bet-card', function() { const carIdx = parseInt($(this).attr('data-car')); selectCar(carIdx); });
$(document).on('click', '#racePlaceBetBtn', placeBet);
$(document).on('click', '#raceStartBtn', startRace);
$('#raceBetAmount').on('change', function() { let val = parseInt($(this).val()); if(isNaN(val)) $(this).val(50); if(val < 10) $(this).val(10); if(val > 10000) $(this).val(10000); if(val > raceMyBalance && raceMyBalance > 0) $(this).val(raceMyBalance); });
</script>
</body>
</html>
