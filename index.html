<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ديسكورد الأردن | غرف صوتية مع أعضاء</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1f22;
            color: #dbdee1;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        /* الشريط الجانبي للخوادم */
        .servers-sidebar {
            width: 72px;
            background-color: #1e1f22;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 12px;
            gap: 8px;
            overflow-y: auto;
            border-left: 1px solid #2b2d31;
        }

        .server-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #2b2d31;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 24px;
            position: relative;
        }

        .server-icon:hover, .server-icon.active {
            border-radius: 16px;
            background: #5865f2;
        }

        .server-icon.active::before {
            content: '';
            position: absolute;
            left: -12px;
            width: 4px;
            height: 20px;
            background: white;
            border-radius: 4px;
        }

        .add-server {
            background: #2b2d31;
            color: #23a559;
            font-size: 28px;
        }

        .add-server:hover {
            background: #23a559;
            color: white;
        }

        /* شريط القنوات */
        .channels-sidebar {
            width: 260px;
            background-color: #2b2d31;
            display: flex;
            flex-direction: column;
        }

        .server-header {
            padding: 16px;
            border-bottom: 1px solid #1e1f22;
            font-weight: bold;
        }

        .channels-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .category-name {
            font-size: 12px;
            color: #949ba4;
            padding: 8px;
            margin-top: 8px;
        }

        .channel {
            padding: 8px 12px;
            margin: 2px 0;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #949ba4;
            transition: all 0.2s;
        }

        .channel:hover, .channel.active {
            background: #35373c;
            color: #dbdee1;
        }

        .voice-channel {
            color: #23a559;
        }

        .voice-channel.active {
            background: #23a55920;
            color: #23a559;
        }

        /* منطقة الشات */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #313338;
        }

        .chat-header {
            padding: 16px;
            border-bottom: 1px solid #1e1f22;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .voice-controls {
            display: flex;
            gap: 10px;
        }

        .voice-btn {
            background: #4e5058;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .voice-btn:hover {
            background: #5865f2;
        }

        .voice-btn.mic-off {
            background: #ed4245;
        }

        .voice-btn.screen-active {
            background: #23a559;
        }

        /* الرسائل */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .message-username {
            font-weight: bold;
            color: white;
        }

        .message-time {
            font-size: 11px;
            color: #949ba4;
            margin-right: 10px;
        }

        .message-input-area {
            padding: 16px;
            border-top: 1px solid #1e1f22;
        }

        .message-input-wrapper {
            background: #383a40;
            border-radius: 8px;
            padding: 10px 16px;
        }

        .message-input {
            width: 100%;
            background: none;
            border: none;
            color: #dbdee1;
            outline: none;
            resize: none;
            font-family: inherit;
        }

        /* شريط الأعضاء في الغرفة الصوتية */
        .voice-members-panel {
            width: 260px;
            background-color: #2b2d31;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #1e1f22;
        }

        .voice-members-header {
            padding: 16px;
            border-bottom: 1px solid #1e1f22;
            font-weight: bold;
            font-size: 12px;
            color: #949ba4;
        }

        .voice-members-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .voice-member {
            padding: 10px 12px;
            margin: 4px 0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
            background: #1e1f22;
        }

        .voice-member-speaking {
            border: 2px solid #23a559;
            background: #23a55910;
        }

        .voice-member-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
        }

        .voice-member-info {
            flex: 1;
        }

        .voice-member-name {
            font-weight: bold;
            font-size: 14px;
        }

        .voice-member-status {
            font-size: 10px;
            color: #23a559;
        }

        .voice-member-mic-off {
            color: #ed4245;
        }

        /* نافذة الفيديو */
        .video-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 380px;
            background: #1e1f22;
            border-radius: 12px;
            border: 2px solid #5865f2;
            overflow: hidden;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .video-header {
            background: #2b2d31;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .video-header button {
            background: #ed4245;
            border: none;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        video {
            width: 100%;
            background: #000;
        }

        .remote-video {
            border-top: 1px solid #2b2d31;
        }

        /* تنبيهات */
        .notification-toast {
            position: fixed;
            bottom: 100px;
            right: 20px;
            background: #23a559;
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            z-index: 1001;
            animation: slideIn 0.3s ease;
            font-size: 14px;
        }

        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .call-badge {
            background: #23a559;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- خوادم -->
        <div class="servers-sidebar" id="serversSidebar">
            <div class="server-icon active" data-server="amman">🇯🇴</div>
            <div class="server-icon" data-server="gamers">🎮</div>
            <div class="server-icon" data-server="study">📚</div>
            <div class="server-icon add-server" id="addServerBtn">+</div>
        </div>

        <!-- قنوات -->
        <div class="channels-sidebar">
            <div class="server-header">
                <span id="currentServerName">🇯🇴 عمان تاون</span>
            </div>
            <div class="channels-list" id="channelsList"></div>
        </div>

        <!-- شات رئيسي -->
        <div class="chat-area">
            <div class="chat-header">
                <span># <span id="currentChannelName">الترحيب</span></span>
                <div class="voice-controls">
                    <button class="voice-btn" id="micBtn">🎤 كتم</button>
                    <button class="voice-btn" id="screenShareBtn">🖥️ شير سكرين</button>
                    <span class="call-badge" id="callBadge" style="display: none;">🎙️ في المكالمة</span>
                </div>
            </div>
            <div class="messages-container" id="messagesContainer"></div>
            <div class="message-input-area">
                <div class="message-input-wrapper">
                    <textarea class="message-input" id="messageInput" placeholder="أرسل رسالة... (Enter)" rows="1"></textarea>
                </div>
            </div>
        </div>

        <!-- أعضاء الغرفة الصوتية -->
        <div class="voice-members-panel" id="voiceMembersPanel" style="display: none;">
            <div class="voice-members-header">
                🔊 أعضاء الغرفة الصوتية — <span id="voiceMemberCount">0</span>
            </div>
            <div class="voice-members-list" id="voiceMembersList">
                <div style="text-align: center; color: #949ba4; padding: 20px;">لا أحد في المكالمة</div>
            </div>
        </div>
    </div>

    <!-- نافذة الفيديو -->
    <div class="video-panel" id="videoPanel" style="display: none;">
        <div class="video-header">
            <span>🎥 المكالمة الصوتية</span>
            <button id="closeVideoBtn">✕ إغلاق</button>
        </div>
        <div class="local-video">
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div class="remote-video" id="remoteVideoContainer" style="display: none;">
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <script>
        // ============== المستخدم الحالي ==============
        const currentUser = {
            id: 'user_' + Math.random().toString(36).substr(2, 8),
            username: prompt('أدخل اسمك:', 'أحمد_' + Math.floor(Math.random() * 100)) || 'زائر',
            avatar: '🇯🇴',
            micEnabled: true
        };

        // ============== الخوادم ==============
        let servers = {
            amman: {
                name: '🇯🇴 عمان تاون',
                channels: [
                    { id: 'welcome', name: 'الترحيب', type: 'text' },
                    { id: 'general', name: 'سوالف عمان', type: 'text' },
                    { id: 'voice-amman', name: 'صوت عمان', type: 'voice' }
                ]
            },
            gamers: {
                name: '🎮 جيمرز الأردن',
                channels: [
                    { id: 'lfg', name: 'دور فريق', type: 'text' },
                    { id: 'valorant', name: 'فالورانت', type: 'text' },
                    { id: 'voice-gaming', name: 'صوت الجيمرز', type: 'voice' }
                ]
            },
            study: {
                name: '📚 دراسة الأردن',
                channels: [
                    { id: 'study', name: 'مذاكرة عامة', type: 'text' },
                    { id: 'programming', name: 'برمجة', type: 'text' },
                    { id: 'voice-study', name: 'صوت المذاكرة', type: 'voice' }
                ]
            }
        };

        // ============== أعضاء الغرفة الصوتية ==============
        let voiceMembers = [];

        // ============== الرسائل ==============
        let messages = {
            amman_welcome: [
                { id: 1, username: 'النظام', avatar: '⚙️', text: '👋 مرحباً في خادم عمان! اضغط على قناة "صوت عمان" عشان تدخل الغرفة الصوتية', time: new Date().toLocaleTimeString() }
            ]
        };

        let currentServer = 'amman';
        let currentChannel = 'welcome';

        // ============== WebRTC ==============
        let localStream = null;
        let peerConnections = new Map(); // لدعم عدة مستخدمين
        let isInCall = false;
        let isMuted = false;
        let isScreenSharing = false;
        let originalStream = null;

        // تحديث عرض الأعضاء
        function updateVoiceMembersUI() {
            const panel = document.getElementById('voiceMembersPanel');
            const list = document.getElementById('voiceMembersList');
            const count = document.getElementById('voiceMemberCount');
            
            count.innerText = voiceMembers.length;
            
            if (voiceMembers.length === 0) {
                list.innerHTML = '<div style="text-align: center; color: #949ba4; padding: 20px;">🔇 لا أحد في المكالمة</div>';
                return;
            }
            
            list.innerHTML = voiceMembers.map(member => `
                <div class="voice-member ${member.speaking ? 'voice-member-speaking' : ''}" id="member-${member.id}">
                    <div class="voice-member-avatar" style="background: ${member.color || '#5865f2'}">${member.avatar}</div>
                    <div class="voice-member-info">
                        <div class="voice-member-name">${member.username}</div>
                        <div class="voice-member-status ${!member.micEnabled ? 'voice-member-mic-off' : ''}">
                            ${member.micEnabled ? '🎤 يتحدث' : '🔇 مكتوم'}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // إضافة عضو للغرفة
        function addVoiceMember(user) {
            if (!voiceMembers.find(m => m.id === user.id)) {
                voiceMembers.push({
                    id: user.id,
                    username: user.username,
                    avatar: user.avatar,
                    micEnabled: true,
                    speaking: false,
                    color: '#' + Math.floor(Math.random()*16777215).toString(16)
                });
                updateVoiceMembersUI();
                
                // إشعار دخول
                showNotification(`🔔 ${user.username} دخل الغرفة الصوتية!`, true);
                addSystemMessage(`🔔 ${user.username} دخل الغرفة الصوتية`);
                playJoinSound();
            }
        }

        // إزالة عضو
        function removeVoiceMember(userId) {
            const member = voiceMembers.find(m => m.id === userId);
            if (member) {
                voiceMembers = voiceMembers.filter(m => m.id !== userId);
                updateVoiceMembersUI();
                showNotification(`🔕 ${member.username} غادر الغرفة`, false);
                addSystemMessage(`🔕 ${member.username} غادر الغرفة الصوتية`);
                playLeaveSound();
            }
        }

        // تحديث حالة الكلام
        function updateSpeakingStatus(userId, isSpeaking) {
            const member = voiceMembers.find(m => m.id === userId);
            if (member) {
                member.speaking = isSpeaking;
                const element = document.getElementById(`member-${userId}`);
                if (element) {
                    if (isSpeaking) element.classList.add('voice-member-speaking');
                    else element.classList.remove('voice-member-speaking');
                }
            }
        }

        // الأصوات
        function playJoinSound() {
            try {
                const audio = new Audio();
                audio.src = 'https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3';
                audio.volume = 0.2;
                audio.play().catch(e => console.log);
            } catch(e) {}
        }

        function playLeaveSound() {
            try {
                const audio = new Audio();
                audio.src = 'https://www.soundjay.com/misc/sounds/button-09.mp3';
                audio.volume = 0.2;
                audio.play().catch(e => console.log);
            } catch(e) {}
        }

        function showNotification(msg, isJoin) {
            const toast = document.createElement('div');
            toast.className = 'notification-toast';
            toast.innerHTML = msg;
            toast.style.background = isJoin ? '#23a559' : '#ed4245';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
            
            document.title = isJoin ? '🔴 ' + msg : 'ديسكورد الأردن';
            setTimeout(() => { if(isInCall) document.title = '🎙️ في المكالمة - ' + voiceMembers.length + ' أعضاء'; else document.title = 'ديسكورد الأردن'; }, 3000);
        }

        // بدء المكالمة
        async function startCall() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                originalStream = localStream;
                document.getElementById('localVideo').srcObject = localStream;
                
                // إضافة نفسك للأعضاء
                addVoiceMember(currentUser);
                
                // إظهار لوحة الأعضاء
                document.getElementById('voiceMembersPanel').style.display = 'flex';
                document.getElementById('videoPanel').style.display = 'block';
                document.getElementById('callBadge').style.display = 'inline-block';
                isInCall = true;
                
                // مراقبة مستوى الصوت عشان تظهر إنك عم تحكي
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(localStream);
                const analyser = audioContext.createAnalyser();
                source.connect(analyser);
                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                setInterval(() => {
                    if (!isInCall) return;
                    analyser.getByteFrequencyData(dataArray);
                    let level = 0;
                    for (let i = 0; i < dataArray.length; i++) level += dataArray[i];
                    level /= dataArray.length;
                    
                    const isSpeakingNow = level > 30;
                    if (isSpeakingNow !== currentUser.speaking) {
                        currentUser.speaking = isSpeakingNow;
                        updateSpeakingStatus(currentUser.id, isSpeakingNow);
                    }
                    
                    const localVideoEl = document.getElementById('localVideo');
                    if (isSpeakingNow) localVideoEl.style.border = '3px solid #23a559';
                    else localVideoEl.style.border = 'none';
                }, 200);
                
                addSystemMessage('🎙️ دخلت الغرفة الصوتية - أنت الآن تُسمع');
                
                // محاكاة مستخدمين آخرين (للعرض التوضيحي)
                setTimeout(() => {
                    if (isInCall && voiceMembers.length === 1) {
                        // محاكاة دخول مستخدم وهمي للعرض
                        const fakeUser = {
                            id: 'fake_' + Date.now(),
                            username: 'سارة',
                            avatar: 'س',
                            micEnabled: true
                        };
                        addVoiceMember(fakeUser);
                    }
                }, 5000);
                
            } catch(error) {
                console.error(error);
                alert('يرجى السماح بالوصول إلى الميكروفون والكاميرا');
            }
        }

        // إنهاء المكالمة
        function endCall() {
            // إزالة المستخدم من الأعضاء
            voiceMembers = [];
            updateVoiceMembersUI();
            
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            
            peerConnections.forEach((pc, id) => {
                pc.close();
            });
            peerConnections.clear();
            
            document.getElementById('voiceMembersPanel').style.display = 'none';
            document.getElementById('videoPanel').style.display = 'none';
            document.getElementById('callBadge').style.display = 'none';
            document.getElementById('micBtn').classList.remove('mic-off');
            document.getElementById('micBtn').textContent = '🎤 كتم';
            
            isInCall = false;
            isMuted = false;
            isScreenSharing = false;
            document.getElementById('screenShareBtn').classList.remove('screen-active');
            document.getElementById('screenShareBtn').textContent = '🖥️ شير سكرين';
            
            addSystemMessage('🔇 غادرت الغرفة الصوتية');
        }

        // كتم المايك
        function toggleMute() {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                isMuted = !isMuted;
                audioTrack.enabled = !isMuted;
                const micBtn = document.getElementById('micBtn');
                micBtn.textContent = isMuted ? '🎙️ الغاء كتم' : '🎤 كتم';
                micBtn.classList.toggle('mic-off', isMuted);
                
                // تحديث حالة المايك في قائمة الأعضاء
                currentUser.micEnabled = !isMuted;
                const member = voiceMembers.find(m => m.id === currentUser.id);
                if (member) member.micEnabled = !isMuted;
                updateVoiceMembersUI();
                
                addSystemMessage(isMuted ? '🔇 كتمت المايك - محدش بسمعك' : '🎙️ فتحت المايك - الكل بسمعك');
            }
        }

        // مشاركة الشاشة
        async function toggleScreenShare() {
            if (!isInCall) {
                alert('أولاً ادخل على الغرفة الصوتية 🎙️');
                return;
            }
            
            if (!isScreenSharing) {
                try {
                    const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                    const videoTrack = screenStream.getVideoTracks()[0];
                    
                    // تحديث الفيديو المحلي
                    localStream = screenStream;
                    document.getElementById('localVideo').srcObject = screenStream;
                    
                    videoTrack.onended = () => stopScreenShare();
                    
                    isScreenSharing = true;
                    const btn = document.getElementById('screenShareBtn');
                    btn.classList.add('screen-active');
                    btn.textContent = '🖥️ ايقاف الشير';
                    addSystemMessage('🖥️ عم تشارك شاشتك');
                } catch(e) {
                    alert('بدك تسمح لمشاركة الشاشة');
                }
            } else {
                stopScreenShare();
            }
        }

        function stopScreenShare() {
            if (originalStream) {
                localStream = originalStream;
                document.getElementById('localVideo').srcObject = originalStream;
            }
            isScreenSharing = false;
            const btn = document.getElementById('screenShareBtn');
            btn.classList.remove('screen-active');
            btn.textContent = '🖥️ شير سكرين';
            addSystemMessage('🖥️ أوقفت مشاركة الشاشة');
        }

        // ============== الدردشة ==============
        function getMessageKey() { return `${currentServer}_${currentChannel}`; }
        
        function addMessage(text) {
            if (!text.trim()) return;
            const key = getMessageKey();
            if (!messages[key]) messages[key] = [];
            messages[key].push({
                id: Date.now(),
                username: currentUser.username,
                avatar: currentUser.avatar,
                text: text.trim(),
                time: new Date().toLocaleTimeString('ar-EG')
            });
            renderMessages();
        }
        
        function addSystemMessage(text) {
            const key = getMessageKey();
            if (!messages[key]) messages[key] = [];
            messages[key].push({
                id: Date.now(),
                username: 'النظام',
                avatar: '⚙️',
                text: text,
                time: new Date().toLocaleTimeString('ar-EG')
            });
            renderMessages();
        }
        
        function renderMessages() {
            const key = getMessageKey();
            const msgs = messages[key] || [];
            const container = document.getElementById('messagesContainer');
            if (msgs.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#949ba4;">💬 ما في رسائل</div>';
                return;
            }
            container.innerHTML = msgs.map(m => `
                <div class="message">
                    <div class="message-avatar">${m.avatar}</div>
                    <div>
                        <div>
                            <span class="message-username">${m.username}</span>
                            <span class="message-time">${m.time}</span>
                        </div>
                        <div>${escapeHtml(m.text)}</div>
                    </div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }
        
        function escapeHtml(t) {
            return t.replace(/[&<>]/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m];
            });
        }
        
        // عرض القنوات
        function renderChannels() {
            const server = servers[currentServer];
            document.getElementById('currentServerName').innerHTML = server.name;
            
            document.getElementById('channelsList').innerHTML = `
                <div class="category-name">📝 قنوات نصية</div>
                ${server.channels.filter(c => c.type === 'text').map(ch => `
                    <div class="channel ${ch.id === currentChannel ? 'active' : ''}" data-channel-id="${ch.id}">
                        # ${ch.name}
                    </div>
                `).join('')}
                <div class="category-name">🔊 قنوات صوتية</div>
                ${server.channels.filter(c => c.type === 'voice').map(ch => `
                    <div class="channel voice-channel ${ch.id === currentChannel ? 'active' : ''}" data-channel-id="${ch.id}">
                        🔊 ${ch.name}
                    </div>
                `).join('')}
            `;
            
            document.querySelectorAll('.channel').forEach(ch => {
                ch.addEventListener('click', () => {
                    const id = ch.getAttribute('data-channel-id');
                    if (id) {
                        currentChannel = id;
                        renderChannels();
                        renderMessages();
                        const channel = servers[currentServer].channels.find(c => c.id === id);
                        document.getElementById('currentChannelName').innerHTML = channel?.name || id;
                        
                        // إذا كانت قناة صوتية
                        if (channel?.type === 'voice') {
                            if (!isInCall && confirm('🎙️ بدك تدخل الغرفة الصوتية؟')) {
                                startCall();
                            }
                        }
                    }
                });
            });
        }
        
        // إضافة خادم جديد
        function addNewServer() {
            const name = prompt('شو بدك تسمي الخادم الجديد؟');
            if (!name) return;
            const id = 'server_' + Date.now();
            servers[id] = {
                name: name,
                channels: [
                    { id: 'general', name: 'العام', type: 'text' },
                    { id: 'voice', name: 'الصوت', type: 'voice' }
                ]
            };
            const div = document.createElement('div');
            div.className = 'server-icon';
            div.setAttribute('data-server', id);
            div.innerText = '📁';
            div.onclick = () => {
                if (isInCall) endCall();
                currentServer = id;
                currentChannel = servers[id].channels[0].id;
                renderChannels();
                renderMessages();
                document.getElementById('currentChannelName').innerHTML = servers[id].channels[0].name;
            };
            document.getElementById('serversSidebar').insertBefore(div, document.getElementById('addServerBtn'));
            currentServer = id;
            currentChannel = servers[id].channels[0].id;
            renderChannels();
            renderMessages();
            document.getElementById('currentChannelName').innerHTML = servers[id].channels[0].name;
            if (isInCall) endCall();
        }
        
        // التهيئة
        function init() {
            document.querySelectorAll('.server-icon[data-server]').forEach(icon => {
                icon.addEventListener('click', () => {
                    if (isInCall) endCall();
                    currentServer = icon.getAttribute('data-server');
                    currentChannel = servers[currentServer].channels[0].id;
                    renderChannels();
                    renderMessages();
                    document.getElementById('currentChannelName').innerHTML = servers[currentServer].channels[0].name;
                });
            });
            
            document.getElementById('addServerBtn').addEventListener('click', addNewServer);
            document.getElementById('micBtn').addEventListener('click', toggleMute);
            document.getElementById('screenShareBtn').addEventListener('click', toggleScreenShare);
            document.getElementById('closeVideoBtn').addEventListener('click', () => {
                if (isInCall) endCall();
                else document.getElementById('videoPanel').style.display = 'none';
            });
            
            document.getElementById('messageInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    addMessage(e.target.value);
                    e.target.value = '';
                }
            });
            
            renderChannels();
            renderMessages();
            
            addSystemMessage(`👋 أهلاً بك ${currentUser.username}! اضغط على قناة "🔊 صوت عمان" عشان تدخل الغرفة الصوتية`);
        }
        
        init();
    </script>
</body>
</html>
