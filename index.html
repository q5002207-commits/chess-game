<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🏁 سباق السيارات أونلاين - سباق واحد للجميع 🏎️</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; touch-action: manipulation; }
        body {
            font-family: 'Segoe UI', Tahoma, Verdana, sans-serif;
            background: linear-gradient(145deg, #0a2f1f, #051a0e);
            margin: 0;
            padding: 20px;
            color: #ffd966;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: #1e2a1a;
            border-radius: 60px;
            padding: 20px;
            border: 3px solid #f1c40f;
        }
        h1, h2 { text-align: center; color: #f1c40f; margin: 0 0 10px 0; }
        .room-box {
            background: #0f1f0f;
            border-radius: 30px;
            padding: 20px;
            text-align: center;
            margin: 15px 0;
        }
        input {
            width: 80%;
            padding: 12px;
            border-radius: 30px;
            border: 2px solid #f1c40f;
            background: #0a1a0a;
            color: #f39c12;
            text-align: center;
            font-size: 1rem;
            margin: 10px 0;
        }
        button {
            background: #f39c12;
            color: #1e2a1a;
            border: none;
            padding: 12px 25px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin: 5px;
        }
        button:active { transform: scale(0.97); }
        .danger-btn { background: #e74c3c; color: white; }
        .success-btn { background: #27ae60; color: white; }
        .hidden { display: none; }
        .race-track { background: #2c3e2f; border-radius: 30px; padding: 15px; margin: 15px 0; }
        .car-lane {
            background: #1a2a1a;
            margin-bottom: 10px;
            border-radius: 25px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .car-icon { font-size: 1.8rem; width: 50px; text-align: center; }
        .car-name { width: 80px; font-weight: bold; font-size: 0.8rem; }
        .track-bar { flex: 1; background: #3a4a2a; border-radius: 20px; height: 35px; overflow: hidden; }
        .car-progress {
            width: 0%;
            height: 100%;
            border-radius: 20px;
            transition: width 0.02s linear;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            color: white;
            font-weight: bold;
            font-size: 0.7rem;
        }
        .car-red .car-progress { background: #e74c3c; }
        .car-blue .car-progress { background: #3498db; }
        .car-green .car-progress { background: #2ecc71; }
        .car-yellow .car-progress { background: #f1c40f; color: #1e2a1a; }
        .cars-selector { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 15px 0; }
        .car-card {
            background: #1e2a1a;
            border: 2px solid #f1c40f;
            border-radius: 25px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            min-width: 80px;
        }
        .car-card.selected { background: #f39c12; color: #1e2a1a; border-color: white; }
        .car-card .emoji { font-size: 1.8rem; }
        .car-card .multiplier { font-size: 0.7rem; }
        .bet-control { display: flex; gap: 10px; justify-content: center; margin: 15px 0; flex-wrap: wrap; }
        .bet-control input { width: 120px; margin: 0; }
        .bet-control button { margin: 0; }
        .race-btn { width: 100%; padding: 15px; font-size: 1.2rem; margin-top: 10px; }
        .result { background: #000000aa; border-radius: 25px; padding: 10px; margin: 10px 0; text-align: center; font-weight: bold; }
        .history { background: #0f1f0f; border-radius: 20px; padding: 10px; margin-top: 15px; max-height: 120px; overflow-y: auto; font-size: 0.7rem; }
        .players-list { display: flex; gap: 10px; justify-content: center; margin: 10px 0; flex-wrap: wrap; }
        .player-badge { background: #0f1f0f; border-radius: 25px; padding: 5px 12px; text-align: center; border: 1px solid #f1c40f; }
        .player-badge.host { border-color: gold; background: #2c5a2e; }
        .status { text-align: center; padding: 8px; border-radius: 25px; margin: 10px 0; font-size: 0.9rem; }
        .status.waiting { background: #e67e22; color: white; }
        .status.ready { background: #27ae60; color: white; }
        .status.racing { background: #e74c3c; color: white; }
        .back-home { background: #333; color: white; width: auto; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container" id="app">
    <button class="back-home" onclick="location.reload()">🏠 القائمة الرئيسية</button>
    <h1>🏁 سباق السيارات 🏎️</h1>
    <h2>🏆 سباق واحد للجميع 🏆</h2>

    <!-- شاشة الدخول -->
    <div id="loginScreen">
        <div class="room-box">
            <input type="text" id="playerName" placeholder="اسمك...">
            <button onclick="createRoom()">👑 إنشاء غرفة</button>
            <p style="margin: 10px;">أو</p>
            <input type="text" id="roomCode" placeholder="كود الغرفة">
            <button onclick="joinRoom()">🚪 دخول الغرفة</button>
        </div>
    </div>

    <!-- شاشة اللوبي -->
    <div id="lobbyScreen" class="hidden">
        <div class="status waiting" id="statusBox">⏳ انتظار اتصال الخصم...</div>
        <div class="players-list" id="playersList"></div>
        <div class="room-box">
            <div id="roomCodeDisplay"></div>
            <button onclick="startRaceFromHost()" id="startRaceHostBtn" class="success-btn hidden" style="width:100%;">🏁 ابدأ السباق 🏁</button>
        </div>
    </div>

    <!-- شاشة اللعب -->
    <div id="gameScreen" class="hidden">
        <div class="players-list" id="gamePlayersList"></div>
        
        <div class="balance-card">
            <div>💰 رصيدك</div>
            <div class="balance-amount" id="myBalance">1000</div>
        </div>

        <div class="race-track" id="raceTrack">
            <div class="car-lane car-red"><div class="car-icon">🏎️</div><div class="car-name">الأحمر ×2.5</div><div class="track-bar"><div class="car-progress" id="prog0" style="width:0%">0%</div></div></div>
            <div class="car-lane car-blue"><div class="car-icon">🏎️</div><div class="car-name">الأزرق ×3.0</div><div class="track-bar"><div class="car-progress" id="prog1" style="width:0%">0%</div></div></div>
            <div class="car-lane car-green"><div class="car-icon">🏎️</div><div class="car-name">الأخضر ×4.0</div><div class="track-bar"><div class="car-progress" id="prog2" style="width:0%">0%</div></div></div>
            <div class="car-lane car-yellow"><div class="car-icon">🏎️</div><div class="car-name">الأصفر ×5.0</div><div class="track-bar"><div class="car-progress" id="prog3" style="width:0%">0%</div></div></div>
        </div>

        <div class="cars-selector" id="carSelector">
            <div class="car-card" data-car="0"><div class="emoji">🏎️</div><div>الأحمر</div><div class="multiplier">×2.5</div></div>
            <div class="car-card" data-car="1"><div class="emoji">🏎️</div><div>الأزرق</div><div class="multiplier">×3.0</div></div>
            <div class="car-card" data-car="2"><div class="emoji">🏎️</div><div>الأخضر</div><div class="multiplier">×4.0</div></div>
            <div class="car-card" data-car="3"><div class="emoji">🏎️</div><div>الأصفر</div><div class="multiplier">×5.0</div></div>
        </div>

        <div class="bet-control">
            <input type="number" id="betAmount" value="50" min="10" max="10000" step="10">
            <button id="placeBetBtn" style="background:#e67e22;">💰 ضع الرهان</button>
        </div>

        <div id="resultArea" class="result"></div>
        <div class="history" id="historyArea"></div>
    </div>
</div>

<script>
    // ---------- المتغيرات ----------
    let peer = null;
    let conn = null;
    let myName = "";
    let myBalance = 1000;
    let myBet = 0;
    let myCar = null;
    let isHost = false;
    let roomId = "";
    let players = []; // { name, balance, bet, car, isHost }
    let raceInProgress = false;
    let raceInterval = null;
    
    const multipliers = [2.5, 3.0, 4.0, 5.0];
    const carNames = ["الأحمر", "الأزرق", "الأخضر", "الأصفر"];
    
    // ---------- دوال مساعدة ----------
    function addHistory(msg, isWin = null) {
        const div = document.getElementById("historyArea");
        const item = document.createElement("div");
        item.innerHTML = msg;
        if (isWin === true) item.style.color = "#2ecc71";
        else if (isWin === false) item.style.color = "#e74c3c";
        else item.style.color = "#ffd966";
        div.prepend(item);
        while(div.children.length > 15) div.removeChild(div.lastChild);
    }
    
    function updateUI() {
        document.getElementById("myBalance").innerHTML = myBalance;
        // تحديث قائمة اللاعبين
        const gamePlayersDiv = document.getElementById("gamePlayersList");
        if (gamePlayersDiv) {
            gamePlayersDiv.innerHTML = "";
            for (let p of players) {
                const badge = document.createElement("div");
                badge.className = "player-badge" + (p.isHost ? " host" : "");
                badge.innerHTML = `<strong>${p.name}</strong><br>💰 ${p.balance}<br>${p.bet > 0 ? `🏁 ${carNames[p.car]} ×${multipliers[p.car]}<br>💰 رهان: ${p.bet}` : "⌛ لم يراهن"}`;
                gamePlayersDiv.appendChild(badge);
            }
        }
    }
    
    function updateLobbyPlayers() {
        const playersDiv = document.getElementById("playersList");
        if (playersDiv) {
            playersDiv.innerHTML = "";
            for (let p of players) {
                const badge = document.createElement("div");
                badge.className = "player-badge" + (p.isHost ? " host" : "");
                badge.innerHTML = `<strong>${p.name}</strong> ${p.isHost ? "👑" : ""}<br>💰 ${p.balance}`;
                playersDiv.appendChild(badge);
            }
        }
    }
    
    function sendToPeer(data) {
        if (conn && conn.open) conn.send(data);
    }
    
    // ---------- بدء السباق (المضيف فقط) ----------
    function startRace() {
        if (!isHost) return;
        if (raceInProgress) return;
        
        // تأكد أن الكل راهن
        let allBet = true;
        for (let p of players) {
            if (!p.bet || p.bet <= 0) allBet = false;
        }
        if (!allBet) {
            addHistory("⚠️ انتظر حتى يراهن جميع اللاعبين!", false);
            return;
        }
        
        raceInProgress = true;
        addHistory("🏁 انطلق السباق! 🏁", null);
        sendToPeer({ type: "race_start" });
        
        // إعادة تعيين مواقع السيارات
        for (let i = 0; i < 4; i++) {
            document.getElementById(`prog${i}`).style.width = "0%";
            document.getElementById(`prog${i}`).innerHTML = "0%";
        }
        
        let positions = [0, 0, 0, 0];
        let speeds = [
            Math.random() * 2 + 1.5,
            Math.random() * 2 + 1.5,
            Math.random() * 2 + 1.5,
            Math.random() * 2 + 1.5
        ];
        let finished = false;
        let winner = null;
        
        if (raceInterval) clearInterval(raceInterval);
        raceInterval = setInterval(() => {
            if (finished) return;
            for (let i = 0; i < 4; i++) {
                if (positions[i] < 100) {
                    positions[i] = Math.min(100, positions[i] + speeds[i] + Math.random() * 1.5);
                    const percent = Math.floor(positions[i]);
                    document.getElementById(`prog${i}`).style.width = `${percent}%`;
                    document.getElementById(`prog${i}`).innerHTML = `${percent}%`;
                }
            }
            for (let i = 0; i < 4; i++) {
                if (positions[i] >= 100 && !finished) {
                    finished = true;
                    winner = i;
                    break;
                }
            }
            if (finished) {
                clearInterval(raceInterval);
                raceInProgress = false;
                
                const winnerName = carNames[winner];
                const winnerMulti = multipliers[winner];
                addHistory(`🏆 الفائز: ${winnerName} (×${winnerMulti}) 🏆`, true);
                sendToPeer({ type: "race_result", winner: winner });
                
                let resultMsg = `🏆 الفائز: ${winnerName} 🏆<br>`;
                // حساب النتائج لكل لاعب
                for (let p of players) {
                    if (p.car === winner && p.bet > 0) {
                        const winAmount = p.bet * winnerMulti;
                        p.balance += winAmount;
                        if (p.name === myName) myBalance = p.balance;
                        addHistory(`🎉 ${p.name} ربح ${Math.floor(winAmount)}!`, true);
                        resultMsg += `<br>🎉 ${p.name} ربح ${Math.floor(winAmount)}!`;
                    } else if (p.bet > 0) {
                        addHistory(`💔 ${p.name} خسر ${p.bet}`, false);
                        resultMsg += `<br>💔 ${p.name} خسر ${p.bet}`;
                    }
                    p.bet = 0;
                    p.car = null;
                }
                document.getElementById("resultArea").innerHTML = resultMsg;
                document.getElementById("resultArea").style.color = "gold";
                myBet = 0;
                myCar = null;
                updateUI();
                
                // إزالة التحديد من السيارات
                document.querySelectorAll(".car-card").forEach(c => c.classList.remove("selected"));
                
                // تمكين الرهان مرة أخرى
                document.getElementById("placeBetBtn").disabled = false;
                document.querySelectorAll(".car-card").forEach(c => c.style.pointerEvents = "auto");
                
                setTimeout(() => {
                    document.getElementById("resultArea").innerHTML = "";
                }, 5000);
            }
        }, 45);
    }
    
    function startRaceFromHost() {
        if (isHost) startRace();
    }
    
    // ---------- وضع الرهان ----------
    function placeBet() {
        if (raceInProgress) {
            addHistory("⏳ السباق جاري، لا يمكن الرهان الآن", false);
            return;
        }
        if (myCar === null) {
            addHistory("⚠️ اختر سيارة أولاً!", false);
            return;
        }
        let betVal = parseInt(document.getElementById("betAmount").value);
        if (isNaN(betVal)) betVal = 50;
        if (betVal < 10) betVal = 10;
        if (betVal > 10000) betVal = 10000;
        if (betVal > myBalance) {
            addHistory(`❌ رصيدك ${myBalance} فقط!`, false);
            return;
        }
        
        myBalance -= betVal;
        myBet = betVal;
        
        // تحديث البيانات
        for (let p of players) {
            if (p.name === myName) {
                p.balance = myBalance;
                p.bet = betVal;
                p.car = myCar;
            }
        }
        
        updateUI();
        addHistory(`💰 راهنت بـ ${betVal} على ${carNames[myCar]} (×${multipliers[myCar]})`, null);
        sendToPeer({ type: "player_bet", name: myName, bet: betVal, car: myCar, balance: myBalance });
        
        // تعطيل الرهان بعد وضعه
        document.getElementById("placeBetBtn").disabled = true;
        document.querySelectorAll(".car-card").forEach(c => c.style.pointerEvents = "none");
        
        // إعلام المضيف أن الكل راهن
        if (!isHost) {
            // لا شيء
        }
    }
    
    // ---------- اختيار سيارة ----------
    function selectCar(carIndex) {
        if (raceInProgress) {
            addHistory("⏳ السباق جاري، لا يمكن تغيير الرهان", false);
            return;
        }
        if (myBet > 0) {
            addHistory("⚠️ قمت بالرهان بالفعل! ابدأ السباق أو انتظر المضيف", false);
            return;
        }
        myCar = carIndex;
        document.querySelectorAll(".car-card").forEach(c => c.classList.remove("selected"));
        document.querySelector(`.car-card[data-car='${carIndex}']`).classList.add("selected");
    }
    
    // ---------- إنشاء غرفة ----------
    function createRoom() {
        myName = document.getElementById("playerName").value.trim();
        if (!myName) { alert("اكتب اسمك"); return; }
        isHost = true;
        players = [{ name: myName, balance: 1000, bet: 0, car: null, isHost: true }];
        myBalance = 1000;
        
        roomId = "RACE_" + Math.floor(1000 + Math.random() * 9000);
        peer = new Peer(roomId);
        
        peer.on("open", () => {
            document.getElementById("loginScreen").classList.add("hidden");
            document.getElementById("lobbyScreen").classList.remove("hidden");
            document.getElementById("roomCodeDisplay").innerHTML = `🔑 كود الغرفة: <strong style="color:gold">${roomId}</strong><br>شاركه مع صديقك`;
            updateLobbyPlayers();
        });
        
        peer.on("connection", (connection) => {
            conn = connection;
            conn.on("data", handleData);
            document.getElementById("statusBox").className = "status ready";
            document.getElementById("statusBox").innerHTML = "✅ تم اتصال الخصم! جاري بدء اللعبة...";
            
            // إرسال البيانات للمتصل الجديد
            conn.send({ type: "init", players: players, hostName: myName });
            
            setTimeout(() => {
                document.getElementById("lobbyScreen").classList.add("hidden");
                document.getElementById("gameScreen").classList.remove("hidden");
                updateUI();
            }, 1000);
        });
    }
    
    // ---------- دخول غرفة ----------
    function joinRoom() {
        myName = document.getElementById("playerName").value.trim();
        const code = document.getElementById("roomCode").value.trim();
        if (!myName) { alert("اكتب اسمك"); return; }
        if (!code) { alert("اكتب كود الغرفة"); return; }
        isHost = false;
        
        peer = new Peer();
        peer.on("open", () => {
            conn = peer.connect(code);
            conn.on("open", () => {
                document.getElementById("loginScreen").classList.add("hidden");
                document.getElementById("lobbyScreen").classList.remove("hidden");
                document.getElementById("roomCodeDisplay").innerHTML = `🎲 تم الاتصال بالغرفة: ${code}`;
                document.getElementById("statusBox").innerHTML = "⏳ جاري الاتصال بالمضيف...";
                
                conn.send({ type: "join", name: myName, balance: 1000 });
            });
            conn.on("data", handleData);
        });
    }
    
    // ---------- معالجة البيانات ----------
    function handleData(data) {
        if (data.type === "init") {
            players = data.players;
            for (let p of players) {
                if (p.name === myName) myBalance = p.balance;
            }
            document.getElementById("lobbyScreen").classList.add("hidden");
            document.getElementById("gameScreen").classList.remove("hidden");
            updateUI();
            addHistory("🎮 دخلت الغرفة! راهن على سيارة", null);
        }
        
        if (data.type === "join") {
            players.push({ name: data.name, balance: data.balance, bet: 0, car: null, isHost: false });
            updateLobbyPlayers();
            if (isHost) {
                sendToPeer({ type: "update_players", players: players });
                document.getElementById("statusBox").className = "status ready";
                document.getElementById("statusBox").innerHTML = "✅ اكتمل اللاعبون! ابدأ اللعبة";
                document.getElementById("startRaceHostBtn").classList.remove("hidden");
            }
        }
        
        if (data.type === "update_players") {
            players = data.players;
            for (let p of players) {
                if (p.name === myName) myBalance = p.balance;
            }
            updateLobbyPlayers();
            document.getElementById("lobbyScreen").classList.add("hidden");
            document.getElementById("gameScreen").classList.remove("hidden");
            updateUI();
        }
        
        if (data.type === "player_bet") {
            for (let p of players) {
                if (p.name === data.name) {
                    p.bet = data.bet;
                    p.car = data.car;
                    p.balance = data.balance;
                    if (data.name === myName) myBalance = data.balance;
                }
            }
            updateUI();
            addHistory(`💰 ${data.name} راهن بـ ${data.bet} على ${carNames[data.car]}`, null);
        }
        
        if (data.type === "race_start") {
            addHistory("🏁 المضيف بدأ السباق! 🏁", null);
        }
        
        if (data.type === "race_result") {
            const winner = data.winner;
            const winnerName = carNames[winner];
            const winnerMulti = multipliers[winner];
            addHistory(`🏆 الفائز: ${winnerName} (×${winnerMulti}) 🏆`, true);
            
            let resultMsg = `🏆 الفائز: ${winnerName} 🏆<br>`;
            for (let p of players) {
                if (p.car === winner && p.bet > 0) {
                    const winAmount = p.bet * winnerMulti;
                    p.balance += winAmount;
                    if (p.name === myName) myBalance = p.balance;
                    addHistory(`🎉 ${p.name} ربح ${Math.floor(winAmount)}!`, true);
                    resultMsg += `<br>🎉 ${p.name} ربح ${Math.floor(winAmount)}!`;
                } else if (p.bet > 0) {
                    addHistory(`💔 ${p.name} خسر ${p.bet}`, false);
                    resultMsg += `<br>💔 ${p.name} خسر ${p.bet}`;
                }
                p.bet = 0;
                p.car = null;
            }
            document.getElementById("resultArea").innerHTML = resultMsg;
            document.getElementById("resultArea").style.color = "gold";
            updateUI();
            myBet = 0;
            myCar = null;
            raceInProgress = false;
            document.querySelectorAll(".car-card").forEach(c => c.classList.remove("selected"));
            document.getElementById("placeBetBtn").disabled = false;
            document.querySelectorAll(".car-card").forEach(c => c.style.pointerEvents = "auto");
            
            setTimeout(() => {
                document.getElementById("resultArea").innerHTML = "";
            }, 5000);
        }
    }
    
    // ---------- ربط الأحداث ----------
    document.querySelectorAll(".car-card").forEach(card => {
        card.addEventListener("click", () => {
            const carIdx = parseInt(card.getAttribute("data-car"));
            selectCar(carIdx);
        });
    });
    document.getElementById("placeBetBtn").addEventListener("click", placeBet);
</script>
</body>
</html>
