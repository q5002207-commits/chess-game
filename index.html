<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام أحمد - بوابة تسجيل الدخول</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center, #0a0f1a 0%, #03060b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }
        /* الخلفية الديناميكية */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.3;
            pointer-events: none;
        }
        .bg-animation span {
            position: absolute;
            color: #da291c;
            font-size: 1.2rem;
            user-select: none;
            animation: float 15s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }
        /* البطاقة الرئيسية */
        .login-card {
            position: relative;
            z-index: 10;
            background: rgba(10, 15, 25, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 60px;
            padding: 50px 40px;
            text-align: center;
            border: 1px solid rgba(218, 41, 28, 0.5);
            box-shadow: 0 25px 45px rgba(0,0,0,0.4), 0 0 0 2px rgba(218,41,28,0.2);
            width: 100%;
            max-width: 460px;
            margin: 20px;
            transition: all 0.3s ease;
        }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #da291c, #ff8c6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
            letter-spacing: -1px;
        }
        .sub {
            color: #8e9aaf;
            margin-bottom: 35px;
            font-size: 0.9rem;
            border-bottom: 1px dashed #2a3a55;
            display: inline-block;
            padding-bottom: 8px;
        }
        /* زر جوجل الأصلي */
        .g_id_signin {
            display: flex;
            justify-content: center;
            margin: 20px auto;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #4a5b7a;
            margin: 30px 0 20px;
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #2a3a55;
        }
        .divider::before { margin-left: 15px; }
        .divider::after { margin-right: 15px; }
        /* معلومات المستخدم العلوية */
        .user-bar {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            background: rgba(10,15,25,0.85);
            backdrop-filter: blur(12px);
            border-radius: 80px;
            padding: 10px 20px;
            display: none;
            align-items: center;
            justify-content: space-between;
            z-index: 200;
            border: 1px solid rgba(218,41,28,0.4);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .user-data { display: flex; align-items: center; gap: 15px; }
        .user-avatar { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #da291c; object-fit: cover; background: #111; }
        .user-name { color: #fff; font-weight: bold; background: #da291c20; padding: 4px 12px; border-radius: 40px; font-size: 0.9rem; }
        .user-email { color: #8e9aaf; font-size: 0.7rem; }
        .logout-btn { background: #da291c; border: none; padding: 8px 24px; border-radius: 40px; color: white; font-weight: bold; cursor: pointer; transition: all 0.2s; }
        .logout-btn:hover { background: #b81f14; transform: scale(0.96); }
        /* اطار اللعبة */
        #game-frame {
            display: none;
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 150;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .footer-note {
            margin-top: 35px;
            font-size: 0.7rem;
            color: #3e4f6e;
        }
        .error-message {
            background: #da291c20;
            border: 1px solid #da291c;
            border-radius: 40px;
            padding: 8px;
            margin-top: 15px;
            color: #ff8a6b;
            font-size: 0.75rem;
            display: none;
        }
    </style>
</head>
<body>

<div class="bg-animation" id="bgAnim"></div>

<!-- شاشة تسجيل الدخول -->
<div class="login-card" id="loginContainer">
    <h1>🔥 AHMED PRO SYSTEM 🔥</h1>
    <div class="sub">تسجيل الدخول إلى المنصة المتكاملة</div>
    
    <!-- حاوية زر جوجل -->
    <div id="googleBtnContainer" class="g_id_signin"></div>
    
    <div class="divider"></div>
    
    <div class="footer-note">
        ⚡ نظام حماية متقدم | تم التحقق بواسطة Google OAuth
    </div>
    <div id="errorMsg" class="error-message"></div>
</div>

<!-- شريط المستخدم -->
<div id="userBar" class="user-bar">
    <div class="user-data">
        <img id="userAvatar" class="user-avatar" src="https://ui-avatars.com/api/?background=da291c&color=fff&name=U">
        <div>
            <div id="userName" class="user-name"></div>
            <div id="userEmail" class="user-email"></div>
        </div>
    </div>
    <button id="logoutBtn" class="logout-btn">🚪 خروج</button>
</div>

<!-- إطار اللعبة الأصلية -->
<div id="game-frame">
    <iframe id="gameIframe" src="about:blank"></iframe>
</div>

<script>
    // ---------------------------------------------------------------
    // 1. إعدادات Firebase - باستخدام Client ID الذي أعطيتنا إياه
    // ---------------------------------------------------------------
    const firebaseConfig = {
        apiKey: "AIzaSyALq7wGqzOU414Q3ZQFmqQVY7UpUHYWjY",   // مفتاح API العام (من مشروعك)
        authDomain: "ahmad-e442a.firebaseapp.com",
        projectId: "ahmad-e442a",
        storageBucket: "ahmad-e442a.firebasestorage.app",
        messagingSenderId: "921619843690",
        appId: "1:921619843690:web:5660308178202b7e81d813"
    };
    
    // تهيئة Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();
    
    // عناصر الواجهة
    const loginContainer = document.getElementById('loginContainer');
    const userBar = document.getElementById('userBar');
    const gameFrame = document.getElementById('game-frame');
    const gameIframe = document.getElementById('gameIframe');
    const errorMsgDiv = document.getElementById('errorMsg');
    
    // -----------------------------------------------------------------
    // 2. وظيفة عرض الأخطاء
    // -----------------------------------------------------------------
    function showError(text) {
        errorMsgDiv.innerText = text;
        errorMsgDiv.style.display = 'block';
        setTimeout(() => { errorMsgDiv.style.display = 'none'; }, 4000);
    }
    
    // -----------------------------------------------------------------
    // 3. عرض معلومات المستخدم
    // -----------------------------------------------------------------
    function showUserProfile(user) {
        loginContainer.style.display = 'none';
        userBar.style.display = 'flex';
        document.getElementById('userName').innerText = user.displayName || user.email;
        document.getElementById('userEmail').innerText = user.email;
        if (user.photoURL) {
            document.getElementById('userAvatar').src = user.photoURL;
        } else {
            document.getElementById('userAvatar').src = 'https://ui-avatars.com/api/?background=da291c&color=fff&name=' + (user.displayName ? user.displayName.charAt(0) : 'A');
        }
    }
    
    function showLoginScreen() {
        loginContainer.style.display = 'block';
        userBar.style.display = 'none';
        gameFrame.style.display = 'none';
        gameIframe.src = 'about:blank';
    }
    
    // -----------------------------------------------------------------
    // 4. تحميل اللعبة الأصلية داخل iframe
    // -----------------------------------------------------------------
    function loadGamePortal() {
        gameFrame.style.display = 'block';
        // هنا نضع رابط صفحة الألعاب الأصلية (التي أنت رافعها)
        gameIframe.src = 'https://q5002207-commits.github.io/chess-game/';
    }
    
    // -----------------------------------------------------------------
    // 5. تسجيل الدخول بجوجل
    // -----------------------------------------------------------------
    async function signInWithGoogle() {
        try {
            const result = await auth.signInWithPopup(provider);
            const user = result.user;
            showUserProfile(user);
            loadGamePortal();
        } catch (error) {
            console.error(error);
            if (error.code === 'auth/unauthorized-domain') {
                showError('⚠️ النطاق غير مصرح به في Firebase. الرجاء إضافة هذا النطاق في Firebase Console (Authentication → Authorized domains).');
            } else {
                showError('فشل تسجيل الدخول: ' + error.message);
            }
        }
    }
    
    // -----------------------------------------------------------------
    // 6. تسجيل الخروج
    // -----------------------------------------------------------------
    async function signOutUser() {
        await auth.signOut();
        showLoginScreen();
    }
    
    // -----------------------------------------------------------------
    // 7. مستمع لحالة تسجيل الدخول
    // -----------------------------------------------------------------
    auth.onAuthStateChanged((user) => {
        if (user) {
            showUserProfile(user);
            loadGamePortal();
        } else {
            showLoginScreen();
        }
    });
    
    // -----------------------------------------------------------------
    // 8. ربط الأزرار + زر جوجل
    // -----------------------------------------------------------------
    document.getElementById('logoutBtn').addEventListener('click', signOutUser);
    
    // وظيفة تحميل مكتبة جوجل وتهيئة الزر
    function initGoogleButton() {
        if (typeof google === 'undefined') {
            setTimeout(initGoogleButton, 300);
            return;
        }
        google.accounts.id.initialize({
            client_id: '1097844769079-b0nerg80otqc671gp2340qfa5i7frrqv.apps.googleusercontent.com',
            callback: (response) => {
                // جوجل تعطيني التوكين، لكننا سنستخدم Firebase للمسار الكامل
                // سأستخدم Firebase مع Google Auth Provider مباشرةً
                signInWithGoogle();
            },
            auto_select: false,
            cancel_on_tap_outside: true,
        });
        google.accounts.id.renderButton(
            document.getElementById('googleBtnContainer'),
            { theme: 'outline', size: 'large', text: 'continue_with', shape: 'pill', logo_alignment: 'left' }
        );
    }
    
    // تحميل سكريبت جوجل ثم تهيئة الزر
    const script = document.createElement('script');
    script.src = 'https://accounts.google.com/gsi/client';
    script.async = true;
    script.defer = true;
    script.onload = initGoogleButton;
    document.head.appendChild(script);
    
    // مؤثرات الخلفية (اختياري)
    function createFloatingSymbols() {
        const container = document.getElementById('bgAnim');
        const symbols = ['0', '1', '#', '!', '?', '}', '{', '>', '<', 'MATRIX', '🔥', 'AHMED'];
        for (let i = 0; i < 65; i++) {
            const span = document.createElement('span');
            span.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            span.style.left = Math.random() * 100 + '%';
            span.style.fontSize = (Math.random() * 18 + 8) + 'px';
            span.style.animationDuration = (Math.random() * 12 + 8) + 's';
            span.style.animationDelay = (Math.random() * 10) + 's';
            span.style.opacity = Math.random() * 0.5 + 0.1;
            container.appendChild(span);
        }
    }
    createFloatingSymbols();
</script>
</body>
</html>
