<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع الذكاء الاصطناعي الخاص بي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #131314;
            color: #e3e3e3;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 20px;
            text-align: center;
            background-color: #1e1f20;
            border-bottom: 1px solid #2f3032;
        }

        header h1 {
            font-size: 1.5rem;
            color: #a8c7fa;
        }

        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 1rem;
            word-wrap: break-word;
            white-space: pre-line; /* عشان يحافظ على أسطر الإجابة المنظمة */
        }

        .user-message {
            background-color: #2b2a2a;
            color: #fff;
            align-self: flex-start;
        }

        .ai-message {
            background-color: #1e1f20;
            color: #e3e3e3;
            align-self: flex-end;
            border: 1px solid #2f3032;
        }

        .input-area {
            padding: 20px;
            background-color: #131314;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        .input-wrapper {
            display: flex;
            background-color: #1e1f20;
            border-radius: 30px;
            padding: 10px 20px;
            border: 1px solid #3c4043;
            align-items: center;
        }

        .input-wrapper:focus-within {
            border-color: #a8c7fa;
        }

        input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            font-size: 1rem;
            outline: none;
            padding: 5px;
        }

        button {
            background-color: #a8c7fa;
            color: #042b5c;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #c2e7ff;
        }
    </style>
</head>
<body>

    <header>
        <h1>مساعد الذكاء الاصطناعي الرهيب 🤖</h1>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message">أهلاً بك! أنا مدعوم بنموذج Gemini الحقيقي الآن. اسألني أي شيء وسأجيبك فوراً! 👇</div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="userInput" placeholder="اكتب سؤالك هنا..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">إرسال</button>
        </div>
    </div>

    <script type="module">
        import { GoogleGenAI } from "https://esm.sh/@google/genai";

        // الـ API Key الخاص بك اللي زودتني فيه
        const apiKey = "AQ.Ab8RN6IBfemV7N1SkB7tlqgYyxY_iEyqeJ9qs1bEe4JxFk6Lcw";
        
        // تجهيز مكتبة الذكاء الاصطناعي
        const ai = new GoogleGenAI({ apiKey: apiKey });

        // تعريف الوظائف على الـ window عشان تشتغل مع أزرار الـ HTML
        window.sendMessage = async function() {
            const userInput = document.getElementById('userInput');
            const text = userInput.value.trim();
            if (text === '') return;

            // 1. عرض رسالة المستخدم
            appendMessage(text, 'user-message');
            userInput.value = '';

            // 2. إظهار رسالة مؤقتة "جاري التفكير..." للذكاء الاصطناعي
            const loadingId = appendMessage('جاري التفكير والتحليل... 🧠', 'ai-message');

            try {
                // 3. إرسال الطلب لـ Gemini (استخدمنا نموذج gemini-2.5-flash الأحدث والأسرع)
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: text,
                });

                // 4. استبدال نص التفكير بالإجابة الحقيقية القادمة من السيرفر
                const aiResponseText = response.text;
                document.getElementById(loadingId).innerText = aiResponseText;

            } catch (error) {
                console.error("حدث خطأ:", error);
                document.getElementById(loadingId).innerText = "عذراً، حدث خطأ أثناء الاتصال بالذكاء الاصطناعي. تأكد من اتصال الإنترنت أو صلاحية المفتاح.";
            }
        };

        window.handleKeyPress = function(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        };

        function appendMessage(text, className) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            const id = 'msg-' + Date.now();
            messageDiv.id = id;
            messageDiv.className = `message ${className}`;
            messageDiv.innerText = text;
            chatContainer.appendChild(messageDiv);
            
            // سكرول تلقائي لأسفل المحادثة
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }
    </script>
</body>
</html>
