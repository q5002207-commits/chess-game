<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🕌 حامي الصلاة - تذكير + حظر + قرآن</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
            color: #0f0;
            min-height: 100vh;
        }
        
        /* شاشة تسجيل الدخول - نفس ستايل الكود الأصلي */
        .login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.96);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.5s ease;
        }
        .login-card {
            background: rgba(10,15,25,0.95);
            backdrop-filter: blur(12px);
            border-radius: 50px;
            padding: 40px;
            text-align: center;
            border: 1px solid #da291c;
            width: 90%;
            max-width: 380px;
        }
        .login-card h1 {
            background: linear-gradient(135deg, #da291c, #ff8c6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 20px;
            font-size: 1.6rem;
        }
        .google-btn {
            background: white;
            border: none;
            border-radius: 40px;
            padding: 12px;
            width: 100%;
            font-size: 1rem;
            font-weight: bold;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            margin: 20px 0;
            transition: transform 0.1s;
        }
        .google-btn:active { transform: scale(0.97); }
        .google-btn img { width: 20px; }
        .error-msg { color: #ff8a6b; margin-top: 10px; font-size: 0.75rem; display: none; }
        
        /* شريط المستخدم - نفس الكود الأصلي */
        .user-bar {
            position: fixed;
            top: 12px;
            left: 12px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            padding: 5px 12px 5px 8px;
            display: none;
            align-items: center;
            gap: 10px;
            z-index: 10001;
            border: 1px solid #da291c;
        }
        .user-data {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid #da291c;
            object-fit: cover;
        }
        .user-name {
            color: #0f0;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .logout-btn {
            background: #da291c;
            border: none;
            padding: 4px 12px;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 0.7rem;
        }
        
        /* القائمة الرئيسية */
        .main-container {
            display: none;
            width: 100%;
            min-height: 100vh;
            padding: 80px 16px 30px;
        }
        #main-menu {
            text-align: center;
            width: 100%;
            max-width: 400px;
            margin: 0 auto;
        }
        .main-title {
            color: #da291c;
            font-size: 1.8rem;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(218,41,28,0.3);
        }
        .menu-btn {
            display: block;
            width: 100%;
            padding: 22px;
            margin: 15px 0;
            background: #111;
            border: 2px solid #da291c;
            color: white;
            border-radius: 15px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-align: center;
        }
        .menu-btn:active {
            transform: scale(0.97);
            background: #da291c;
            box-shadow: 0 0 20px #da291c;
        }
        
        /* الأقسام */
        .section {
            display: none;
            width: 100%;
            min-height: 100vh;
            padding: 80px 16px 30px;
        }
        .back-home {
            position: fixed;
            top: 70px;
            right: 16px;
            background: #333;
            padding: 8px 18px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            border: none;
            font-weight: bold;
            z-index: 100;
        }
        
        /* قسم الصلاة */
        .next-prayer-card {
            background: #da291c;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        .next-prayer-card h3 { margin-bottom: 10px; color: #fff; }
        .next-prayer-time { font-size: 2rem; font-weight: bold; color: #ff0; }
        .prayer-times-container {
            background: #111;
            border-radius: 20px;
            padding: 15px;
            border: 1px solid #da291c;
        }
        .prayer-row {
            display: flex;
            justify-content: space-between;
            padding: 14px;
            border-bottom: 1px solid #222;
        }
        .prayer-name { font-weight: bold; color: #da291c; }
        .prayer-time { font-family: monospace; font-size: 1.2rem; color: #0f0; }
        .location-status {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 15px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 0.8rem;
            color: #aaa;
        }
        
        /* حاجب الصلاة */
        .prayer-blocker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.98);
            z-index: 20000;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(15px);
        }
        .blocker-card {
            background: #111;
            border: 3px solid #da291c;
            border-radius: 30px;
            padding: 35px 25px;
            text-align: center;
            width: 90%;
            max-width: 350px;
        }
        .blocker-card h2 { color: #da291c; margin-bottom: 20px; font-size: 1.6rem; }
        .blocker-card p { margin: 15px 0; line-height: 1.6; color: #ccc; }
        .swear-btn {
            background: #2ecc71;
            border: none;
            padding: 15px 25px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
        .swear-btn:active { transform: scale(0.97); }
        
        /* قسم القرآن */
        .quran-header {
            background: #111;
            border-radius: 20px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
            border: 1px solid #da291c;
        }
        .sura-list {
            background: #111;
            border-radius: 20px;
            padding: 10px;
            max-height: 400px;
            overflow-y: auto;
        }
        .sura-item {
            padding: 14px;
            border-bottom: 1px solid #222;
            cursor: pointer;
            transition: background 0.1s;
        }
        .sura-item:active { background: #da291c20; }
        .sura-name { font-weight: bold; color: #da291c; font-size: 1.1rem; }
        .sura-info { font-size: 0.75rem; color: #888; margin-top: 5px; }
        .quran-viewer {
            background: #0a0a0a;
            border-radius: 20px;
            padding: 20px;
            margin-top: 15px;
            max-height: 450px;
            overflow-y: auto;
            border: 1px solid #da291c;
            font-size: 1.2rem;
            line-height: 2;
            text-align: center;
        }
        .quran-ayah {
            margin: 12px 0;
            padding: 8px;
            border-bottom: 1px solid #222;
        }
        .close-viewer {
            background: #da291c;
            border: none;
            padding: 10px;
            border-radius: 40px;
            color: white;
            width: 100%;
            margin-bottom: 10px;
            cursor: pointer;
        }
        
        .hidden { display: none; }
        button { cursor: pointer; }
        
        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }
        .alert-shake { animation: shake 0.3s ease-in-out; }
    </style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="loginOverlay" class="login-overlay">
    <div class="login-card">
        <h1>🕌 حامي الصلاة 🕌</h1>
        <p style="color:#aaa; margin-bottom:10px; font-size:0.8rem;">تذكير + حظر تطبيقات + قرآن كريم</p>
        <button class="google-btn" id="googleLoginBtn">
            <img src="https://www.google.com/favicon.ico"> تسجيل الدخول بجوجل
        </button>
        <div id="loadingMsg" style="color:#0f0; font-size:0.7rem; display:none;">⏳ جاري...</div>
        <div id="errorMsg" class="error-msg"></div>
    </div>
</div>

<!-- شريط المستخدم -->
<div id="userBar" class="user-bar">
    <div class="user-data">
        <img id="userAvatar" class="user-avatar">
        <span id="userName" class="user-name"></span>
    </div>
    <button id="logoutBtn" class="logout-btn">🚪 خروج</button>
</div>

<!-- القائمة الرئيسية -->
<div id="mainContainer" class="main-container">
    <div id="main-menu">
        <div class="main-title">🔥 حامي الصلاة 🔥</div>
        <button class="menu-btn" onclick="showSection('prayer')">🕌 أوقات الصلاة والحظر</button>
        <button class="menu-btn" onclick="showSection('quran')">📖 المصحف الشريف</button>
    </div>
</div>

<!-- قسم الصلاة -->
<div id="prayerSection" class="section">
    <button class="back-home" onclick="showSection('main')">🏠 القائمة الرئيسية</button>
    <div id="prayerContent">
        <div class="location-status" id="locationStatus">📍 جاري تحديد الموقع...</div>
        <div class="next-prayer-card" id="nextPrayerCard">
            <h3>🕋 الصلاة القادمة</h3>
            <div class="next-prayer-time" id="nextPrayerTime">--:--:--</div>
            <div id="countdownTimer" style="margin-top:10px; font-size:1rem;">⏳ --</div>
        </div>
        <div class="prayer-times-container">
            <div class="prayer-row"><span class="prayer-name">🌅 الفجر</span><span class="prayer-time" id="Fajr">--:--</span></div>
            <div class="prayer-row"><span class="prayer-name">☀️ الشروق</span><span class="prayer-time" id="Sunrise">--:--</span></div>
            <div class="prayer-row"><span class="prayer-name">🌙 الظهر</span><span class="prayer-time" id="Dhuhr">--:--</span></div>
            <div class="prayer-row"><span class="prayer-name">🌤️ العصر</span><span class="prayer-time" id="Asr">--:--</span></div>
            <div class="prayer-row"><span class="prayer-name">🌅 المغرب</span><span class="prayer-time" id="Maghrib">--:--</span></div>
            <div class="prayer-row"><span class="prayer-name">🌙 العشاء</span><span class="prayer-time" id="Isha">--:--</span></div>
        </div>
    </div>
</div>

<!-- قسم القرآن -->
<div id="quranSection" class="section">
    <button class="back-home" onclick="showSection('main')">🏠 القائمة الرئيسية</button>
    <div class="quran-header">
        <h3 style="color:#da291c;">📖 سور القرآن الكريم</h3>
        <p style="font-size:0.75rem; color:#aaa;">اختر سورة لقراءتها</p>
    </div>
    <div class="sura-list" id="suraList"></div>
    <div id="quranViewer" class="quran-viewer hidden">
        <button class="close-viewer" onclick="closeQuranViewer()">✖️ إغلاق</button>
        <div id="quranContent"></div>
    </div>
</div>

<script>
    // ===================== Firebase Config =====================
    const firebaseConfig = {
        apiKey: "AIzaSyAlq7wGqzoU414Q3ZQFmqQvyY7UpUHYWjY",
        authDomain: "ahmad-e442a.firebaseapp.com",
        projectId: "ahmad-e442a",
        storageBucket: "ahmad-e442a.firebasestorage.app",
        messagingSenderId: "921619843690",
        appId: "1:921619843690:web:5660308178202b7e81d813"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    // ===================== عناصر DOM =====================
    const loginOverlay = document.getElementById('loginOverlay');
    const userBar = document.getElementById('userBar');
    const mainContainer = document.getElementById('mainContainer');
    const prayerSection = document.getElementById('prayerSection');
    const quranSection = document.getElementById('quranSection');
    const errorMsg = document.getElementById('errorMsg');
    const loadingMsg = document.getElementById('loadingMsg');

    // ===================== متغيرات الصلاة =====================
    let prayerTimes = {};
    let currentLocation = null;
    let blockerActive = false;
    let blockerCheckInterval = null;
    let countdownInterval = null;
    
    const prayerNamesAr = {
        Fajr: "الفجر",
        Sunrise: "الشروق",
        Dhuhr: "الظهر",
        Asr: "العصر",
        Maghrib: "المغرب",
        Isha: "العشاء"
    };
    
    const prayerOrder = ["Fajr", "Dhuhr", "Asr", "Maghrib", "Isha"];
    
    // تحويل الوقت إلى دقائق
    function timeToMinutes(timeStr) {
        if(!timeStr) return 0;
        let parts = timeStr.split(':');
        return parseInt(parts[0]) * 60 + parseInt(parts[1]);
    }
    
    // الحصول على الوقت الحالي بالدقائق
    function getCurrentMinutes() {
        const now = new Date();
        return now.getHours() * 60 + now.getMinutes();
    }
    
    // الحصول على أقرب صلاة
    function getNextPrayer() {
        const nowMin = getCurrentMinutes();
        let nextName = null;
        let nextMin = null;
        
        for(let prayer of prayerOrder) {
            if(prayerTimes[prayer]) {
                const prayerMin = timeToMinutes(prayerTimes[prayer]);
                if(prayerMin > nowMin) {
                    nextName = prayer;
                    nextMin = prayerMin;
                    break;
                }
            }
        }
        
        if(!nextName && prayerTimes.Fajr) {
            nextName = "Fajr";
            nextMin = timeToMinutes(prayerTimes.Fajr) + 1440;
        }
        
        return { name: nextName, minutes: nextMin };
    }
    
    // تحديث عرض أوقات الصلاة والمؤقت
    function updatePrayerDisplay() {
        for(let [key, time] of Object.entries(prayerTimes)) {
            const el = document.getElementById(key);
            if(el) el.textContent = time;
        }
        
        const next = getNextPrayer();
        if(next.name && prayerTimes[next.name]) {
            const nextPrayerNameAr = prayerNamesAr[next.name];
            document.getElementById('nextPrayerTime').innerHTML = nextPrayerNameAr;
            
            // تحديث العد التنازلي
            if(countdownInterval) clearInterval(countdownInterval);
            
            const updateCountdown = () => {
                const now = new Date();
                let target = new Date();
                let targetMin = timeToMinutes(prayerTimes[next.name]);
                let targetHour = Math.floor(targetMin / 60);
                let targetMinute = targetMin % 60;
                target.setHours(targetHour, targetMinute, 0, 0);
                
                if(target < now) {
                    target.setDate(target.getDate() + 1);
                }
                
                const diff = Math.floor((target - now) / 1000);
                if(diff <= 0) {
                    document.getElementById('countdownTimer').innerHTML = "🔔 وقت الصلاة الآن!";
                    document.getElementById('countdownTimer').style.color = "#ff0";
                    document.getElementById('countdownTimer').classList.add('alert-shake');
                    setTimeout(() => document.getElementById('countdownTimer').classList.remove('alert-shake'), 500);
                } else {
                    const hours = Math.floor(diff / 3600);
                    const mins = Math.floor((diff % 3600) / 60);
                    const secs = diff % 60;
                    document.getElementById('countdownTimer').innerHTML = `⏰ الوقت المتبقي: ${hours.toString().padStart(2,'0')}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
                    document.getElementById('countdownTimer').style.color = "#0f0";
                }
            };
            updateCountdown();
            countdownInterval = setInterval(updateCountdown, 1000);
        }
    }
    
    // جلب أوقات الصلاة من API
    async function fetchPrayerTimes() {
        try {
            // طلب صلاحية الموقع
            const position = await new Promise((resolve, reject) => {
                navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 10000 });
            });
            currentLocation = position;
            document.getElementById('locationStatus').innerHTML = `📍 تم تحديد موقعك (${position.coords.latitude.toFixed(2)}, ${position.coords.longitude.toFixed(2)})`;
            
            const response = await fetch(`https://api.aladhan.com/v1/timings/${Math.floor(Date.now()/1000)}?latitude=${position.coords.latitude}&longitude=${position.coords.longitude}&method=2`);
            const data = await response.json();
            
            if(data.code === 200 && data.data.timings) {
                const timings = data.data.timings;
                prayerTimes = {
                    Fajr: timings.Fajr.substring(0,5),
                    Sunrise: timings.Sunrise.substring(0,5),
                    Dhuhr: timings.Dhuhr.substring(0,5),
                    Asr: timings.Asr.substring(0,5),
                    Maghrib: timings.Maghrib.substring(0,5),
                    Isha: timings.Isha.substring(0,5)
                };
                updatePrayerDisplay();
                startBlockerChecker();
            } else {
                throw new Error("فشل تحميل البيانات");
            }
        } catch(e) {
            console.log("خطأ في تحديد الموقع:", e);
            document.getElementById('locationStatus').innerHTML = "⚠️ لم نتمكن من تحديد موقعك، استخدم أوقات افتراضية (القاهرة)";
            // أوقات افتراضية (القاهرة)
            prayerTimes = {
                Fajr: "05:00",
                Sunrise: "06:30",
                Dhuhr: "12:30",
                Asr: "16:00",
                Maghrib: "18:30",
                Isha: "20:00"
            };
            updatePrayerDisplay();
            startBlockerChecker();
        }
    }
    
    // عرض حاجب الصلاة
    function showPrayerBlocker(prayerName) {
        if(blockerActive) return;
        blockerActive = true;
        
        const oldBlocker = document.getElementById('prayerBlocker');
        if(oldBlocker) oldBlocker.remove();
        
        const blockerDiv = document.createElement('div');
        blockerDiv.id = 'prayerBlocker';
        blockerDiv.className = 'prayer-blocker';
        blockerDiv.innerHTML = `
            <div class="blocker-card">
                <h2>🔔 حان وقت ${prayerNamesAr[prayerName] || 'الصلاة'} 🔔</h2>
                <p>📖 { حَافِظُوا عَلَى الصَّلَوَاتِ وَالصَّلَاةِ الْوُسْطَىٰ }</p>
                <p>⚠️ التطبيقات مغلقة مؤقتاً ⚠️</p>
                <p style="color:#ff0; font-weight:bold;">✋ أحلف بالله العظيم أني أديت صلاة ${prayerNamesAr[prayerName] || 'الصلاة'} كاملة ✋</p>
                <button class="swear-btn" id="swearPrayerBtn">✅ حلفت وصليت → فتح التطبيقات</button>
            </div>
        `;
        document.body.appendChild(blockerDiv);
        
        document.getElementById('swearPrayerBtn').onclick = () => {
            blockerDiv.remove();
            blockerActive = false;
            updatePrayerDisplay();
            // ارجع شغل المؤقت تاني
            startBlockerChecker();
        };
        
        // منع الخروج من الحاجب
        blockerDiv.onclick = (e) => { if(e.target === blockerDiv) return; };
    }
    
    // مراقبة وقت الصلاة
    function startBlockerChecker() {
        if(blockerCheckInterval) clearInterval(blockerCheckInterval);
        
        blockerCheckInterval = setInterval(() => {
            if(blockerActive) return;
            
            const nowMin = getCurrentMinutes();
            const next = getNextPrayer();
            
            if(next.name && prayerTimes[next.name]) {
                const prayerMin = timeToMinutes(prayerTimes[next.name]);
                let diff = prayerMin - nowMin;
                if(diff < 0) diff += 1440;
                
                // إذا كان الوقت الحالي ضمن 5 دقائق قبل أو بعد وقت الصلاة
                if(diff <= 5 && diff >= -10) {
                    // تحقق إذا لم يكن قد تم عرض الحاجب لهذه الصلاة بالفعل
                    const lastBlockerShown = localStorage.getItem('lastBlockerShown');
                    const today = new Date().toDateString();
                    if(lastBlockerShown !== `${today}_${next.name}`) {
                        localStorage.setItem('lastBlockerShown', `${today}_${next.name}`);
                        showPrayerBlocker(next.name);
                    }
                }
            }
        }, 3000);
    }
    
    // ===================== القرآن الكريم =====================
    // قائمة السور
    const surahs = [
        { id: 1, name: "الفاتحة", verses: 7, type: "مكية" },
        { id: 2, name: "البقرة", verses: 286, type: "مدنية" },
        { id: 3, name: "آل عمران", verses: 200, type: "مدنية" },
        { id: 36, name: "يس", verses: 83, type: "مكية" },
        { id: 55, name: "الرحمن", verses: 78, type: "مدنية" },
        { id: 56, name: "الواقعة", verses: 96, type: "مكية" },
        { id: 67, name: "الملك", verses: 30, type: "مكية" },
        { id: 68, name: "القلم", verses: 52, type: "مكية" },
        { id: 69, name: "الحاقة", verses: 52, type: "مكية" },
        { id: 70, name: "المعارج", verses: 44, type: "مكية" },
        { id: 71, name: "نوح", verses: 28, type: "مكية" },
        { id: 72, name: "الجن", verses: 28, type: "مكية" },
        { id: 73, name: "المزمل", verses: 20, type: "مكية" },

    // بناء قائمة السور
    function buildSuraList() {
        const container = document.getElementById('suraList');
        if(!container) return;
        
        let html = '';
        surahs.forEach(sura => {
            html += `
                <div class="sura-item" onclick="loadSurah(${sura.id}, '${sura.name}')">
                    <div class="sura-name">📖 ${sura.name}</div>
                    <div class="sura-info">${sura.verses} آية | ${sura.type}</div>
                </div>
            `;
        });
        container.innerHTML = html;
    }
    
    // تحميل سورة كاملة
    window.loadSurah = async function(surahId, surahName) {
        const viewer = document.getElementById('quranViewer');
        const content = document.getElementById('quranContent');
        
        viewer.classList.remove('hidden');
        content.innerHTML = '<div style="text-align:center;">⏳ جاري تحميل السورة... سبحان الله</div>';
        
        try {
            const response = await fetch(`https://api.alquran.cloud/v1/surah/${surahId}/ar`);
            const data = await response.json();
            
            if(data.data && data.data.ayahs) {
                let html = `<h3 style="color:#da291c; text-align:center; margin-bottom:20px;">سورة ${data.data.name}</h3>`;
                html += `<p style="text-align:center; color:#888; margin-bottom:20px;">${data.data.numberOfAyahs} آية | ${data.data.revelationType}</p>`;
                
                data.data.ayahs.forEach(ayah => {
                    html += `<div class="quran-ayah">${ayah.text}</div>`;
                });
                content.innerHTML = html;
                // تمرير للأعلى
                viewer.scrollTop = 0;
            } else {
                content.innerHTML = '<p style="color:red;">خطأ في تحميل السورة، حاول مرة أخرى</p>';
            }
        } catch(e) {
            content.innerHTML = '<p style="color:red;">فشل الاتصال بالإنترنت أو الخادم</p>';
        }
    };
    
    window.closeQuranViewer = function() {
        document.getElementById('quranViewer').classList.add('hidden');
    };
    
    // ===================== إظهار الأقسام =====================
    window.showSection = function(section) {
        mainContainer.style.display = 'none';
        prayerSection.style.display = 'none';
        quranSection.style.display = 'none';
        
        if(section === 'main') {
            mainContainer.style.display = 'block';
        } else if(section === 'prayer') {
            prayerSection.style.display = 'block';
            fetchPrayerTimes();
        } else if(section === 'quran') {
            quranSection.style.display = 'block';
            buildSuraList();
        }
    };
    
    // ===================== تسجيل الدخول والخروج =====================
    function showError(text) { errorMsg.innerText = text; errorMsg.style.display = 'block'; setTimeout(() => errorMsg.style.display = 'none', 4000); }
    function showLoading(show) { loadingMsg.style.display = show ? 'block' : 'none'; }
    
    async function signIn() {
        showLoading(true);
        try {
            const result = await auth.signInWithPopup(provider);
            const user = result.user;
            loginOverlay.style.display = 'none';
            userBar.style.display = 'flex';
            mainContainer.style.display = 'block';
            document.getElementById('userName').innerText = user.displayName || user.email;
            document.getElementById('userAvatar').src = user.photoURL || 'https://ui-avatars.com/api/?background=da291c&color=fff&name=' + (user.displayName ? user.displayName.charAt(0) : 'A');
        } catch(err) {
            if(err.code === 'auth/popup-blocked') showError('⚠️ السماح بالنوافذ المنبثقة');
            else showError('خطأ: ' + err.message);
        } finally { showLoading(false); }
    }
    
    async function signOut() {
        await auth.signOut();
        loginOverlay.style.display = 'flex';
        userBar.style.display = 'none';
        mainContainer.style.display = 'none';
        prayerSection.style.display = 'none';
        quranSection.style.display = 'none';
        if(blockerCheckInterval) clearInterval(blockerCheckInterval);
        if(countdownInterval) clearInterval(countdownInterval);
    }
    
    auth.onAuthStateChanged((user) => {
        if(user) {
            loginOverlay.style.display = 'none';
            userBar.style.display = 'flex';
            mainContainer.style.display = 'block';
            document.getElementById('userName').innerText = user.displayName || user.email;
            document.getElementById('userAvatar').src = user.photoURL || 'https://ui-avatars.com/api/?background=da291c&color=fff&name=' + (user.displayName ? user.displayName.charAt(0) : 'A');
        } else {
            loginOverlay.style.display = 'flex';
            userBar.style.display = 'none';
            mainContainer.style.display = 'none';
        }
    });
    
    document.getElementById('googleLoginBtn').onclick = signIn;
    document.getElementById('logoutBtn').onclick = signOut;
</script>
