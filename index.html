<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ديسكورد الأردن | مكالمات صوتية وفيديو + مشاركة شاشة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1f22;
            color: #dbdee1;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        /* الشريط الجانبي للخوادم */
        .servers-sidebar {
            width: 72px;
            background-color: #1e1f22;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 12px;
            gap: 8px;
            overflow-y: auto;
            border-left: 1px solid #2b2d31;
        }

        .server-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #2b2d31;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 24px;
        }

        .server-icon:hover {
            border-radius: 16px;
            background: #5865f2;
        }

        .server-icon.active {
            border-radius: 16px;
            background: #5865f2;
        }

        .server-icon.active::before {
            content: '';
            position: absolute;
            left: -12px;
            width: 4px;
            height: 20px;
            background: white;
            border-radius: 4px;
        }

        .add-server {
            background: #2b2d31;
            color: #23a559;
            font-size: 28px;
            font-weight: bold;
        }

        .add-server:hover {
            background: #23a559;
            color: white;
        }

        /* شريط القنوات */
        .channels-sidebar {
            width: 260px;
            background-color: #2b2d31;
            display: flex;
            flex-direction: column;
        }

        .server-header {
            padding: 16px;
            border-bottom: 1px solid #1e1f22;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .channels-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .channel-category {
            margin-top: 16px;
        }

        .category-name {
            font-size: 12px;
            color: #949ba4;
            padding: 8px;
        }

        .channel {
            padding: 6px 8px;
            margin: 2px 0;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #949ba4;
            font-size: 14px;
        }

        .channel:hover {
            background: #35373c;
            color: #dbdee1;
        }

        .channel.active {
            background: #35373c;
            color: #dbdee1;
        }

        .voice-channel {
            color: #23a559;
        }

        /* منطقة المحادثة */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #313338;
        }

        .chat-header {
            padding: 16px;
            border-bottom: 1px solid #1e1f22;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .voice-controls {
            display: flex;
            gap: 10px;
        }

        .voice-btn {
            background: #4e5058;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .voice-btn:hover {
            background: #5865f2;
        }

        .voice-btn.mic-off {
            background: #ed4245;
        }

        .screen-share-btn.active {
            background: #ed4245;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 16px;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #5865f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .message-content {
            flex: 1;
        }

        .message-header {
            display: flex;
            gap: 8px;
            align-items: baseline;
            margin-bottom: 4px;
        }

        .message-username {
            font-weight: bold;
            color: white;
        }

        .message-time {
            font-size: 11px;
            color: #949ba4;
        }

        .message-text {
            word-wrap: break-word;
        }

        .message-input-area {
            padding: 16px;
            background: #313338;
            border-top: 1px solid #1e1f22;
        }

        .message-input-wrapper {
            background: #383a40;
            border-radius: 8px;
            padding: 10px 16px;
        }

        .message-input {
            width: 100%;
            background: none;
            border: none;
            color: #dbdee1;
            font-size: 14px;
            outline: none;
            resize: none;
            font-family: inherit;
        }

        /* نافذة الفيديو */
        .video-panel {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 320px;
            background: #1e1f22;
            border-radius: 12px;
            border: 2px solid #5865f2;
            overflow: hidden;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .video-header {
            background: #2b2d31;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
        }

        .video-header button {
            background: #ed4245;
            border: none;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }

        .local-video, .remote-video {
            width: 100%;
            background: #000;
        }

        video {
            width: 100%;
            height: auto;
            background: #000;
        }

        .remote-video {
            border-top: 1px solid #2b2d31;
        }

        .member-status {
            font-size: 10px;
            color: #23a559;
        }

        @media (max-width: 768px) {
            .video-panel {
                width: 260px;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e1f22;
        }

        ::-webkit-scrollbar-thumb {
            background: #35373c;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- شريط الخوادم الأردنية -->
        <div class="servers-sidebar" id="serversSidebar">
            <div class="server-icon active" data-server="amman">
                🇯🇴
            </div>
            <div class="server-icon" data-server="gamers">
                🎮
            </div>
            <div class="server-icon" data-server="study">
                📚
            </div>
            <div class="server-icon add-server" id="addServerBtn">
                +
            </div>
        </div>

        <!-- شريط القنوات -->
        <div class="channels-sidebar" id="channelsSidebar">
            <div class="server-header" id="serverHeader">
                <span id="currentServerName">🇯🇴 عمان تاون</span>
                <span>▼</span>
            </div>
            <div class="channels-list" id="channelsList"></div>
        </div>

        <!-- منطقة الشات -->
        <div class="chat-area">
            <div class="chat-header">
                <span># <span id="currentChannelName">الترحيب</span></span>
                <div class="voice-controls" id="voiceControls">
                    <button class="voice-btn" id="micBtn">🎤 كتم</button>
                    <button class="voice-btn screen-share-btn" id="screenShareBtn">🖥️ مشاركة شاشة</button>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer"></div>

            <div class="message-input-area">
                <div class="message-input-wrapper">
                    <textarea class="message-input" id="messageInput" placeholder="أرسل رسالة... (Enter للإرسال)" rows="1"></textarea>
                </div>
            </div>
        </div>
    </div>

    <!-- نافذة الفيديو -->
    <div class="video-panel" id="videoPanel" style="display: none;">
        <div class="video-header">
            <span>🎥 غرفة الصوت والفيديو</span>
            <button id="closeVideoBtn">✕ إغلاق</button>
        </div>
        <div class="local-video">
            <video id="localVideo" autoplay muted playsinline></video>
        </div>
        <div class="remote-video" id="remoteVideoContainer" style="display: none;">
            <video id="remoteVideo" autoplay playsinline></video>
        </div>
    </div>

    <script>
        // ============== الخوادم الأردنية ==============
        let currentUser = {
            id: 'user1',
            username: 'أبو الأردن',
            avatar: '🇯🇴'
        };

        let servers = {
            amman: {
                name: '🇯🇴 عمان تاون',
                icon: '🇯🇴',
                channels: [
                    { id: 'welcome', name: 'الترحيب', type: 'text' },
                    { id: 'general', name: 'سوالف عمان', type: 'text' },
                    { id: 'voice-amman', name: 'صوت عمان', type: 'voice' }
                ]
            },
            gamers: {
                name: '🎮 جيمرز الأردن',
                icon: '🎮',
                channels: [
                    { id: 'lfg', name: 'دور فريق', type: 'text' },
                    { id: 'valorant', name: 'فالورانت', type: 'text' },
                    { id: 'voice-gaming', name: 'صوت الجيمرز', type: 'voice' }
                ]
            },
            study: {
                name: '📚 دراسة الأردن',
                icon: '📚',
                channels: [
                    { id: 'study-general', name: 'مذاكرة عامة', type: 'text' },
                    { id: 'programming', name: 'برمجة', type: 'text' },
                    { id: 'voice-study', name: 'صوت المذاكرة', type: 'voice' }
                ]
            }
        };

        // الرسائل
        let messages = {
            amman_welcome: [
                { id: 1, username: 'أبو الأردن', avatar: '🇯🇴', text: 'أهلاً وسهلاً في خادم عمان تاون! 🌄', time: new Date().toLocaleTimeString() },
                { id: 2, username: 'النظام', avatar: '🤖', text: 'اضغط على "صوت عمان" عشان تبدأ مكالمة 🎙️', time: new Date().toLocaleTimeString() }
            ],
            amman_general: [
                { id: 1, username: 'عماني', avatar: '🏛️', text: 'شو أخباركم يا شباب؟', time: new Date().toLocaleTimeString() }
            ],
            gamers_lfg: [
                { id: 1, username: 'GamerJo', avatar: '🎮', text: 'حد معه فالورانت؟', time: new Date().toLocaleTimeString() }
            ],
            study_programming: [
                { id: 1, username: 'مطور', avatar: '💻', text: 'مين بحب يشتغل على مشروع React؟', time: new Date().toLocaleTimeString() }
            ]
        };

        let currentServer = 'amman';
        let currentChannel = 'welcome';

        // ============== WebRTC للمكالمات ==============
        let localStream = null;
        let peerConnection = null;
        let isInCall = false;
        let isMuted = false;
        let isScreenSharing = false;
        let originalStream = null;

        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        const videoPanel = document.getElementById('videoPanel');
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const remoteVideoContainer = document.getElementById('remoteVideoContainer');

        async function startCall() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                originalStream = localStream;
                localVideo.srcObject = localStream;

                peerConnection = new RTCPeerConnection(configuration);
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });

                peerConnection.ontrack = (event) => {
                    if (event.streams && event.streams[0]) {
                        remoteVideo.srcObject = event.streams[0];
                        remoteVideoContainer.style.display = 'block';
                    }
                };

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                simulateAnswer();

                videoPanel.style.display = 'block';
                isInCall = true;
                addSystemMessage('🎙️ دخلت غرفة الصوت والفيديو');
            } catch (error) {
                console.error(error);
                alert('بدك تسمح للمايك والكاميرا ☺️');
            }
        }

        async function simulateAnswer() {
            setTimeout(async () => {
                if (peerConnection && peerConnection.localDescription) {
                    const answer = { type: 'answer', sdp: peerConnection.localDescription.sdp };
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                }
            }, 1000);
        }

        function endCall() {
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            videoPanel.style.display = 'none';
            remoteVideoContainer.style.display = 'none';
            isInCall = false;
            isScreenSharing = false;
            document.getElementById('screenShareBtn').classList.remove('active');
            document.getElementById('screenShareBtn').textContent = '🖥️ مشاركة شاشة';
            document.getElementById('micBtn').textContent = '🎤 كتم';
            document.getElementById('micBtn').classList.remove('mic-off');
            addSystemMessage('🔇 غادرت غرفة الصوت والفيديو');
        }

        function toggleMute() {
            if (!localStream) return;
            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                isMuted = !isMuted;
                audioTrack.enabled = !isMuted;
                const micBtn = document.getElementById('micBtn');
                micBtn.textContent = isMuted ? '🎙️ الغاء كتم' : '🎤 كتم';
                micBtn.classList.toggle('mic-off', isMuted);
                addSystemMessage(isMuted ? '🔇 كتمت المايك' : '🎙️ فتحت المايك');
            }
        }

        async function toggleScreenShare() {
            if (!isInCall) {
                alert('اولا دخل ع غرفة الصوت 🎙️');
                return;
            }

            if (!isScreenSharing) {
                try {
                    const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                    const videoTrack = screenStream.getVideoTracks()[0];
                    const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                    
                    if (sender) sender.replaceTrack(videoTrack);

                    videoTrack.onended = () => stopScreenShare();

                    const audioTrack = localStream.getAudioTracks()[0];
                    const newStream = new MediaStream();
                    newStream.addTrack(videoTrack);
                    if (audioTrack) newStream.addTrack(audioTrack);
                    localStream = newStream;
                    localVideo.srcObject = localStream;

                    isScreenSharing = true;
                    const btn = document.getElementById('screenShareBtn');
                    btn.classList.add('active');
                    btn.textContent = '🖥️ ايقاف المشاركة';
                    addSystemMessage('🖥️ عم تشارك شاشتك');
                } catch (error) {
                    alert('بدك تسمح لمشاركة الشاشة');
                }
            } else {
                stopScreenShare();
            }
        }

        function stopScreenShare() {
            if (!isScreenSharing) return;
            if (originalStream) {
                const videoTrack = originalStream.getVideoTracks()[0];
                const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if (sender && videoTrack) sender.replaceTrack(videoTrack);
                localStream = originalStream;
                localVideo.srcObject = localStream;
            }
            isScreenSharing = false;
            const btn = document.getElementById('screenShareBtn');
            btn.classList.remove('active');
            btn.textContent = '🖥️ مشاركة شاشة';
            addSystemMessage('🖥️ وقفت مشاركة الشاشة');
        }

        // ============== دوال الدردشة ==============
        function getMessageKey(serverId, channelId) {
            return `${serverId}_${channelId}`;
        }

        function addMessage(text) {
            if (!text.trim()) return;
            const key = getMessageKey(currentServer, currentChannel);
            if (!messages[key]) messages[key] = [];
            
            messages[key].push({
                id: Date.now(),
                username: currentUser.username,
                avatar: currentUser.avatar,
                text: text.trim(),
                time: new Date().toLocaleTimeString('ar-EG')
            });
            
            renderMessages();
            const container = document.getElementById('messagesContainer');
            setTimeout(() => container.scrollTop = container.scrollHeight, 100);
        }

        function addSystemMessage(text) {
            const key = getMessageKey(currentServer, currentChannel);
            if (!messages[key]) messages[key] = [];
            messages[key].push({
                id: Date.now(),
                username: 'النظام',
                avatar: '⚙️',
                text: text,
                time: new Date().toLocaleTimeString('ar-EG')
            });
            renderMessages();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderMessages() {
            const key = getMessageKey(currentServer, currentChannel);
            const channelMessages = messages[key] || [];
            const container = document.getElementById('messagesContainer');
            
            if (channelMessages.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #949ba4;">💬 ما في رسائل، كون أول واحد يكتب!</div>';
                return;
            }
            
            container.innerHTML = channelMessages.map(msg => `
                <div class="message">
                    <div class="message-avatar">${msg.avatar}</div>
                    <div class="message-content">
                        <div class="message-header">
                            <span class="message-username">${msg.username}</span>
                            <span class="message-time">${msg.time}</span>
                        </div>
                        <div class="message-text">${escapeHtml(msg.text)}</div>
                    </div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }

        function renderServers() {
            document.querySelectorAll('.server-icon[data-server]').forEach(icon => {
                const serverId = icon.getAttribute('data-server');
                if (serverId === currentServer) icon.classList.add('active');
                else icon.classList.remove('active');
            });
        }

        function renderChannels() {
            const server = servers[currentServer];
            if (!server) return;
            document.getElementById('currentServerName').innerHTML = server.name;
            
            const channelsHtml = server.channels.map(channel => {
                const isActive = channel.id === currentChannel;
                const icon = channel.type === 'voice' ? '🔊' : '#';
                return `<div class="channel ${isActive ? 'active' : ''} ${channel.type === 'voice' ? 'voice-channel' : ''}" data-channel-id="${channel.id}">${icon} ${channel.name}</div>`;
            }).join('');
            
            document.getElementById('channelsList').innerHTML = channelsHtml;
            
            document.querySelectorAll('.channel').forEach(channel => {
                channel.addEventListener('click', (e) => {
                    const channelId = channel.getAttribute('data-channel-id');
                    if (channelId) {
                        currentChannel = channelId;
                        renderChannels();
                        renderMessages();
                        const channelName = servers[currentServer].channels.find(c => c.id === currentChannel)?.name || currentChannel;
                        document.getElementById('currentChannelName').innerHTML = channelName;
                        
                        // إذا كانت قناة صوتية
                        const isVoiceChannel = servers[currentServer].channels.find(c => c.id === currentChannel)?.type === 'voice';
                        if (isVoiceChannel && !isInCall) {
                            if (confirm('بدك تدخل غرفة الصوت والفيديو؟ 🎙️')) startCall();
                        }
                    }
                });
            });
        }

        function addNewServer() {
            const serverName = prompt('شو بدك تسمي الخادم الجديد؟');
            if (!serverName) return;
            
            const newServerId = 'server_' + Date.now();
            servers[newServerId] = {
                name: serverName,
                icon: '📁',
                channels: [
                    { id: 'general', name: 'العام', type: 'text' },
                    { id: 'voice', name: 'الصوت', type: 'voice' }
                ]
            };
            
            const serversSidebar = document.getElementById('serversSidebar');
            const addButton = document.getElementById('addServerBtn');
            const newIcon = document.createElement('div');
            newIcon.className = 'server-icon';
            newIcon.setAttribute('data-server', newServerId);
            newIcon.innerText = '📁';
            newIcon.addEventListener('click', () => {
                currentServer = newServerId;
                currentChannel = servers[newServerId].channels[0].id;
                renderServers();
                renderChannels();
                renderMessages();
                document.getElementById('currentChannelName').innerHTML = servers[newServerId].channels[0].name;
                if (isInCall) endCall();
            });
            serversSidebar.insertBefore(newIcon, addButton);
            
            currentServer = newServerId;
            currentChannel = servers[newServerId].channels[0].id;
            renderServers();
            renderChannels();
            renderMessages();
            document.getElementById('currentChannelName').innerHTML = servers[newServerId].channels[0].name;
            if (isInCall) endCall();
        }

        // ============== التهيئة ==============
        function init() {
            document.querySelectorAll('.server-icon[data-server]').forEach(icon => {
                icon.addEventListener('click', (e) => {
                    const serverId = icon.getAttribute('data-server');
                    if (serverId && servers[serverId]) {
                        currentServer = serverId;
                        currentChannel = servers[serverId].channels[0].id;
                        renderServers();
                        renderChannels();
                        renderMessages();
                        document.getElementById('currentChannelName').innerHTML = servers[serverId].channels[0].name;
                        if (isInCall) endCall();
                    }
                });
            });
            
            document.getElementById('addServerBtn').addEventListener('click', addNewServer);
            document.getElementById('micBtn').addEventListener('click', toggleMute);
            document.getElementById('screenShareBtn').addEventListener('click', toggleScreenShare);
            document.getElementById('closeVideoBtn').addEventListener('click', () => { if (isInCall) endCall(); else videoPanel.style.display = 'none'; });
            
            const messageInput = document.getElementById('messageInput');
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    const text = messageInput.value;
                    if (text.trim()) {
                        addMessage(text);
                        messageInput.value = '';
                    }
                }
            });
            
            messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 100) + 'px';
            });
            
            renderServers();
            renderChannels();
            renderMessages();
            document.getElementById('currentChannelName').innerHTML = servers.amman.channels[0].name;
        }
        
        init();
    </script>
</body>
</html>
