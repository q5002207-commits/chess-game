<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الجاسوس</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #162447;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 { color: #e43f5a; }
        input, button {
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            margin: 10px 5px;
        }
        input { width: 60%; background: #fff; color: #000; }
        button {
            background-color: #e43f5a;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background-color: #ff4a68; }
        .hidden { display: none; }
        .names-list {
            margin: 15px 0;
            text-align: right;
            background: #1f4068;
            padding: 10px;
            border-radius: 8px;
        }
        .player-card {
            background: #1f4068;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: 0.2s;
        }
        .player-card:hover { background: #e43f5a; }
        .word-display {
            font-size: 24px;
            color: #00fff0;
            margin-top: 10px;
            font-weight: bold;
        }
        .timer { font-size: 14px; color: #ff4a68; }
    </style>
</head>
<body>

<div class="container">
    <h1>🕵️‍♂️ لعبة الجاسوس</h1>
    <hr style="border-color: #e43f5a;">

    <!-- شاشة إدخال الأسماء -->
    <div id="setup-screen">
        <h3>أدخل أسماء اللاعبين (3 لاعبين على الأقل):</h3>
        <input type="text" id="name-input" placeholder="اسم اللاعب...">
        <button onclick="addPlayer()">إضافة</button>
        <div class="names-list" id="names-list">الأسماء المضافة: لم يتم إضافة أسماء بعد.</div>
        <button onclick="startGame()" style="width: 100%; background-color: #4eed50; color: #000; font-weight: bold;">ابدأ اللعبة 🚀</button>
    </div>

    <!-- شاشة توزيع الأدوار -->
    <div id="role-screen" class="hidden">
        <h3>اضغط على اسمك لرؤية مكانك (سيختفي بعد 4 ثوانٍ!)</h3>
        <div id="players-cards-container"></div>
        <button id="next-to-vote" class="hidden" onclick="showVoteScreen()" style="width: 100%;">الانتقال إلى التصويت 🗳️</button>
    </div>

    <!-- شاشة التصويت ونهاية الدور -->
    <div id="vote-screen" class="hidden">
        <h2>🗳️ وقت التصويت!</h2>
        <p>تناقشوا واعرفوا من هو الجاسوس.</p>
        <button onclick="revealSpy()" style="background-color: #00fff0; color: #000; font-weight: bold;">اكتشف من الجاسوس 👁️</button>
        <h3 id="spy-reveal" class="hidden" style="color: #4eed50; font-size: 24px;"></h3>
        
        <hr style="border-color: #e43f5a; margin-top: 20px;">
        <button onclick="restartGame(true)" style="background-color: #f39c12; width: 45%;">إعادة بنفس الأسماء 🔄</button>
        <button onclick="restartGame(false)" style="background-color: #c0392b; width: 45%;">شاشة رئيسية جديدة 🏠</button>
    </div>
</div>

<script>
    // قائمة الـ 40 كلمة المتنوعة
    const wordList = [
        "المستشفى", "المدرسة", "المطعم", "المطار", "محطة القطار", "الفندق", "المتحف", "حديقة الحيوان",
        "السينما", "الشاطئ", "المسبح", "السوبرماركت", "المطبخ", "المكتبة", "المركز التجاري", "الملعب",
        "البنك", "المكتب", "الغابة", "الصحراء", "الفضاء", "الغواصة", "الطائرة", "السفينة",
        "القلعة التاريخية", "معسكر الجيش", "السيرك", "صالون الحلاقة", "محطة الوقود", "المخبز", "المقهى", "الصيدلية",
        "النادي الرياضي", "المزرعة", "المصنع", "المحكمة", "المخفر", "الجامعة", "مسرح الجريمة", "الأهرامات"
    ];

    let players = [];
    let spyName = "";
    let selectedWord = "";
    let viewedCount = 0;

    function addPlayer() {
        const input = document.getElementById('name-input');
        const name = input.value.trim();
        if (name && !players.includes(name)) {
            players.push(name);
            updateNamesList();
            input.value = "";
            input.focus();
        }
    }

    function updateNamesList() {
        const listDiv = document.getElementById('names-list');
        if(players.length === 0) {
            listDiv.innerText = "الأسماء المضافة: لم يتم إضافة أسماء بعد.";
        } else {
            listDiv.innerText = "الأسماء المضافة: " + players.join(" ، ");
        }
    }

    function startGame() {
        if (players.length < 3) {
            alert("يجب إضافة 3 لاعبين على الأقل للعب!");
            return;
        }
        
        // اختيار الجاسوس والكلمة
        spyName = players[Math.floor(Math.random() * players.length)];
        selectedWord = wordList[Math.floor(Math.random() * wordList.length)];
        viewedCount = 0;

        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('role-screen').classList.remove('hidden');
        document.getElementById('next-to-vote').classList.add('hidden');

        renderPlayerCards();
    }

    function renderPlayerCards() {
        const container = document.getElementById('players-cards-container');
        container.innerHTML = "";

        players.forEach((player, index) => {
            const card = document.createElement('div');
            card.className = "player-card";
            card.id = `player-${index}`;
            card.innerText = player;
            card.onclick = () => revealCard(player, card, index);
            container.appendChild(card);
        });
    }

    function revealCard(playerName, cardElement, index) {
        // حماية حتى لا يضغط اللاعب مرتين
        if (cardElement.style.pointerEvents === "none") return;

        let content = (playerName === spyName) ? "🕵️‍♂️ أنت الجاسوس!" : `📍 المكان: ${selectedWord}`;
        
        cardElement.innerHTML = `
            <div>${playerName}</div>
            <div class="word-display">${content}</div>
            <div class="timer" id="timer-${index}">سيختفي بعد 4 ثوانٍ...</div>
        `;
        cardElement.style.pointerEvents = "none";
        cardElement.style.background = "#222";

        // إخفاء الاسم والكلمة تماماً بعد 4 ثوانٍ لمنع الغش
        setTimeout(() => {
            cardElement.innerHTML = "❌ تم الرؤية";
            cardElement.style.background = "#333";
            viewedCount++;
            
            // إذا شافوا كل اللاعبين كروتهم يظهر زر التصويت
            if (viewedCount === players.length) {
                document.getElementById('next-to-vote').classList.remove('hidden');
            }
        }, 4000);
    }

    function showVoteScreen() {
        document.getElementById('role-screen').classList.add('hidden');
        document.getElementById('vote-screen').classList.remove('hidden');
        document.getElementById('spy-reveal').classList.add('hidden');
    }

    function revealSpy() {
        const revealH3 = document.getElementById('spy-reveal');
        revealH3.innerText = `🕵️‍♂️ الجاسوس كان: ${spyName} \n 📍 المكان هو: ${selectedWord}`;
        revealH3.classList.remove('hidden');
    }

    function restartGame(keepNames) {
        if (!keepNames) {
            players = [];
            updateNamesList();
            document.getElementById('vote-screen').classList.add('hidden');
            document.getElementById('setup-screen').classList.remove('hidden');
        } else {
            document.getElementById('vote-screen').classList.add('hidden');
            startGame(); // يعيد تشغيل اللعبة مباشرة بنفس الأسماء الموجودة مسبقاً
        }
    }
</script>

</body>
</html>
