<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>بث مباشر - مباريات اليوم | مشاهدة بدون إعلانات منبثقة</title>
    <meta name="description" content="مشغل بث مباشر للمباريات مع حماية من النوافذ المنبثقة">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', sans-serif;
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .player-container {
            width: 100%;
            max-width: 1280px;
            background: #000;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .player-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 2px solid #e74c3c;
        }

        .player-header h2 {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            background: #e74c3c;
            color: white;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .quality-selector {
            background: #2c2c3a;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 13px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quality-selector select {
            background: #1a1a2e;
            border: none;
            color: #fff;
            padding: 4px 8px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            background: #000;
        }

        iframe {
            display: block;
            width: 100%;
            height: 550px;
            border: none;
        }

        .controls-bar {
            background: #111;
            padding: 12px 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .info-bar {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #aaa;
        }

        .info-item::before {
            content: "✓";
            color: #27ae60;
            font-weight: bold;
        }

        .fullscreen-btn {
            background: #2c2c3a;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .fullscreen-btn:hover {
            background: #e74c3c;
        }

        .warning-box {
            background: #1a1a1a;
            padding: 14px 20px;
            text-align: center;
            font-size: 12px;
            color: #f39c12;
            border-top: 1px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .warning-box a {
            color: #3498db;
            text-decoration: none;
        }

        .warning-box a:hover {
            text-decoration: underline;
        }

        .adblock-tip {
            background: #2c2c2c;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 11px;
            color: #27ae60;
        }

        footer {
            background: #0a0a0a;
            padding: 12px;
            text-align: center;
            font-size: 11px;
            color: #555;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            iframe {
                height: 300px;
            }
            .player-header h2 {
                font-size: 14px;
            }
            .info-bar {
                gap: 10px;
            }
            .info-item {
                font-size: 10px;
            }
            .quality-selector {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="player-header">
            <h2>
                ⚽ بث مباشر
                <span class="badge">LIVE</span>
            </h2>
            <div class="quality-selector">
                📡 الجودة:
                <select id="qualitySelect">
                    <option value="https://eyj0exaioijkv1qilcjhbgcioijiuzi1nij99ds.zliymordanex.sbs/playerv5.php?match=4452574&key=c0ae1abba6eebd7e6cc5b88b1d2B71547">HD - الرئيسي</option>
                </select>
            </div>
        </div>

        <div class="player-wrapper">
            <iframe
                id="mainPlayer"
                src="https://eyj0exaioijkv1qilcjhbgcioijiuzi1nij99ds.zliymordanex.sbs/playerv5.php?match=4452574&key=c0ae1abba6eebd7e6cc5b88b1d2B71547"
                width="100%"
                height="550"
                frameborder="0"
                allowfullscreen
                sandbox="allow-same-origin allow-scripts allow-modals"
                referrerpolicy="no-referrer"
                allow="autoplay; fullscreen">
            </iframe>
        </div>

        <div class="controls-bar">
            <div class="info-bar">
                <div class="info-item">تم منع النوافذ المنبثقة</div>
                <div class="info-item">حماية الخصوصية</div>
                <div class="info-item">بث مباشر بدون تقطيع</div>
            </div>
            <button class="fullscreen-btn" id="fullscreenBtn" onclick="toggleFullscreen()">⛶ ملء الشاشة</button>
        </div>

        <div class="warning-box">
            <span>🛡️</span>
            <span>تم تفعيل الحماية من الإعلانات المنبثقة</span>
            <span class="adblock-tip">✓ يفضل استخدام متصفح مع uBlock Origin للتجربة المثالية</span>
        </div>

        <footer>
            لمشاهدة أفضل • يفضل استخدام متصفح Chrome أو Firefox مع إضافة uBlock Origin
        </footer>
    </div>

    <script>
        // تبديل الجودة (يمكنك إضافة روابط بديلة هنا)
        const qualitySelect = document.getElementById('qualitySelect');
        const mainPlayer = document.getElementById('mainPlayer');

        if (qualitySelect) {
            qualitySelect.addEventListener('change', function() {
                const newUrl = this.value;
                if (newUrl) {
                    mainPlayer.src = newUrl;
                }
            });
        }

        // وظيفة ملء الشاشة
        function toggleFullscreen() {
            const playerContainer = document.querySelector('.player-wrapper');
            if (!document.fullscreenElement) {
                playerContainer.requestFullscreen().catch(err => {
                    console.log(`خطأ في ملء الشاشة: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // منع F12 و右键 (حماية بسيطة للمشغل)
        document.addEventListener('contextmenu', function(e) {
            if (e.target.closest('.player-wrapper')) {
                e.preventDefault();
            }
        });

        // تنبيه إذا كان AdBlock مفعل (اختياري)
        function checkAdBlock() {
            const adBlockDetected = document.createElement('div');
            adBlockDetected.className = 'adsbox';
            document.body.appendChild(adBlockDetected);
            setTimeout(() => {
                if (adBlockDetected.offsetHeight === 0) {
                    console.log('AdBlock غير مفعل - ننصح بتثبيت uBlock Origin');
                }
                adBlockDetected.remove();
            }, 100);
        }
        checkAdBlock();
    </script>
</body>
</html>
